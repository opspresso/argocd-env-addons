rule_files:
- rules.yaml
evaluation_interval: 30s
tests:
- name: zero Pods alert after ten minutes and same-name Deployment or another cluster cannot hide the StatefulSet outage
  interval: 1m
  input_series:
  - series: kube_statefulset_replicas{cluster="demo",namespace="apps",statefulset="shared"}
    values: 2+0x15
  - series: kube_statefulset_status_replicas_available{cluster="demo",namespace="apps",statefulset="shared"}
    values: 0+0x15
  - series: kube_deployment_spec_replicas{cluster="demo",namespace="apps",deployment="shared"}
    values: 3+0x15
  - series: kube_deployment_status_replicas_available{cluster="demo",namespace="apps",deployment="shared"}
    values: 3+0x15
  - series: kube_statefulset_replicas{cluster="other",namespace="apps",statefulset="shared"}
    values: 2+0x15
  - series: kube_statefulset_status_replicas_available{cluster="other",namespace="apps",statefulset="shared"}
    values: 2+0x15
  - series: kube_statefulset_labels{cluster="demo",namespace="apps",statefulset="shared"}
    values: 1+0x15
  alert_rule_test:
  - eval_time: 9m
    alertname: addons-workload-unavailable
    exp_alerts: []
  - eval_time: 11m
    alertname: addons-workload-unavailable
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        workload: shared
        workload_type: statefulset
  - eval_time: 4m
    alertname: addons-deployment-replicas-unavailable
    exp_alerts: []
  promql_expr_test:
  - dashboard_query:
      panel_id: 101
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 2
  - dashboard_query:
      panel_id: 27
      ref: B
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - dashboard_variable: workload
    eval_time: 4m
    exp_samples:
    - labels: '{cluster="demo",namespace="apps",workload="shared",workload_type="statefulset"}'
      value: 1
- name: scaled-to-zero controllers are not outages
  interval: 1m
  input_series:
  - series: kube_statefulset_replicas{cluster="demo",namespace="apps",statefulset="shared"}
    values: 0+0x10
  - series: kube_statefulset_status_replicas_available{cluster="demo",namespace="apps",statefulset="shared"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: addons-workload-unavailable
    exp_alerts: []
  - eval_time: 5m
    alertname: addons-deployment-replicas-unavailable
    exp_alerts: []
  promql_expr_test:
  - dashboard_query:
      panel_id: 101
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
- name: OOM alerts immediately with owner context and retains unmanaged Pod coverage
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="shared-0",workload="shared",workload_type="statefulset"}
    values: 1+0x10
  - series: kube_pod_container_status_restarts_total{cluster="demo",namespace="apps",pod="shared-0",container="app"}
    values: 0 1+0x9
  - series: kube_pod_container_status_last_terminated_reason{cluster="demo",namespace="apps",pod="shared-0",container="app",reason="OOMKilled"}
    values: 1+0x10
  - series: kube_pod_container_status_restarts_total{cluster="demo",namespace="apps",pod="bare",container="app"}
    values: 0 1+0x9
  - series: kube_pod_container_status_last_terminated_reason{cluster="demo",namespace="apps",pod="bare",container="app",reason="OOMKilled"}
    values: 1+0x10
  - series: kube_pod_init_container_status_restarts_total{cluster="demo",namespace="apps",pod="shared-0",container="istio-proxy"}
    values: 0 1+0x9
  - series: kube_pod_init_container_status_last_terminated_reason{cluster="demo",namespace="apps",pod="shared-0",container="istio-proxy",reason="OOMKilled"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 2m
    alertname: addons-pod-oom-killed
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: shared-0
        container: app
        workload: shared
        workload_type: statefulset
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: bare
        container: app
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: shared-0
        container: istio-proxy
        workload: shared
        workload_type: statefulset
- name: image pull failure retains namespace workload and reason
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="shared-0",workload="shared",workload_type="statefulset"}
    values: 1+0x10
  - series: kube_pod_container_status_waiting_reason{cluster="demo",namespace="apps",pod="shared-0",container="app",reason="ImagePullBackOff"}
    values: 1+0x10
  - series: kube_pod_info{cluster="demo",namespace="apps",pod="shared-0",node="node-a"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-start-failed
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: shared-0
        container: app
        reason: ImagePullBackOff
        workload: shared
        workload_type: statefulset
  promql_expr_test:
  - dashboard_query:
      panel_id: 110
    eval_time: 3m
    exp_samples:
    - labels: '{cluster="demo",namespace="apps",pod="shared-0",container="app",node="node-a",reason="ImagePullBackOff",workload="shared",workload_type="statefulset"}'
      value: 1
  - dashboard_query:
      panel_id: 102
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
- name: memory above limit warns per container including sidecars
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="shared-0",workload="shared",workload_type="statefulset"}
    values: 1+0x10
  - series: container_memory_working_set_bytes{cluster="demo",namespace="apps",pod="shared-0",container="istio-proxy"}
    values: 950+0x10
  - series: kube_pod_init_container_resource_limits{cluster="demo",namespace="apps",pod="shared-0",container="istio-proxy",resource="memory"}
    values: 1000+0x10
  - series: kube_pod_init_container_status_running{cluster="demo",namespace="apps",pod="shared-0",container="istio-proxy"}
    values: 1+0x10
  - series: kube_pod_init_container_resource_limits{cluster="demo",namespace="apps",pod="shared-0",container="setup",resource="memory"}
    values: 10000+0x10
  - series: kube_pod_init_container_status_running{cluster="demo",namespace="apps",pod="shared-0",container="setup"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-memory-limit
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: shared-0
        container: istio-proxy
        workload: shared
        workload_type: statefulset
  promql_expr_test:
  - dashboard_query:
      panel_id: 106
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 95
  - dashboard_query:
      panel_id: 306
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 95
- name: missing and zero limits are excluded instead of becoming healthy zero or infinity
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="shared-0",workload="shared",workload_type="statefulset"}
    values: 1+0x10
  - series: container_memory_working_set_bytes{cluster="demo",namespace="apps",pod="shared-0",container="app"}
    values: 950+0x10
  - series: kube_pod_container_resource_limits{cluster="demo",namespace="apps",pod="shared-0",container="app",resource="memory"}
    values: 0+0x10
  - series: kube_pod_container_resource_limits{cluster="other",namespace="apps",pod="shared-0",container="app",resource="memory"}
    values: 1000+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-memory-limit
    exp_alerts: []
  promql_expr_test:
  - dashboard_query:
      panel_id: 106
      ref: A
    eval_time: 4m
    exp_samples: []
- name: 100 percent HTTP failures have a numerator even without any successful series
  interval: 1m
  input_series:
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="shared",destination_service_name="shared",response_code="500"}
    values: 0+60x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-http-errors
    exp_alerts:
    - exp_labels:
        cluster: demo
        destination_service_namespace: apps
        destination_service_name: shared
        namespace: apps
  promql_expr_test:
  - dashboard_query:
      panel_id: 105
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 100
- name: transport response code zero is a failure
  interval: 1m
  input_series:
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="shared",destination_service_name="shared",response_code="0"}
    values: 0+60x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-http-errors
    exp_alerts:
    - exp_labels:
        cluster: demo
        destination_service_namespace: apps
        destination_service_name: shared
        namespace: apps
  promql_expr_test:
  - dashboard_query:
      panel_id: 105
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 100
- name: traffic-free services are neither unhealthy nor proven healthy
  interval: 1m
  input_series:
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="shared",destination_service_name="shared",response_code="200"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-http-errors
    exp_alerts: []
  promql_expr_test:
  - dashboard_query:
      panel_id: 105
      ref: A
    eval_time: 4m
    exp_samples: []
- name: another namespace and workload do not pollute the selected service error panel
  interval: 1m
  input_series:
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="shared",destination_service_name="shared",response_code="200"}
    values: 0+60x10
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="other",destination_workload_namespace="other",destination_workload="shared",destination_service_name="shared",response_code="500"}
    values: 0+60x10
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="other",destination_service_name="shared",response_code="500"}
    values: 0+60x10
  promql_expr_test:
  - dashboard_query:
      panel_id: 105
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
- name: aggregate gauges include unlimited container usage in the total
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="shared-0",workload="shared",workload_type="statefulset"}
    values: 1+0x10
  - series: container_memory_working_set_bytes{cluster="demo",namespace="apps",pod="shared-0",container="app"}
    values: 100+0x10
  - series: container_memory_working_set_bytes{cluster="demo",namespace="apps",pod="shared-0",container="unlimited"}
    values: 5000+0x10
  - series: kube_pod_container_resource_limits{cluster="demo",namespace="apps",pod="shared-0",container="app",resource="memory"}
    values: 1000+0x10
  promql_expr_test:
  - dashboard_query:
      panel_id: 306
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 510
- name: critical pressure and storage distinguish affected resources
  interval: 1m
  input_series:
  - series: kubelet_volume_stats_used_bytes{cluster="demo",namespace="apps",persistentvolumeclaim="full"}
    values: 96+0x5
  - series: kubelet_volume_stats_capacity_bytes{cluster="demo",namespace="apps",persistentvolumeclaim="full"}
    values: 100+0x5
  - series: kubelet_volume_stats_used_bytes{cluster="demo",namespace="apps",persistentvolumeclaim="safe"}
    values: 90+0x5
  - series: kubelet_volume_stats_capacity_bytes{cluster="demo",namespace="apps",persistentvolumeclaim="safe"}
    values: 100+0x5
  alert_rule_test:
  - eval_time: 3m
    alertname: addons-pvc-critical
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        persistentvolumeclaim: full
- name: usage remains visible when requests and limits are absent
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="shared-0",workload="shared",workload_type="statefulset"}
    values: 1+0x5
  - series: container_cpu_usage_seconds_total{cluster="demo",namespace="apps",pod="shared-0",container="app"}
    values: 0+60x5
  - series: container_memory_working_set_bytes{cluster="demo",namespace="apps",pod="shared-0",container="app"}
    values: 100+0x5
  promql_expr_test:
  - dashboard_query:
      panel_id: 310
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - dashboard_query:
      panel_id: 313
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 100
  - dashboard_query:
      panel_id: 311
    eval_time: 4m
    exp_samples: []
  - dashboard_query:
      panel_id: 315
    eval_time: 4m
    exp_samples: []
- name: All totals include controller kinds namespaces and standalone Pods without double counting
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="dep",workload="shared",workload_type="deployment"}
    values: 1+0x5
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="other",pod="sts",workload="db",workload_type="statefulset"}
    values: 1+0x5
  - series: kube_pod_info{cluster="demo",namespace="apps",pod="dep",node="node1"}
    values: 1+0x5
  - series: kube_pod_info{cluster="demo",namespace="other",pod="solo",node="node2"}
    values: 1+0x5
  - series: container_memory_working_set_bytes{cluster="demo",namespace="apps",pod="dep",container="app"}
    values: 100+0x5
  - series: container_memory_working_set_bytes{cluster="demo",namespace="other",pod="sts",container="app"}
    values: 200+0x5
  - series: container_memory_working_set_bytes{cluster="demo",namespace="other",pod="solo",container="app"}
    values: 400+0x5
  - series: container_memory_working_set_bytes{cluster="unselected",namespace="apps",pod="dep",container="app"}
    values: 10000+0x5
  - series: kube_pod_container_resource_requests{cluster="demo",namespace="apps",pod="dep",container="app",resource="memory"}
    values: 1000+0x5
  - series: kube_pod_container_resource_requests{cluster="demo",namespace="other",pod="sts",container="app",resource="memory"}
    values: 2000+0x5
  - series: kube_deployment_spec_replicas{cluster="demo",namespace="apps",deployment="shared"}
    values: 3+0x5
  - series: kube_statefulset_replicas{cluster="demo",namespace="other",statefulset="db"}
    values: 2+0x5
  promql_expr_test:
  - dashboard_query:
      panel_id: 313
      namespace: .*
      workload: .*
      workload_type: .*
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 700
  - dashboard_query:
      panel_id: 314
      namespace: .*
      workload: .*
      workload_type: .*
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 3000
  - dashboard_query:
      panel_id: 305
      namespace: .*
      workload: .*
      workload_type: .*
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 23.333333333333332
  - dashboard_query:
      panel_id: 301
      namespace: .*
      workload: .*
      workload_type: .*
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 5
  - dashboard_query:
      panel_id: 313
      workload_type: deployment
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 100
  - dashboard_query:
      panel_id: 313
      namespace: other
      workload: db
      workload_type: statefulset
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 200
- name: partial availability warns after ten minutes
  interval: 1m
  input_series:
  - series: kube_statefulset_replicas{cluster="demo",namespace="apps",statefulset="shared"}
    values: 3+0x15
  - series: kube_statefulset_status_replicas_available{cluster="demo",namespace="apps",statefulset="shared"}
    values: 1+0x15
  alert_rule_test:
  - eval_time: 9m
    alertname: addons-deployment-replicas-unavailable
    exp_alerts: []
  - eval_time: 11m
    alertname: addons-workload-unavailable
    exp_alerts: []
  - eval_time: 11m
    alertname: addons-deployment-replicas-unavailable
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        workload: shared
        workload_type: statefulset
- name: client disconnects are not service failures
  interval: 1m
  input_series:
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="shared",destination_service_name="shared",response_code="0",response_flags="DC"}
    values: 0+60x10
  - series: istio_requests_total{cluster="demo",reporter="source",destination_service_namespace="apps",destination_workload_namespace="apps",destination_workload="shared",destination_service_name="shared",response_code="200",response_flags="-"}
    values: 0+60x10
  alert_rule_test:
  - eval_time: 6m
    alertname: addons-workload-http-errors
    exp_alerts: []
  promql_expr_test:
  - dashboard_query:
      panel_id: 105
      ref: A
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
- name: a lasting CrashLoopBackOff alerts per container while a few startup restarts stay quiet
  interval: 1m
  input_series:
  - series: namespace_workload_pod:kube_pod_owner:relabel{cluster="demo",namespace="apps",pod="web-1",workload="web",workload_type="deployment"}
    values: 1+0x20
  # Back-off with short runs in between (the series goes stale while the
  # container runs): the 5-minute window bridges the gaps.
  - series: kube_pod_container_status_waiting_reason{cluster="demo",namespace="apps",pod="web-1",container="app",reason="CrashLoopBackOff"}
    values: 1 1 stale 1 1 1 stale _ 1 1 1 1 stale _ _ 1 1 1 1 1 1
  # Unowned Pod keeps coverage without owner labels.
  - series: kube_pod_init_container_status_waiting_reason{cluster="demo",namespace="apps",pod="bare",container="init",reason="CrashLoopBackOff"}
    values: 1+0x20
  # Two back-offs while a dependency starts, then the container runs.
  - series: kube_pod_container_status_waiting_reason{cluster="demo",namespace="apps",pod="api-1",container="app",reason="CrashLoopBackOff"}
    values: 1 1 1 stale _x17
  alert_rule_test:
  - eval_time: 9m
    alertname: addons-pod-crash-looping
    exp_alerts: []
  - eval_time: 12m
    alertname: addons-pod-crash-looping
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: web-1
        container: app
        workload: web
        workload_type: deployment
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: bare
        container: init
- name: Argo CD applications alert only after Degraded or Unknown persists
  interval: 1m
  input_series:
  # Labels differ between controller Pods and operations; the rule merges them.
  - series: argocd_app_info{cluster="demo",name="broken",project="addons",health_status="Degraded",sync_status="Synced",instance="a"}
    values: 1+0x6 stale _x13
  - series: argocd_app_info{cluster="demo",name="broken",project="addons",health_status="Degraded",sync_status="Synced",instance="b"}
    values: _x7 1+0x13
  - series: argocd_app_info{cluster="demo",name="rollout",project="apps",health_status="Degraded",sync_status="Synced"}
    values: 1+0x4 stale _x15
  - series: argocd_app_info{cluster="demo",name="rollout",project="apps",health_status="Healthy",sync_status="Synced"}
    values: _x5 1+0x15
  - series: argocd_app_info{cluster="demo",name="stuck",project="apps",health_status="Healthy",sync_status="Unknown"}
    values: 1+0x20
  - series: argocd_app_info{cluster="demo",name="deleted",project="apps",health_status="Healthy",sync_status="Unknown"}
    values: 1+0x5 stale
  alert_rule_test:
  - eval_time: 12m
    alertname: addons-argocd-app-degraded
    exp_alerts:
    - exp_labels:
        cluster: demo
        project: addons
        application: broken
  - eval_time: 14m
    alertname: addons-argocd-app-sync-unknown
    exp_alerts: []
  - eval_time: 17m
    alertname: addons-argocd-app-sync-unknown
    exp_alerts:
    - exp_labels:
        cluster: demo
        project: apps
        application: stuck
- name: a recent pod failure alerts once while Job, Workflow, shutdown and old failures stay quiet
  interval: 5m
  input_series:
  - series: kube_pod_status_phase{cluster="demo",namespace="apps",pod="new",phase="Failed"}
    values: _x14 1+0x20
  - series: kube_pod_status_phase{cluster="demo",namespace="apps",pod="old",phase="Failed"}
    values: 1+0x34
  - series: kube_pod_status_phase{cluster="demo",namespace="apps",pod="job-x",phase="Failed"}
    values: _x14 1+0x20
  - series: kube_pod_owner{cluster="demo",namespace="apps",pod="job-x",owner_kind="Job",owner_name="x"}
    values: _x14 1+0x20
  - series: kube_pod_status_phase{cluster="demo",namespace="apps",pod="drained",phase="Failed"}
    values: _x14 1+0x20
  - series: kube_pod_status_reason{cluster="demo",namespace="apps",pod="drained",reason="Terminated"}
    values: _x14 1+0x20
  alert_rule_test:
  - eval_time: 80m
    alertname: addons-pods-failed
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: new
  - eval_time: 135m
    alertname: addons-pods-failed
    exp_alerts: []
- name: a failed Job alerts within the hour after it fails
  interval: 5m
  input_series:
  - series: kube_job_failed{cluster="demo",namespace="apps",job_name="backup",condition="true"}
    values: 0+0x14 1+0x20
  alert_rule_test:
  - eval_time: 75m
    alertname: addons-job-failed
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        job_name: backup
  - eval_time: 140m
    alertname: addons-job-failed
    exp_alerts: []
- name: pods unschedulable for ten minutes alert while short scheduling waits stay quiet
  interval: 1m
  input_series:
  - series: kube_pod_status_unschedulable{cluster="demo",namespace="apps",pod="stuck"}
    values: 1+0x15
  - series: kube_pod_status_unschedulable{cluster="demo",namespace="apps",pod="brief"}
    values: 1 1 1 _x12
  alert_rule_test:
  - eval_time: 11m
    alertname: addons-pod-unschedulable
    exp_alerts:
    - exp_labels:
        cluster: demo
        namespace: apps
        pod: stuck
