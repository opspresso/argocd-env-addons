cluster: eks-demo-a

active: "true"
country: kr
env: eks
group: eks-demo-a
role: service

aws_account_id: "396608815058"
aws_region: ap-northeast-2

vpcId: vpc-04945243dfefd3988

hostname:
  internal: demo-in.opspresso.com
  public: demo.opspresso.com

argo_workflows:
  github:
    org: opspresso # github org
    team: sre

cluster_autoscaler:
  scan_interval: 20s
  scale_down_delay_after_delete: 1m
  scale_down_utilization_threshold: 0.6

istio:
  global:
    hub: gcr.io/istio-release
  pilot:
    autoscale: false
    min: 2
    max: 6
  gateway:
    autoscale: false
    min: 2
    max: 6
  tracing:
    sampling: 10
  target_group: http_a
  target_group_public: h1_a

target_group:
  internal_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-a/f24c46ca08792921
  public_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-a/8f80cd6cc521f18a

prometheus:
  serviceMonitor:
    enabled: true

metrics:
  backend: prometheus

loki:
  hostname: loki.demo-in.opspresso.com
