cluster: k3s-demo

active: "true"
country: kr
env: k3s
group: k3s-demo
role: k3s

# k3s에서는 EKS Pod Identity와 AWS ALB/EBS를 사용하지 않습니다.
external_secrets: false

hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev

argocd:
  hostname: argocd.demo.opsp.dev
  github:
    org: opspresso
    team: sre
  google:
    enabled: false
  chatUrl: ""

istio:
  global:
    hub: gcr.io/istio-release
  pilot:
    autoscale: false
    min: 1
    max: 1
  gateway:
    autoscale: false
    min: 1
    max: 1

prometheus:
  serviceMonitor:
    enabled: false
