cluster: k3s-demo

active: "true"
country: kr
env: k3s
group: k3s-demo
role: k3s
aws_region: ap-northeast-2

grafana_cloud:
  remote_write_url: https://prometheus-us-central1.grafana.net/api/prom/push
  remote_write_username: "2124611"

resources:
  enabled: false
autoscaling:
  enabled: false

# k3s에서는 EKS Pod Identity와 AWS ALB/EBS를 사용하지 않습니다.
external_secrets: true

hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev

argocd:
  hostname: argocd.demo.opsp.dev
  replicas:
    server: 1
    repo_server: 1
    application_set: 1
  resources:
    enabled: false
  autoscaling:
    enabled: false
  dex:
    enabled: false
  notifications:
    enabled: false
  http_route:
    enabled: true
    parent_refs:
      - name: traefik-gateway
        namespace: traefik-gateway
  github:
    org: opspresso
    team: sre
  google:
    enabled: false
  chatUrl: ""

prometheus:
  serviceMonitor:
    enabled: false

gateway:
  name: traefik-gateway
  namespace: traefik-gateway
  class_name: traefik
  listener_port: 8443
  hosts:
    - '*.demo.opsp.dev'
    - demo.opsp.dev
  tls:
    secret_name: traefik-gateway-tls
    issuer_name: letsencrypt-prod
