cluster: k3s-demo

active: "true"
country: kr
env: k3s
group: k3s-demo
role: k3s

aws_account_id: "396608815058"
aws_region: ap-northeast-2
aws_environment: demo

hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev

resources:
  enabled: false
autoscaling:
  enabled: false

argocd:
  hostname: argocd.demo.opsp.dev
  replicas:
    server: 1
    repo_server: 1
    application_set: 1
  dex:
    enabled: true
  notifications:
    enabled: false
  http_route:
    enabled: true
    parent_refs:
      - name: traefik-gateway
        namespace: traefik-gateway
  github:
    org: opspresso
    team: sre
  google:
    enabled: false
  chatUrl: ""

prometheus:
  serviceMonitor:
    enabled: false

metrics:
  backend: grafana-cloud

grafana_cloud:
  remote_write_url: https://prometheus-us-central1.grafana.net/api/prom/push
  remote_write_username: "2124611"

grafana:
  hostname: grafana.demo.opsp.dev
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path
  auth:
    github:
      enabled: true
      org: opspresso
    google:
      enabled: false

gateway:
  enabled: true
  name: traefik-gateway
  namespace: traefik-gateway
  class_name: traefik
  listener_port: 8443
  hosts:
    - demo.opsp.dev
    - '*.demo.opsp.dev'
    - memory.opsp.dev
    - studio.opsp.dev
  tls:
    secret_name: traefik-gateway-tls
    issuer_name: letsencrypt-prod

vibemon:
  enabled: true
  hostname: vibemon.io
  display_name: "AWS EC2 k3s"
  image: public.ecr.aws/z5d8x0d6/vibemon-collector@sha256:192fbb8fa55fb55346c19e5363c3b1d49d2c4363454ab02718b4347b8bd5dd4f
