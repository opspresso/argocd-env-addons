cluster: k3s-demo

active: "true"
country: kr
env: k3s
group: k3s-demo
role: k3s

aws_account_id: "396608815058"
aws_region: ap-northeast-2
aws_environment: demo

hostname:
  internal: demo-in.rovr.dev
  public: demo.rovr.dev

resources:
  enabled: false
autoscaling:
  enabled: false

argocd:
  hostname: argocd.rovr.dev
  replicas:
    server: 1
    repo_server: 1
    application_set: 1
  dex:
    enabled: true
  notifications:
    enabled: false
  http_route:
    enabled: true
    parent_refs:
      - name: traefik-gateway
        namespace: traefik-gateway
  github:
    org: opspresso
    team: dev
  google:
    enabled: false
  chatUrl: ""

prometheus:
  serviceMonitor:
    enabled: true
  retention: 10d
  retention_size: 8GiB
  storage_size: 10Gi
  remote_write_url: http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090/api/v1/write

metrics:
  backend: prometheus

grafana_cloud:
  remote_write_url: https://prometheus-us-central1.grafana.net/api/prom/push
  remote_write_username: "2124611"

loki:
  hostname: loki.addon-loki.svc.cluster.local:3100
  retention: 168h
  storage_size: 10Gi

grafana:
  hostname: grafana.rovr.dev
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path
  auth:
    github:
      enabled: true
      org: opspresso
      team: dev
    google:
      enabled: false

gateway:
  enabled: true
  name: traefik-gateway
  namespace: traefik-gateway
  class_name: traefik
  listener_port: 8443
  # Also used as certificate DNS names. *.rovr.dev already covers demo.rovr.dev;
  # Let's Encrypt rejects an explicit name alongside a wildcard that covers it.
  hosts:
    - '*.demo.rovr.dev'
    - '*.rovr.dev'
    - memory.agrt.dev
    - studio.agrt.dev
    - librio.agrt.dev
    - forge.agrt.dev
    - models.agrt.dev
  tls:
    secret_name: traefik-gateway-tls
    issuer_name: letsencrypt-prod

