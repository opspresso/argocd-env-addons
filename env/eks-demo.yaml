cluster: eks-demo

active: "true"
env: eks
group: eks-demo
role: mgmt

aws_account_id: "396608815058"
aws_region: ap-northeast-2
aws_environment: demo

vpcId: vpc-093b5bd80076c011d

hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev

resources:
  enabled: true
autoscaling:
  enabled: false

argocd:
  acm_arn: arn:aws:acm:ap-northeast-2:396608815058:certificate/7ee515dd-b28a-4c71-b134-9b6b6fa55064
  hostname: argocd.demo.opsp.dev
  replicas:
    server: 2
    repo_server: 2
    application_set: 1
  dex:
    enabled: true
  notifications:
    enabled: true
  http_route:
    enabled: true
    parent_refs:
      - name: istio-ingressgateway
        namespace: istio-system
  # GitHub organization of the Dex connector (sso below lists its teams).
  github:
    org: opspresso # github org
  google:
    enabled: false
  chatUrl: https://app.slack.com/client/T03FUG4UB/C035P1YD72A


# Agent Runway apps: this repository declares only their AppProjects. Their Applications and the environment profile
# are in argocd-env-apps charts/agent-runway.
app_delivery:
  enabled: true

atlantis:
  acm_arn: arn:aws:acm:ap-northeast-2:396608815058:certificate/7ee515dd-b28a-4c71-b134-9b6b6fa55064
  allowlist: github.com/opspresso/terraform-*
  github:
    org: opspresso # github org
    user: nalbam-bot
  infracost:
    enabled: false

istio:
  pilot:
    autoscale: true
    min: 2
    max: 6
  gateway:
    autoscale: true
    min: 2
    max: 6
  target_group: http_0
  target_group_public: h1_0
  target_group_grpc: grpc_0

target_group:
  internal_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-0/5d5e6ca19ebeefee
  public_grpc: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-grpc-0/43e90b2856ed46af
  public_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-0/7f5705c5101010d1

grafana:
  hostname: grafana.demo.opsp.dev
  auth:
    # Argo CD Dex (client grafana-sso). sso.admin_groups are Admin, other users Viewer.
    dex:
      enabled: true
    google:
      enabled: false
      allowed_domains: nalbam.com opspresso.com
  # datasource:
  #   # demo: http://prom.demo-in.opsp.dev
  #   # demo_a: http://prom.demo-in-a.opsp.dev
  #   # demo_b: http://prom.demo-in-b.opsp.dev
  #   loki: http://loki.demo-in.opsp.dev

kite:
  hostname: kite.demo.opsp.dev

gitlab:
  hostname: gitlab.demo.opsp.dev
  # Login names of the sso.admin_groups members. GitLab CE cannot map groups to
  # administrators, so keep this list equal to the group (charts/gitlab README.md).
  admins:
    - nalbam

# Sign-in rule of every addon that uses Argo CD Dex (GitHub connector). Members
# of admin_groups are administrators; members of member_groups sign in as users
# or readers. Dex reports GitHub teams as "<org>:<team>".
sso:
  admin_groups:
    - opspresso:sre
  member_groups:
    - opspresso:dev

jenkins:
  hostname: jenkins.demo.opsp.dev

nexus:
  hostname: nexus.demo.opsp.dev
  # Login names of the sso.admin_groups members. Nexus Community Edition has no
  # group mapping, so these users get nx-admin (charts/nexus README.md).
  admins:
    - nalbam

keep:
  hostname: keep.demo.opsp.dev
  slack:
    # #noti-eks-demo in the nalbam workspace. The bot token needs the channel id
    # to edit its messages.
    channel: C0BPEEU2B8S
    # Slack user of the kube-sre agent (Agent Studio) in the nalbam workspace.
    # Keep mentions it on every problem so it starts investigating.
    responder: U0C3UAFR7SM
    # Agent Studio runs an app's message only when it contains one of the
    # agent's channel keywords. Save the same text in the kube-sre Slack settings.
    keyword: 원인 조사 요청

prometheus:
  serviceMonitor:
    enabled: true

loki:
  hostname: loki.demo-in.opsp.dev

# Auto Mode node subnets and stable Service IPs used by the Alloy policy.
alloy_network_policy:
  node_cidrs:
    - 10.10.112.0/20
    - 10.10.144.0/20
  dns_cidrs:
    - 172.20.0.10/32
  api_server_cidrs:
    - 172.20.0.1/32

# Network objects for the kro RdsPostgres template (charts/kro). terraform-env-apps demo/8-app-delivery
# creates the DB subnet group and the security group; the template renders only when security_group_id is set.
# subnet_cidrs are the intra subnets of that subnet group (demo/2-vpc). They hold only these RDS instances, so the
# RdsPostgres NetworkPolicy that opens TCP 5432 to them reaches no other PostgreSQL in the cluster.
delivery_resources:
  rds:
    subnet_group: app-delivery-rds
    # rds.force_ssl=1 (terraform output rds_parameter_group_name). Its family must match the RDS default major version.
    parameter_group: app-delivery-postgres18
    security_group_id: sg-05504ccc76aad30f0 # terraform -chdir=demo/8-app-delivery output -raw rds_security_group_id
    subnet_cidrs:
      - 10.10.208.0/20
      - 10.10.240.0/20
