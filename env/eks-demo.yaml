cluster: eks-demo

active: "true"
country: kr
env: eks
group: eks-demo
role: mgmt

aws_account_id: "396608815058"
aws_region: ap-northeast-2
aws_environment: demo

vpcId: vpc-093b5bd80076c011d

hostname:
  internal: demo-in.rovr.dev
  public: demo.rovr.dev

resources:
  enabled: true
autoscaling:
  enabled: false

argocd:
  acm_arn: arn:aws:acm:ap-northeast-2:396608815058:certificate/d4da4325-af9e-43f7-8d35-868b1b6f8fa7
  hostname: argocd.demo.rovr.dev
  replicas:
    server: 2
    repo_server: 2
    application_set: 1
  dex:
    enabled: true
  notifications:
    enabled: true
  http_route:
    enabled: true
    parent_refs:
      - name: istio-ingressgateway
        namespace: istio-system
  github:
    org: opspresso # github org
    team: dev
  google:
    enabled: false
  chatUrl: https://app.slack.com/client/T03FUG4UB/C035P1YD72A

argo_workflows:
  github:
    org: opspresso # github org
    team: dev

# Apps that Agent Delivery deploys: hosts <slug>.<domain> for the primary environment and <slug>-<env>.<domain> for the
# others (terraform-env-demo 3-alb issues the wildcard certificate).
app_delivery:
  enabled: true
  domain: apps.rovr.dev
  # The ordered environment profile. Keep it equal to Agent Delivery's DELIVERY_ENVIRONMENTS (argocd-env-apps
  # agent-delivery): an environment missing here gets no Application, so its deployments never sync.
  environments: [dev, prod]
  primary_environment: prod
  # The Kubernetes API server (Service IP and control plane endpoints) that Delivery runner Pods may reach.
  # Check after a control plane change: kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes
  api_server_cidrs: [172.20.0.1/32, 10.10.114.40/32, 10.10.149.55/32]

atlantis:
  acm_arn: arn:aws:acm:ap-northeast-2:396608815058:certificate/d4da4325-af9e-43f7-8d35-868b1b6f8fa7
  allowlist: github.com/opspresso/terraform-*
  github:
    org: opspresso # github org
    user: nalbam-bot
  infracost:
    enabled: false

istio:
  pilot:
    autoscale: true
    min: 2
    max: 6
  gateway:
    autoscale: true
    min: 2
    max: 6
  tracing:
    sampling: 10
  target_group: http_0
  target_group_public: h1_0
  target_group_grpc: grpc_0

target_group:
  internal_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-0/5d5e6ca19ebeefee
  public_grpc: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-grpc-0/43e90b2856ed46af
  public_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-0/7f5705c5101010d1

grafana:
  hostname: grafana.demo.rovr.dev
  auth:
    github:
      enabled: true
      org: opspresso # github org
      # Members of this team become Grafana Admin; other org members are Viewer.
      team: dev
    google:
      enabled: false
      allowed_domains: nalbam.com opspresso.com
  # datasource:
  #   # demo: http://prom.demo-in.rovr.dev
  #   # demo_a: http://prom.demo-in-a.rovr.dev
  #   # demo_b: http://prom.demo-in-b.rovr.dev
  #   loki: http://loki.demo-in.rovr.dev

kite:
  hostname: kite.demo.rovr.dev

prometheus:
  serviceMonitor:
    enabled: true

metrics:
  backend: prometheus

loki:
  hostname: loki.demo-in.rovr.dev

# Auto Mode node subnets and stable Service IPs used by the Alloy policy.
alloy_network_policy:
  node_cidrs:
    - 10.10.112.0/20
    - 10.10.144.0/20
  dns_cidrs:
    - 172.20.0.10/32
  api_server_cidrs:
    - 172.20.0.1/32

# Network objects for the kro RdsPostgres template (charts/kro). terraform-env-demo demo/8-app-delivery
# creates the DB subnet group and the security group; the template renders only when security_group_id is set.
# subnet_cidrs are the private subnets of that subnet group (demo/2-vpc).
delivery_resources:
  rds:
    subnet_group: app-delivery-rds
    security_group_id: "" # terraform -chdir=demo/8-app-delivery output -raw rds_security_group_id
    subnet_cidrs:
      - 10.10.112.0/20
      - 10.10.144.0/20
