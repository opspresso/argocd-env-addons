cluster: eks-demo-b

active: "true"
country: kr
env: demo
group: eks-demo-b
role: service

aws_account_id: "396608815058"
aws_region: ap-northeast-2

vpcId: vpc-0ac1c5fb50e3b5a41

hostname:
  internal: demo-in.opspresso.com
  public: demo.opspresso.com

argo_workflows:
  github:
    org: opspresso # github org
    team: sre

cluster_autoscaler:
  scan_interval: 20s
  scale_down_delay_after_delete: 1m
  scale_down_utilization_threshold: 0.6

cluster_role:
  readonly:
    enabled: true

istio:
  global:
    hub: gcr.io/istio-release
  pilot:
    autoscale: false
    min: 2
    max: 6
  gateway:
    autoscale: false
    min: 2
    max: 6
  tracing:
    sampling: 10
  target_group: http_b
  target_group_public: h1_b

target_group:
  internal_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-b/c9e514661ec488cd
  public_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-b/735e9e261d5ea746

prometheus:
  serviceMonitor:
    enabled: false

loki:
  hostname: loki.demo-in.opspresso.com
