cluster: eks-demo-b

active: "true"
country: kr
env: eks
group: eks-demo-b
role: service

aws_account_id: "396608815058"
aws_region: ap-northeast-2
aws_environment: demo

vpcId: vpc-093b5bd80076c011d

hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev


cluster_autoscaler:
  scan_interval: 20s
  scale_down_delay_after_delete: 1m
  scale_down_utilization_threshold: 0.6

istio:
  pilot:
    autoscale: false
    min: 2
    max: 6
  gateway:
    autoscale: false
    min: 2
    max: 6
  tracing:
    sampling: 10
  target_group: http_b
  target_group_public: h1_b

target_group:
  internal_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-b/b8f2e72fd84fca3f
  public_http: arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-b/ce477b108fbb9cf1

prometheus:
  serviceMonitor:
    enabled: true

loki:
  hostname: loki.demo-in.opsp.dev
