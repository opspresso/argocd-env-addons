apiVersion: 1
groups:
- orgId: 1
  name: cni-health
  folder: addons
  interval: 30s
  rules:
  - uid: addons-cni-partial-attach-failed
    title: AWS CNI egress BPF attach failed
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
      scope: cluster
    annotations:
      summary: Egress BPF attach failed after ingress allocation. Check node kernel vmalloc and CNI cleanup before repeated
        short-lived Pods accumulate memory.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        datasource:
          type: loki
          uid: loki
        editorMode: code
        queryType: instant
        expr: sum by (cluster, node) (count_over_time({job="kube-system/aws-network-policy-agent"} |= "Failed to Attach Egress
          TC probe" [5m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
