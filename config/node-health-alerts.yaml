apiVersion: 1
groups:
- orgId: 1
  name: node-health
  folder: addons
  interval: 30s
  rules:
  - uid: addons-node-memory-high
    title: Host memory usage above 85%
    condition: C
    for: 5m
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: warning
      scope: cluster
    annotations:
      summary: Host memory availability is below 15%. Inspect kernel vmalloc, PSI and swap; pod working sets do
        not include all host memory.
      __dashboardUid__: kube-cluster
      __panelId__: '107'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, instance) (100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
  - uid: addons-node-memory-critical
    title: Host memory usage above 92%
    condition: C
    for: 2m
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: critical
      scope: cluster
    annotations:
      summary: Host memory availability is below 8%. Add capacity and move workloads before probe failures spread.
      __dashboardUid__: kube-cluster
      __panelId__: '107'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, instance) (100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 92
  - uid: addons-node-kernel-memory-high
    title: Kernel vmalloc above 20% of RAM
    condition: C
    for: 15m
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: warning
      scope: cluster
    annotations:
      summary: Large kernel allocations reduce workload headroom. Inspect BPF maps and vmalloc growth; process or
        pod restarts may not reclaim them.
      __dashboardUid__: kube-cluster
      __panelId__: '115'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, instance) (100 * node_memory_VmallocUsed_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
  - uid: addons-node-kernel-memory-growth
    title: Kernel vmalloc growing over 6 hours
    condition: C
    for: 15m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
      scope: cluster
    annotations:
      summary: Kernel vmalloc grew by more than 256 MiB compared with six hours ago. Requires six hours of history;
        inspect BPF lifecycle cleanup before host memory is exhausted.
      __dashboardUid__: kube-cluster
      __panelId__: '108'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: (max by (cluster, instance) (node_memory_VmallocUsed_bytes{job="node-exporter"}) - max by (cluster,
          instance) (node_memory_VmallocUsed_bytes{job="node-exporter"} offset 6h)) / 1024 / 1024
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 256
  - uid: addons-node-memory-stalls
    title: Tasks stalled on memory above 10%
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
      scope: cluster
    annotations:
      summary: Tasks spend more than 10% of wall time waiting on memory. Correlate swap, vmalloc and load; PSI requires
        kernel support.
      __dashboardUid__: kube-cluster
      __panelId__: '109'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, instance) (100 * rate(node_pressure_memory_waiting_seconds_total{job="node-exporter"}[2m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
  - uid: addons-core-target-down
    title: Core monitoring target scrape failed
    condition: C
    for: 0s
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: warning
      scope: cluster
    annotations:
      summary: A core target failed a scrape within the last two minutes. Short node stalls can recover before a
        pending period elapses; inspect the scrape-health panel.
      __dashboardUid__: kube-cluster
      __panelId__: '113'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: min by (cluster, job, instance, metrics_path) (min_over_time(up{job=~"node-exporter|kubelet|apiserver|kube-state-metrics"}[2m]))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: addons-node-restart-burst
    title: Multiple containers restarting on one node
    condition: C
    for: 0s
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: critical
      scope: cluster
    annotations:
      summary: More than two container restarts on the same node within 10 minutes. Check node pressure and liveness
        failures even when exit reason is Completed.
      __dashboardUid__: kube-cluster
      __panelId__: '114'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: sum by (cluster, node) ((increase(kube_pod_container_status_restarts_total[10m]) or increase(kube_pod_init_container_status_restarts_total[10m]))
          * on (cluster, namespace, pod) group_left(node) max by (cluster, namespace, pod, node) (kube_pod_info))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: addons-node-liveness-burst
    title: Repeated liveness probe failures
    condition: C
    for: 0s
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: critical
      scope: cluster
    annotations:
      summary: More than two failed liveness checks within 5 minutes on one kubelet. Check host pressure and networking
        before restarting applications.
      __dashboardUid__: kube-cluster
      __panelId__: '112'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: sum by (cluster, instance) (increase(prober_probe_total{probe_type="Liveness",result="failed"}[5m]))
          or on (cluster, instance) (0 * max by (cluster, instance) (up{job="kubelet",metrics_path="/metrics/probes"}
          == 1))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: addons-core-job-missing
    title: Core monitoring job has no targets
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
      scope: cluster
    annotations:
      summary: A required EKS monitoring job disappeared from service discovery. Check ServiceMonitor selection
        and target discovery; an empty result for this absent() rule means all required jobs exist.
      __dashboardUid__: kube-cluster
      __panelId__: '113'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: absent(up{job="node-exporter"}) or absent(up{job="kubelet"}) or absent(up{job="apiserver"}) or absent(up{job="kube-state-metrics"})
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-node-not-ready
    title: Kubernetes node is not Ready
    condition: C
    for: 1m
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: critical
      scope: cluster
    annotations:
      summary: A Kubernetes node is NotReady or Unknown. Inspect its lease, host pressure and network before moving
        workloads.
      __dashboardUid__: kube-cluster
      __panelId__: '106'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster,node) (kube_node_status_condition{condition="Ready",status=~"false|unknown"})
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-node-cpu-busy
    title: Node CPU busy above 90%
    condition: C
    for: 10m
    noDataState: NoData
    execErrState: Alerting
    labels:
      severity: warning
      scope: cluster
    annotations:
      summary: A node is CPU busy for ten minutes. Inspect workload CPU, throttling and load before increasing capacity.
      __dashboardUid__: kube-cluster
      __panelId__: '111'
    data:
    - refId: A
      relativeTimeRange:
        from: 21600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: 100 * (1 - avg by(cluster,instance)(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[2m])))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
