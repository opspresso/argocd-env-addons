apiVersion: 1
groups:
- orgId: 1
  name: workspace-notifications
  folder: addons
  interval: 30s
  rules:
  - uid: addons-workspace-prometheus-alerts
    title: Agent platform execution alert firing
    condition: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    annotations:
      summary: Agent platform alert {{`{{ $labels.workspace_alert }}`}} is firing for {{`{{ $labels.service }}`}}
      description: A Forge, Knowledge or Studio Prometheus rule (config/workspace-alerts.yaml) is firing. Severity comes from
        that rule. Open the Workspace Capacity dashboard.
      __dashboardUid__: workspace-capacity
      __panelId__: '1'
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max without (alertname, alertstate) (label_replace(ALERTS{alertstate="firing",service=~"agent-(studio|forge|knowledge)",alertname=~"(Forge.*|StudioWorkspace.*|KnowledgeWorkerUnavailable)"},
          "workspace_alert", "$1", "alertname", "(.*)"))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
