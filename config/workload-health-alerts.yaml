apiVersion: 1
groups:
- orgId: 1
  name: workload-health
  folder: addons
  interval: 30s
  rules:
  - uid: addons-workload-unavailable
    title: Workload has no available replicas
    condition: C
    for: 3m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
      scope: workload
    annotations:
      summary: '{{`{{ $labels.namespace }}`}}/{{`{{ $labels.workload }}`}} ({{`{{ $labels.workload_type }}`}}) has no available
        replicas'
      description: The service is down. Check Pod events, readiness probes, image pulls and node health. Single-replica workloads
        with the Recreate strategy are down for a short time during every rollout; 3 minutes covers a normal restart.
      __dashboardUid__: kube-workload
      __panelId__: '101'
      dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{ $labels.cluster
        }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{ $labels.workload_type }}`}}&var-workload={{`{{
        $labels.workload }}`}}'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: ((max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_spec_replicas,
          "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment", "", "") or label_replace(label_replace(kube_statefulset_replicas,
          "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or label_replace(label_replace(kube_daemonset_status_desired_number_scheduled,
          "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "", ""))) > 0) and on (cluster, namespace,
          workload, workload_type) ((max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_status_replicas_available,
          "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment", "", "") or label_replace(label_replace(kube_statefulset_status_replicas_available,
          "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or label_replace(label_replace(kube_daemonset_status_number_available,
          "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "", ""))) == 0)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-deployment-replicas-unavailable
    title: Workload replicas below desired
    condition: C
    for: 10m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: '{{`{{ $labels.namespace }}`}}/{{`{{ $labels.workload }}`}} is {{`{{ printf "%.0f" $values.A.Value }}`}} replica(s)
        short of desired for 10 minutes'
      description: The service still runs with reduced capacity. A rollout or node replacement that takes longer than 10 minutes
        is stuck; check Pending pods and readiness. Complete unavailability is the critical rule.
      __dashboardUid__: kube-workload
      __panelId__: '101'
      dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{ $labels.cluster
        }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{ $labels.workload_type }}`}}&var-workload={{`{{
        $labels.workload }}`}}'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: (clamp_min((max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_spec_replicas,
          "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment", "", "") or label_replace(label_replace(kube_statefulset_replicas,
          "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or label_replace(label_replace(kube_daemonset_status_desired_number_scheduled,
          "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "", ""))) - on (cluster, namespace, workload,
          workload_type) (max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_status_replicas_available,
          "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment", "", "") or label_replace(label_replace(kube_statefulset_status_replicas_available,
          "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or label_replace(label_replace(kube_daemonset_status_number_available,
          "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "", ""))), 0)) and on (cluster, namespace,
          workload, workload_type) ((max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_status_replicas_available,
          "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment", "", "") or label_replace(label_replace(kube_statefulset_status_replicas_available,
          "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or label_replace(label_replace(kube_daemonset_status_number_available,
          "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "", ""))) > 0)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-pod-crash-looping
    title: Container restarting repeatedly
    condition: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} restarted
        {{`{{ printf "%.0f" $values.A.Value }}`}} times in 15 minutes
      description: The container keeps exiting (crash loop, failing liveness probe or OOM). Read the previous container log
        and the termination reason in the workload dashboard.
      __dashboardUid__: kube-workload
      __panelId__: '62'
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: (max by (cluster, namespace, pod, container) ((increase(kube_pod_container_status_restarts_total[15m]) or increase(kube_pod_init_container_status_restarts_total[15m])))
          * on (cluster, namespace, pod) group_left(workload, workload_type) max by (cluster, namespace, pod, workload, workload_type)
          (namespace_workload_pod:kube_pod_owner:relabel)) or on (cluster, namespace, pod, container) max by (cluster, namespace,
          pod, container) ((increase(kube_pod_container_status_restarts_total[15m]) or increase(kube_pod_init_container_status_restarts_total[15m])))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2.5
  - uid: addons-pod-oom-killed
    title: Workload container OOMKilled
    condition: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} was OOMKilled
      description: The container exceeded its memory limit and restarted. Compare memory with the limit in the workload dashboard;
        raise the limit or fix the leak.
      __dashboardUid__: kube-workload
      __panelId__: '104'
    data:
    - refId: A
      relativeTimeRange:
        from: 1200
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: ((max by (cluster, namespace, pod, container) ((increase(kube_pod_container_status_restarts_total[10m]) or increase(kube_pod_init_container_status_restarts_total[10m])))
          * on (cluster, namespace, pod, container) max by (cluster, namespace, pod, container)((kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
          or kube_pod_init_container_status_last_terminated_reason{reason="OOMKilled"}) == 1)) * on (cluster, namespace, pod)
          group_left(workload, workload_type) max by (cluster, namespace, pod, workload, workload_type) (namespace_workload_pod:kube_pod_owner:relabel))
          or on (cluster, namespace, pod, container) (max by (cluster, namespace, pod, container) ((increase(kube_pod_container_status_restarts_total[10m])
          or increase(kube_pod_init_container_status_restarts_total[10m])) * on (cluster, namespace, pod, container) group_left(reason)
          ((kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} or kube_pod_init_container_status_last_terminated_reason{reason="OOMKilled"})
          == 1)))
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-workload-start-failed
    title: Workload container cannot start
    condition: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: 'Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} cannot start:
        {{`{{ $labels.reason }}`}}'
      description: Image pull or container configuration error (missing Secret/ConfigMap key, bad image tag). Existing replicas
        keep serving during a rolling update; the outage rule fires if none is left.
      __dashboardUid__: kube-workload
      __panelId__: '110'
      dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{ $labels.cluster
        }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{ $labels.workload_type }}`}}&var-workload={{`{{
        $labels.workload }}`}}'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, namespace, pod, container, reason) ((kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|RunContainerError|InvalidImageName"}
          or kube_pod_init_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|RunContainerError|InvalidImageName"}))
          * on (cluster, namespace, pod) group_left(workload, workload_type) max by (cluster, namespace, pod, workload, workload_type)
          (namespace_workload_pod:kube_pod_owner:relabel)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-workload-memory-limit
    title: Workload container memory above 90% of limit
    condition: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} uses {{`{{
        printf "%.0f" $values.A.Value }}`}}% of its memory limit
      description: The container will be OOMKilled if usage keeps growing. Raise the limit or reduce memory use. Containers
        without a limit are excluded.
      __dashboardUid__: kube-workload
      __panelId__: '116'
      dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{ $labels.cluster
        }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{ $labels.workload_type }}`}}&var-workload={{`{{
        $labels.workload }}`}}'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: (100 * max by (cluster, namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"})
          / on (cluster, namespace, pod, container) (max by (cluster, namespace, pod, container) ((kube_pod_container_resource_limits{resource="memory"}
          or (kube_pod_init_container_resource_limits{resource="memory"} and on (cluster, namespace, pod, container) (kube_pod_init_container_status_running
          == 1)))) > 0)) * on (cluster, namespace, pod) group_left(workload, workload_type) max by (cluster, namespace, pod,
          workload, workload_type) (namespace_workload_pod:kube_pod_owner:relabel)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
  - uid: addons-workload-http-errors
    title: Service HTTP error rate above 5%
    condition: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
      scope: workload
    annotations:
      summary: Service {{`{{ $labels.destination_service_namespace }}`}}/{{`{{ $labels.destination_service_name }}`}} fails
        {{`{{ printf "%.1f" $values.A.Value }}`}}% of requests
      description: More than 5% of requests through the ingress gateway end in 5xx or a transport failure (code 0) for 5 minutes,
        with traffic above 0.1 requests/s. Client disconnects (response flag DC) are not counted. 503 with flag UH means no
        healthy pod; check replicas and readiness first.
      __dashboardUid__: service-status
      __panelId__: '11'
      dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/service-status?var-cluster={{`{{ $labels.cluster
        }}`}}&var-namespace={{`{{ $labels.namespace }}`}}'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: label_replace((100 * (sum by (cluster, destination_service_namespace, destination_service_name) (rate(istio_requests_total{reporter="source",response_code=~"0|5..",response_flags!="DC"}[5m]))
          or 0 * sum by (cluster, destination_service_namespace, destination_service_name) (rate(istio_requests_total{reporter="source"}[5m])))
          / sum by (cluster, destination_service_namespace, destination_service_name) (rate(istio_requests_total{reporter="source"}[5m])))
          and on (cluster, destination_service_namespace, destination_service_name) sum by (cluster, destination_service_namespace,
          destination_service_name) (rate(istio_requests_total{reporter="source"}[5m])) > 0.1, "namespace", "$1", "destination_service_namespace",
          "(.*)")
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
  - uid: addons-pods-failed
    title: Pod failed recently
    condition: C
    for: 5m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} entered the Failed phase
      description: A controller-managed or standalone pod failed (for example evicted) within the last hour and was not cleaned
        up within 5 minutes. Job and Argo Workflow pods and pods stopped by node shutdown are excluded. Check the pod status
        reason and node pressure. The alert resolves one hour after the failure even if the pod object remains.
      __dashboardUid__: kube-workload
      __panelId__: '110'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: (max by (cluster, namespace, pod) (kube_pod_status_phase{phase="Failed",namespace!="agent-forge-workspaces"})
          == 1) unless on (cluster, namespace, pod) kube_pod_owner{owner_kind=~"Job|Workflow"} unless on (cluster, namespace,
          pod) (kube_pod_status_reason{reason=~"Shutdown|NodeShutdown|Terminated"} == 1) unless on (cluster, namespace, pod)
          (kube_pod_status_phase{phase="Failed"} offset 1h == 1)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-job-failed
    title: Job failed
    condition: C
    for: 0s
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Job {{`{{ $labels.namespace }}`}}/{{`{{ $labels.job_name }}`}} failed
      description: The Job exhausted its backoffLimit or deadline within the last hour. Read the logs of its last pod. The
        alert resolves after one hour; the failed Job object stays until it is deleted.
      __dashboardUid__: kube-workload
      __panelId__: '110'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, namespace, job_name) (kube_job_failed{condition="true"}) == 1 unless on (cluster, namespace,
          job_name) (kube_job_failed{condition="true"} offset 1h == 1)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-pod-unschedulable
    title: Pod unschedulable
    condition: C
    for: 10m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} cannot be scheduled for 10 minutes
      description: 'Auto Mode normally adds a node within a few minutes. Check the pod events for the reason: node selector
        or affinity that no node pool satisfies, volume zone, quota, or an instance limit.'
      __dashboardUid__: cluster-overview
      __panelId__: '21'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: max by (cluster, namespace, pod) (kube_pod_status_unschedulable)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: addons-pvc-filling-up
    title: PersistentVolume above 85% used
    condition: C
    for: 15m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: warning
      scope: workload
    annotations:
      summary: Volume {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}} is {{`{{ printf "%.0f" $values.A.Value
        }}`}}% full
      description: Expand the PVC or reclaim space before it reaches 95%.
      __dashboardUid__: kube-workload
      __panelId__: '119'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: 100 * max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes) / max by (cluster,
          namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
  - uid: addons-pvc-critical
    title: PersistentVolume above 95% used
    condition: C
    for: 2m
    noDataState: OK
    execErrState: KeepLast
    labels:
      severity: critical
      scope: workload
    annotations:
      summary: Volume {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}} is {{`{{ printf "%.0f" $values.A.Value
        }}`}}% full
      description: Writes fail when the volume is full. Expand the PVC or reclaim space now.
      __dashboardUid__: kube-workload
      __panelId__: '119'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        instant: true
        range: false
        expr: 100 * max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes) / max by (cluster,
          namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 95
deleteRules:
- orgId: 1
  uid: addons-cluster-cpu-requests-high
- orgId: 1
  uid: addons-cluster-memory-requests-high
- orgId: 1
  uid: addons-istio-success-rate-low
- orgId: 1
  uid: addons-pod-exited-error
