grafana:
  fullnameOverride: grafana


  resources:
    limits: null
    requests: null
  initChownData:
    resources: null
  downloadDashboards:
    resources: null
  testFramework:
    resources: null



  autoscaling:
    enabled: False



  # Use the committed dashboard revision; branch URLs can return stale JSON.

  dashboards:
    addons: null
    alpha:
      kube-cluster:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/f9d818ee1be842370b3473fc8aef69f250069948/charts/grafana/dashboards/kube-cluster.json
      kube-workload:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/f9d818ee1be842370b3473fc8aef69f250069948/charts/grafana/dashboards/kube-workload.json
      workspace-capacity:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/f9d818ee1be842370b3473fc8aef69f250069948/charts/grafana/dashboards/workspace-capacity.json
      argo-cd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/refs/heads/master/examples/dashboard.json
        datasource: Prometheus
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: alpha
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/alpha



  # Alpha is for resource inspection; production owns alert delivery.
  alerting: null
  envValueFrom: null


  persistence:
    enabled: True

    size: 2Gi


    storageClassName: "local-path"



  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://grafana.demo.rovr.dev"
    # Keep changes to the canonical dashboard files visible to the rollout.
    checksum/managed-dashboards: "969fb5b1635ef239afc94083de0b8003f4cee80bf545aa15d0e86ed1879daf4b"

  grafana.ini:

    unified_alerting:
      enabled: false

    server:
      root_url: "https://grafana.demo.rovr.dev/"


    # https://grafana.com/docs/grafana/latest/auth/github/
    auth.github:
      enabled: True
      allow_sign_up: true
      client_id: $__file{/etc/secrets/grafana-secret/github-id}
      client_secret: $__file{/etc/secrets/grafana-secret/github-secret}
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      allowed_organizations: opspresso
      # Set team_ids here to restrict access to specific GitHub teams.




  ingress:
    enabled: false

  route:
    main:
      enabled: true
      annotations:
        link.argocd.argoproj.io/external-link: "https://grafana.demo.rovr.dev"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway

          name: "traefik-gateway"
          namespace: "traefik-gateway"

      hostnames:
        - "grafana.demo.rovr.dev"

  datasources:
    datasources.yaml:
      apiVersion: 1
      # Grafana cannot change the uid of a datasource it has already stored: the
      # update path re-reads the row by the uid written here, misses, and fails
      # provisioning hard enough to take the process down with it. Dropping the
      # rows first sends provisioning down the insert path, which honours the
      # uids below. Grafana skips the delete event for a name that is recreated
      # in the same pass, so nothing downstream sees the datasource disappear.
      deleteDatasources:
        - name: Prometheus
          orgId: 1

        - name: Loki
          orgId: 1


      datasources:
      # The uids are pinned because the provisioned alert rules in values.yaml
      # reference them; grafana assigns a random uid otherwise and every rule
      # lands on a datasource that does not exist.
      - name: Prometheus
        type: prometheus
        uid: prometheus

        url: http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090

        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.addon-loki.svc.cluster.local:3100
        access: proxy



  serviceMonitor:

    enabled: True

    labels:

      release: prometheus-k3s-demo




raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: grafana-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: grafana-secret
        data:
          - secretKey: admin-user
            remoteRef:
              key: /k8s/common/admin-user
          - secretKey: admin-password
            remoteRef:
              key: /k8s/common/admin-password


          - secretKey: github-id
            remoteRef:
              key: /k8s/opspresso/grafana-github-id
          - secretKey: github-secret
            remoteRef:
              key: /k8s/opspresso/grafana-github-secret
