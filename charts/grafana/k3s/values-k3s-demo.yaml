                  or (0 * sum by(cluster,destination_workload_namespace,destination_workload,destination_service_name)(rate(istio_requests_total{reporter="source"}[5m]))))
                  / sum by(cluster,destination_workload_namespace,destination_workload,destination_service_name)(rate(istio_requests_total{reporter="source"}[5m])))
                  and on(cluster,destination_workload_namespace,destination_workload,destination_service_name)
