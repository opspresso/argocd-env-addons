              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
