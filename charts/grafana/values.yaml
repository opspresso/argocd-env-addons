grafana:
  fullnameOverride: grafana

  revisionHistoryLimit: 3

  # The sqlite db lives on a RWO EBS volume, so a rolling update deadlocks: the
  # new pod cannot attach the volume the outgoing pod still holds.
  deploymentStrategy:
    type: Recreate

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://{{grafana.hostname}}"

  admin:
    existingSecret: "grafana-secret"

  extraSecretMounts:
    - name: grafana-secret
      secretName: grafana-secret
      mountPath: /etc/secrets/grafana-secret
      readOnly: true
      subPath: ""

  grafana.ini:
    # server:
    #   root_url: "https://{{grafana.hostname}}/"

    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Admin

    auth:
      disable_login_form: false

    # # https://grafana.com/docs/grafana/latest/auth/github/
    # auth.github:
    #   enabled: {{grafana.auth.github.enabled}}
    #   allow_sign_up: true
    #   client_id: $__file{/etc/secrets/grafana-secret/github-id}
    #   client_secret: $__file{/etc/secrets/grafana-secret/github-secret}
    #   scopes: user:email,read:org
    #   auth_url: https://github.com/login/oauth/authorize
    #   token_url: https://github.com/login/oauth/access_token
    #   api_url: https://api.github.com/user
    #   allowed_organizations: {{grafana.auth.github.org}}
    #   # team_ids: {{grafana.auth.github.team_ids}}

    # # https://grafana.com/docs/grafana/latest/auth/google/
    # auth.google:
    #   enabled: {{grafana.auth.google.enabled}}
    #   allow_sign_up: true
    #   client_id: $__file{/etc/secrets/grafana-secret/google-id}
    #   client_secret: $__file{/etc/secrets/grafana-secret/google-secret}
    #   scopes: https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
    #   auth_url: https://accounts.google.com/o/oauth2/auth
    #   token_url: https://accounts.google.com/o/oauth2/token
    #   allowed_domains: {{grafana.auth.google.allowed_domains}}

  ingress:
    enabled: false

  # datasources:
  #   datasources.yaml:
  #     apiVersion: 1
  #     datasources:
  #     - name: Prometheus
  #       type: prometheus
  #       url: http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090
  #       access: proxy
  #       isDefault: true
  #     - name: demo
  #       type: prometheus
  #       url: {{grafana.datasource.demo}}
  #       access: proxy
  #     - name: demo-a
  #       type: prometheus
  #       url: {{grafana.datasource.demo-a}}
  #       access: proxy
  #     - name: demo-b
  #       type: prometheus
  #       url: {{grafana.datasource.demo-b}}
  #       access: proxy
  #     - name: Loki
  #       type: loki
  #       url: {{grafana.datasource.loki}}
  #       access: proxy

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  # An init container downloads every url below on each pod start. The
  # kubernetes ones are served from this repo, so a dashboard cannot vanish
  # under us the way the kubecost one did - it 404'd and left a zero byte file
  # grafana could not parse. main is deliberate there: editing the json in
  # dashboards/ is the whole point. Third party urls stay pinned.
  dashboards:
    default:
      # Also published at https://grafana.com/orgs/nalbam/dashboards - the
      # gnetId below is the same dashboard, kept as the fallback source.
      kube-cluster:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/refs/heads/main/charts/grafana/dashboards/kube-cluster.json
        datasource: Prometheus
        # gnetId: 9797
        # revision: 18
      kube-deploy:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/refs/heads/main/charts/grafana/dashboards/kube-deployment.json
        datasource: Prometheus
        # gnetId: 9679
        # revision: 14
      kube-sts:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/refs/heads/main/charts/grafana/dashboards/kube-statefulset.json
        datasource: Prometheus
        # gnetId: 14902
        # revision: 4
      kube-dms:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/refs/heads/main/charts/grafana/dashboards/kube-daemonset.json
        datasource: Prometheus
        # gnetId: 14982
        # revision: 2

      argo-cd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/refs/heads/master/examples/dashboard.json
        datasource: Prometheus
      argo-rollouts:
        url: https://raw.githubusercontent.com/argoproj/argo-rollouts/refs/heads/master/examples/dashboard.json
        datasource: Prometheus

      # Published by the istio org on grafana.com. revision pins them the way a
      # commit sha pins the urls above; the keys are the filenames written to
      # the volume, so they stay put or the old files linger there unreferenced.
      istio-extension-dashboard:
        gnetId: 13277 # Istio Wasm Extension Dashboard
        revision: 276
        datasource: Prometheus
      istio-mesh-dashboard:
        gnetId: 7639 # Istio Mesh Dashboard
        revision: 319
        datasource: Prometheus
      istio-performance-dashboard:
        gnetId: 11829 # Istio Performance Dashboard
        revision: 318
        datasource: Prometheus
      istio-service-dashboard:
        gnetId: 7636 # Istio Service Dashboard
        revision: 318
        datasource: Prometheus
      istio-workload-dashboard:
        gnetId: 7630 # Istio Workload Dashboard
        revision: 319
        datasource: Prometheus
      pilot-dashboard:
        gnetId: 7645 # Istio Control Plane Dashboard
        revision: 318
        datasource: Prometheus

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: gp3 # aws-ebs-sc

