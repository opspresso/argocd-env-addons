grafana:
  fullnameOverride: grafana

  initChownData:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}
  downloadDashboards:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 128Mi}
  testFramework:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}

  revisionHistoryLimit: 3

  # The sqlite db lives on a RWO EBS volume, so a rolling update deadlocks: the
  # new pod cannot attach the volume the outgoing pod still holds.
  deploymentStrategy:
    type: Recreate

  resources:
    requests:
      cpu: 20m
      memory: 160Mi
    limits:
      memory: 512Mi

  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://{{grafana.hostname}}"

  admin:
    existingSecret: "grafana-secret"

  extraSecretMounts:
    - name: grafana-secret
      secretName: grafana-secret
      mountPath: /etc/secrets/grafana-secret
      readOnly: true
      subPath: ""

  # The slack contact point below reads the webhook from this variable. The auth
  # secrets above are mounted as files because grafana.ini resolves $__file{},
  # but provisioning files only interpolate environment variables.
  envValueFrom:
    SLACK_WEBHOOK_URL:
      secretKeyRef:
        name: grafana-secret
        key: slack-webhook

  grafana.ini:
    # server:
    #   root_url: "https://{{grafana.hostname}}/"

    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

    auth:
      disable_login_form: false

    # # https://grafana.com/docs/grafana/latest/auth/github/
    # auth.github:
    #   enabled: {{grafana.auth.github.enabled}}
    #   allow_sign_up: true
    #   client_id: $__file{/etc/secrets/grafana-secret/github-id}
    #   client_secret: $__file{/etc/secrets/grafana-secret/github-secret}
    #   scopes: user:email,read:org
    #   auth_url: https://github.com/login/oauth/authorize
    #   token_url: https://github.com/login/oauth/access_token
    #   api_url: https://api.github.com/user
    #   allowed_organizations: {{grafana.auth.github.org}}
    #   # team_ids: {{grafana.auth.github.team_ids}}

    # # https://grafana.com/docs/grafana/latest/auth/google/
    # auth.google:
    #   enabled: {{grafana.auth.google.enabled}}
    #   allow_sign_up: true
    #   client_id: $__file{/etc/secrets/grafana-secret/google-id}
    #   client_secret: $__file{/etc/secrets/grafana-secret/google-secret}
    #   scopes: https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
    #   auth_url: https://accounts.google.com/o/oauth2/auth
    #   token_url: https://accounts.google.com/o/oauth2/token
    #   allowed_domains: {{grafana.auth.google.allowed_domains}}

  ingress:
    enabled: false

  # datasources:
  #   datasources.yaml:
  #     apiVersion: 1
  #     datasources:
  #     - name: Prometheus
  #       type: prometheus
  #       url: http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090
  #       access: proxy
  #       isDefault: true
  #     - name: demo
  #       type: prometheus
  #       url: {{grafana.datasource.demo}}
  #       access: proxy
  #     - name: demo-a
  #       type: prometheus
  #       url: {{grafana.datasource.demo-a}}
  #       access: proxy
  #     - name: demo-b
  #       type: prometheus
  #       url: {{grafana.datasource.demo-b}}
  #       access: proxy
  #     - name: Loki
  #       type: loki
  #       url: {{grafana.datasource.loki}}
  #       access: proxy

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      # The provider name is also the download directory on the persistent
      # volume. Grafana drops dashboards whose provisioner is gone from the
      # config, and that is the only way to clear dashboards removed from the
      # list below: their files stay on the volume under the old directory.
      # 'addons' was retired for that reason when the unused Istio and Argo
      # Rollouts dashboards were removed.
      - name: 'managed'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/managed
  # Public GitHub dashboards are downloaded at pod startup. The repository
  # dashboards (cluster-overview, service-status, kube-cluster, kube-workload,
  # workspace-capacity) are added per platform by values-template.yaml.j2.
  dashboards:
    managed:
      argo-cd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/refs/heads/master/examples/dashboard.json
        datasource: Prometheus

      # Published by the istio org on grafana.com. revision pins them the way a
      # commit sha pins the urls above. Only the gateway reports request
      # metrics here, so the per-service and per-workload Istio dashboards
      # (destination reporter) stay empty; Service Status replaces them.
      istio-mesh-dashboard:
        datasource: Prometheus
        gnetId: 7639 # Istio Mesh Dashboard
        revision: 319
      pilot-dashboard:
        datasource: Prometheus
        gnetId: 7645 # Istio Control Plane Dashboard
        revision: 318

  # Alertmanager is disabled in prometheus-stack, so the bundled PrometheusRules
  # are evaluated but go nowhere. Grafana evaluates the rules in config/*.yaml
  # against the same Prometheus and notifies slack itself.
  #
  # The chart runs every entry through helm's tpl. Grafana template text must be
  # wrapped in a raw string ({{` ... `}}) so tpl prints it unchanged.
  alerting:
    contactpoints.yaml:
      secret:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: slack
            receivers:
              - uid: slack-noti-eks-demo
                type: slack
                settings:
                  # The webhook is bound to its channel at creation; recipient
                  # only travels in the payload, matching what alertmanager sent.
                  url: $SLACK_WEBHOOK_URL
                  recipient: "#noti-eks-demo"
                  title: '{{`{{ template "addons.slack.title" . }}`}}'
                  text: '{{`{{ template "addons.slack.text" . }}`}}'

    # One line per alert: state, severity, the rule summary with the affected
    # object and value, the first-step hint, and links. Resolved messages keep
    # only the summary so they close the incident without repeating the hint.
    templates.yaml:
      secret:
        apiVersion: 1
        templates:
          - orgId: 1
            name: addons-slack
            template: |
              {{`{{ define "addons.slack.title" -}}
              {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}:rotating_light:{{ else }}:warning:{{ end }} FIRING{{ else }}:white_check_mark: RESOLVED{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} · {{ . }}{{ end }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts.Firing }} firing, {{ len .Alerts.Resolved }} resolved){{ end }}
              {{- end }}

              {{ define "addons.slack.alert" -}}
              {{ if eq .Status "firing" }}{{ if eq .Labels.severity "critical" }}:red_circle:{{ else }}:large_orange_circle:{{ end }}{{ else }}:large_green_circle:{{ end }} {{ with .Annotations.summary }}{{ . }}{{ else }}{{ .Labels.alertname }}{{ end }}
              {{- if eq .Status "firing" }}{{ with .Annotations.description }}
              > {{ . }}{{ end }}{{ end }}
              {{ with .Annotations.dashboard_url }}<{{ . }}|Dashboard>{{ else }}{{ with .PanelURL }}<{{ . }}|Panel>{{ else }}{{ with .DashboardURL }}<{{ . }}|Dashboard>{{ end }}{{ end }}{{ end }} · <{{ .GeneratorURL }}|Rule>{{ if eq .Status "firing" }} · <{{ .SilenceURL }}|Silence>{{ end }}
              {{- end }}

              {{ define "addons.slack.text" -}}
              {{ range $i, $alert := .Alerts }}{{ if lt $i 10 }}{{ template "addons.slack.alert" $alert }}
              {{ end }}{{ end }}{{ if gt (len .Alerts) 10 }}… and {{ len .Alerts | printf "%d" }} alerts in total; open Alerting in Grafana for the rest.{{ end }}
              {{- end }}`}}

    # Critical alerts are page-worthy and repeat hourly while firing; warnings
    # need attention the same day and repeat twice a day.
    policies.yaml:
      secret:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: slack
            group_by: [grafana_folder, alertname, cluster, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: slack
                object_matchers:
                  - [severity, '=~', critical]
                group_wait: 10s
                group_interval: 1m
                repeat_interval: 1h

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: gp3 # aws-ebs-sc

  # serviceMonitor:
  #   enabled: true
  #   labels:
  #     release: prometheus-{{cluster}}
