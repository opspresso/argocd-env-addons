grafana:
  fullnameOverride: grafana

  initChownData:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}
  downloadDashboards:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 128Mi}
  testFramework:
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}

  revisionHistoryLimit: 3

  # The sqlite db lives on a RWO EBS volume, so a rolling update deadlocks: the
  # new pod cannot attach the volume the outgoing pod still holds.
  deploymentStrategy:
    type: Recreate

  resources:
    requests:
      cpu: 20m
      memory: 160Mi
    limits:
      memory: 512Mi

  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://{{grafana.hostname}}"

  admin:
    existingSecret: "grafana-secret"

  extraSecretMounts:
    - name: grafana-secret
      secretName: grafana-secret
      mountPath: /etc/secrets/grafana-secret
      readOnly: true
      subPath: ""

  # The keep contact point below reads its basic auth password (a Keep API key
  # with the webhook role) from this variable. The auth secrets above are mounted
  # as files because grafana.ini resolves $__file{}, but provisioning files only
  # interpolate environment variables.
  envValueFrom:
    KEEP_API_KEY:
      secretKeyRef:
        name: grafana-secret
        key: keep-api-key

  grafana.ini:
    # server:
    #   root_url: "https://{{grafana.hostname}}/"

    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

    auth:
      disable_login_form: false

    # # https://grafana.com/docs/grafana/latest/auth/github/
    # auth.github:
    #   enabled: {{grafana.auth.github.enabled}}
    #   allow_sign_up: true
    #   client_id: $__file{/etc/secrets/grafana-secret/github-id}
    #   client_secret: $__file{/etc/secrets/grafana-secret/github-secret}
    #   scopes: user:email,read:org
    #   auth_url: https://github.com/login/oauth/authorize
    #   token_url: https://github.com/login/oauth/access_token
    #   api_url: https://api.github.com/user
    #   allowed_organizations: {{grafana.auth.github.org}}
    #   # team_ids: {{grafana.auth.github.team_ids}}

    # # https://grafana.com/docs/grafana/latest/auth/google/
    # auth.google:
    #   enabled: {{grafana.auth.google.enabled}}
    #   allow_sign_up: true
    #   client_id: $__file{/etc/secrets/grafana-secret/google-id}
    #   client_secret: $__file{/etc/secrets/grafana-secret/google-secret}
    #   scopes: https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
    #   auth_url: https://accounts.google.com/o/oauth2/auth
    #   token_url: https://accounts.google.com/o/oauth2/token
    #   allowed_domains: {{grafana.auth.google.allowed_domains}}

  ingress:
    enabled: false

  # datasources:
  #   datasources.yaml:
  #     apiVersion: 1
  #     datasources:
  #     - name: Prometheus
  #       type: prometheus
  #       url: http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090
  #       access: proxy
  #       isDefault: true
  #     - name: demo
  #       type: prometheus
  #       url: {{grafana.datasource.demo}}
  #       access: proxy
  #     - name: demo-a
  #       type: prometheus
  #       url: {{grafana.datasource.demo-a}}
  #       access: proxy
  #     - name: demo-b
  #       type: prometheus
  #       url: {{grafana.datasource.demo-b}}
  #       access: proxy
  #     - name: Loki
  #       type: loki
  #       url: {{grafana.datasource.loki}}
  #       access: proxy

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'managed'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/managed
      # Downloaded at pod startup into the persistent volume. A dashboard
      # dropped from `dashboards.upstream` keeps its file there; rename this
      # provider to make Grafana forget it.
      - name: 'upstream'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/upstream
  # templates/dashboards.yaml bundles this repository's own dashboards
  # (charts/grafana/dashboards/*.json). The mount follows ConfigMap updates, so
  # a dashboard change needs no restart.
  dashboardsConfigMaps:
    managed: grafana-dashboards
  # Third-party dashboards come from their publishers' latest version at pod
  # startup.
  dashboards:
    upstream:
      argo-cd:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/refs/heads/master/examples/dashboard.json
        datasource: Prometheus
      # Published by the istio org on grafana.com. Without `revision` the chart
      # downloads revision 1, so `latest` is explicit.
      # Only the gateway reports request metrics here, so the per-service and
      # per-workload Istio dashboards stay empty; Service Status replaces them.
      istio-mesh-dashboard:
        datasource: Prometheus
        gnetId: 7639 # Istio Mesh Dashboard
        revision: latest
      pilot-dashboard:
        datasource: Prometheus
        gnetId: 7645 # Istio Control Plane Dashboard
        revision: latest

  # Grafana evaluates the rules in config/*.yaml against Prometheus and sends
  # them to Keep. Alertmanager sends the PrometheusRules to Keep separately.
  #
  # The chart runs every entry through helm's tpl. Grafana template text must be
  # wrapped in a raw string ({{` ... `}}) so tpl prints it unchanged.
  alerting:
    # Keep (charts/keep) is the only receiver. It merges these alerts with
    # Prometheus (Alertmanager) and Argo CD alerts and sends Slack messages.
    contactpoints.yaml:
      secret:
        apiVersion: 1
        contactPoints:
          # Keep reads the Grafana webhook at /alerts/event/grafana and takes the
          # API key as the basic auth password. Keep names the alert after the
          # payload title, so the title is the rule name, not the group summary.
          - orgId: 1
            name: keep
            receivers:
              - uid: keep-webhook
                type: webhook
                settings:
                  url: http://keep-backend.addon-keep.svc.cluster.local:8080/alerts/event/grafana
                  httpMethod: POST
                  username: grafana
                  password: $KEEP_API_KEY
                  title: '{{`{{ .CommonLabels.alertname }}`}}'
        # File provisioning does not remove what a file no longer lists.
        deleteContactPoints:
          - orgId: 1
            uid: slack-noti-eks-demo

    templates.yaml:
      secret:
        apiVersion: 1
        deleteTemplates:
          - orgId: 1
            name: addons-slack

    # group_by '...' makes every alert its own notification. Keep reads the
    # status of the whole notification, so a group that mixed firing and resolved
    # alerts would report all of them as firing.
    # Keep sends Slack only when the status changes, so repeats only refresh Keep.
    policies.yaml:
      secret:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: keep
            group_by: ['...']
            group_wait: 10s
            group_interval: 1m
            repeat_interval: 4h

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: gp3 # aws-ebs-sc

