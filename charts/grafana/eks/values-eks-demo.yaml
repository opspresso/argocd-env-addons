grafana:
  fullnameOverride: grafana




  autoscaling:
    enabled: False



  # Use the committed dashboard revision; branch URLs can return stale JSON.

  dashboards:
    managed:
      cluster-overview:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/b4ff717b621fc3446e4ca17f71fe902f0dcc6de9/charts/grafana/dashboards/cluster-overview.json
      service-status:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/b4ff717b621fc3446e4ca17f71fe902f0dcc6de9/charts/grafana/dashboards/service-status.json
      kube-cluster:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/b4ff717b621fc3446e4ca17f71fe902f0dcc6de9/charts/grafana/dashboards/kube-cluster.json
      kube-workload:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/b4ff717b621fc3446e4ca17f71fe902f0dcc6de9/charts/grafana/dashboards/kube-workload.json
      workspace-capacity:
        url: https://raw.githubusercontent.com/opspresso/argocd-env-addons/b4ff717b621fc3446e4ca17f71fe902f0dcc6de9/charts/grafana/dashboards/workspace-capacity.json



  alerting:
    workload-health.yaml:
      secret:
        apiVersion: 1
        deleteRules:
        - orgId: 1
          uid: addons-cluster-cpu-requests-high
        - orgId: 1
          uid: addons-cluster-memory-requests-high
        - orgId: 1
          uid: addons-istio-success-rate-low
        - orgId: 1
          uid: addons-pod-exited-error
        groups:
        - folder: addons
          interval: 30s
          name: workload-health
          orgId: 1
          rules:
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '101'
              dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{
                $labels.cluster }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{
                $labels.workload_type }}`}}&var-workload={{`{{ $labels.workload }}`}}'
              description: The service is down. Check Pod events, readiness probes, image
                pulls and node health. Single-replica workloads with the Recreate strategy
                are down for a short time during every rollout; 3 minutes covers a normal
                restart.
              summary: '{{`{{ $labels.namespace }}`}}/{{`{{ $labels.workload }}`}} ({{`{{
                $labels.workload_type }}`}}) has no available replicas'
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: ((max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_spec_replicas,
                  "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment",
                  "", "") or label_replace(label_replace(kube_statefulset_replicas, "workload",
                  "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or
                  label_replace(label_replace(kube_daemonset_status_desired_number_scheduled,
                  "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "",
                  ""))) > 0) and on (cluster, namespace, workload, workload_type) ((max by
                  (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_status_replicas_available,
                  "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment",
                  "", "") or label_replace(label_replace(kube_statefulset_status_replicas_available,
                  "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset",
                  "", "") or label_replace(label_replace(kube_daemonset_status_number_available,
                  "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "",
                  ""))) == 0)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 3m
            labels:
              scope: workload
              severity: critical
            noDataState: OK
            title: Workload has no available replicas
            uid: addons-workload-unavailable
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '101'
              dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{
                $labels.cluster }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{
                $labels.workload_type }}`}}&var-workload={{`{{ $labels.workload }}`}}'
              description: The service still runs with reduced capacity. A rollout or node
                replacement that takes longer than 10 minutes is stuck; check Pending pods
                and readiness. Complete unavailability is the critical rule.
              summary: '{{`{{ $labels.namespace }}`}}/{{`{{ $labels.workload }}`}} is {{`{{
                printf "%.0f" $values.A.Value }}`}} replica(s) short of desired for 10 minutes'
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: (clamp_min((max by (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_spec_replicas,
                  "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment",
                  "", "") or label_replace(label_replace(kube_statefulset_replicas, "workload",
                  "$1", "statefulset", "(.*)"), "workload_type", "statefulset", "", "") or
                  label_replace(label_replace(kube_daemonset_status_desired_number_scheduled,
                  "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "",
                  ""))) - on (cluster, namespace, workload, workload_type) (max by (cluster,
                  namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_status_replicas_available,
                  "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment",
                  "", "") or label_replace(label_replace(kube_statefulset_status_replicas_available,
                  "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset",
                  "", "") or label_replace(label_replace(kube_daemonset_status_number_available,
                  "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "",
                  ""))), 0)) and on (cluster, namespace, workload, workload_type) ((max by
                  (cluster, namespace, workload, workload_type) (label_replace(label_replace(kube_deployment_status_replicas_available,
                  "workload", "$1", "deployment", "(.*)"), "workload_type", "deployment",
                  "", "") or label_replace(label_replace(kube_statefulset_status_replicas_available,
                  "workload", "$1", "statefulset", "(.*)"), "workload_type", "statefulset",
                  "", "") or label_replace(label_replace(kube_daemonset_status_number_available,
                  "workload", "$1", "daemonset", "(.*)"), "workload_type", "daemonset", "",
                  ""))) > 0)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 10m
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Workload replicas below desired
            uid: addons-deployment-replicas-unavailable
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '62'
              description: The container keeps exiting (crash loop, failing liveness probe
                or OOM). Read the previous container log and the termination reason in the
                workload dashboard.
              summary: Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace
                }}`}}/{{`{{ $labels.pod }}`}} restarted {{`{{ printf "%.0f" $values.A.Value
                }}`}} times in 15 minutes
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: (max by (cluster, namespace, pod, container) ((increase(kube_pod_container_status_restarts_total[15m])
                  or increase(kube_pod_init_container_status_restarts_total[15m]))) * on (cluster,
                  namespace, pod) group_left(workload, workload_type) max by (cluster, namespace,
                  pod, workload, workload_type) (namespace_workload_pod:kube_pod_owner:relabel))
                  or on (cluster, namespace, pod, container) max by (cluster, namespace, pod,
                  container) ((increase(kube_pod_container_status_restarts_total[15m]) or
                  increase(kube_pod_init_container_status_restarts_total[15m])))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 1800
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 2.5
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Container restarting repeatedly
            uid: addons-pod-crash-looping
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '104'
              description: The container exceeded its memory limit and restarted. Compare
                memory with the limit in the workload dashboard; raise the limit or fix the
                leak.
              summary: Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace
                }}`}}/{{`{{ $labels.pod }}`}} was OOMKilled
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: ((max by (cluster, namespace, pod, container) ((increase(kube_pod_container_status_restarts_total[10m])
                  or increase(kube_pod_init_container_status_restarts_total[10m]))) * on (cluster,
                  namespace, pod, container) max by (cluster, namespace, pod, container)((kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
                  or kube_pod_init_container_status_last_terminated_reason{reason="OOMKilled"})
                  == 1)) * on (cluster, namespace, pod) group_left(workload, workload_type)
                  max by (cluster, namespace, pod, workload, workload_type) (namespace_workload_pod:kube_pod_owner:relabel))
                  or on (cluster, namespace, pod, container) (max by (cluster, namespace,
                  pod, container) ((increase(kube_pod_container_status_restarts_total[10m])
                  or increase(kube_pod_init_container_status_restarts_total[10m])) * on (cluster,
                  namespace, pod, container) group_left(reason) ((kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
                  or kube_pod_init_container_status_last_terminated_reason{reason="OOMKilled"})
                  == 1)))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 1200
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Workload container OOMKilled
            uid: addons-pod-oom-killed
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '110'
              dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{
                $labels.cluster }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{
                $labels.workload_type }}`}}&var-workload={{`{{ $labels.workload }}`}}'
              description: Image pull or container configuration error (missing Secret/ConfigMap
                key, bad image tag). Existing replicas keep serving during a rolling update;
                the outage rule fires if none is left.
              summary: 'Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace
                }}`}}/{{`{{ $labels.pod }}`}} cannot start: {{`{{ $labels.reason }}`}}'
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, namespace, pod, container, reason) ((kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|RunContainerError|InvalidImageName"}
                  or kube_pod_init_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|RunContainerError|InvalidImageName"}))
                  * on (cluster, namespace, pod) group_left(workload, workload_type) max by
                  (cluster, namespace, pod, workload, workload_type) (namespace_workload_pod:kube_pod_owner:relabel)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Workload container cannot start
            uid: addons-workload-start-failed
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '116'
              dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/kube-workload?var-cluster={{`{{
                $labels.cluster }}`}}&var-namespace={{`{{ $labels.namespace }}`}}&var-workload_type={{`{{
                $labels.workload_type }}`}}&var-workload={{`{{ $labels.workload }}`}}'
              description: The container will be OOMKilled if usage keeps growing. Raise the
                limit or reduce memory use. Containers without a limit are excluded.
              summary: Container {{`{{ $labels.container }}`}} in {{`{{ $labels.namespace
                }}`}}/{{`{{ $labels.pod }}`}} uses {{`{{ printf "%.0f" $values.A.Value }}`}}%
                of its memory limit
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: (100 * max by (cluster, namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD"})
                  / on (cluster, namespace, pod, container) (max by (cluster, namespace, pod,
                  container) ((kube_pod_container_resource_limits{resource="memory"} or (kube_pod_init_container_resource_limits{resource="memory"}
                  and on (cluster, namespace, pod, container) (kube_pod_init_container_status_running
                  == 1)))) > 0)) * on (cluster, namespace, pod) group_left(workload, workload_type)
                  max by (cluster, namespace, pod, workload, workload_type) (namespace_workload_pod:kube_pod_owner:relabel)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 90
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Workload container memory above 90% of limit
            uid: addons-workload-memory-limit
          - annotations:
              __dashboardUid__: service-status
              __panelId__: '11'
              dashboard_url: '{{ index .Values "grafana.ini" "server" "root_url" }}d/service-status?var-cluster={{`{{
                $labels.cluster }}`}}&var-namespace={{`{{ $labels.namespace }}`}}'
              description: More than 5% of requests through the ingress gateway end in 5xx
                or a transport failure (code 0) for 5 minutes, with traffic above 0.1 requests/s.
                Client disconnects (response flag DC) are not counted. 503 with flag UH means
                no healthy pod; check replicas and readiness first.
              summary: Service {{`{{ $labels.destination_service_namespace }}`}}/{{`{{ $labels.destination_service_name
                }}`}} fails {{`{{ printf "%.1f" $values.A.Value }}`}}% of requests
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: label_replace((100 * (sum by (cluster, destination_service_namespace,
                  destination_service_name) (rate(istio_requests_total{reporter="source",response_code=~"0|5..",response_flags!="DC"}[5m]))
                  or 0 * sum by (cluster, destination_service_namespace, destination_service_name)
                  (rate(istio_requests_total{reporter="source"}[5m]))) / sum by (cluster,
                  destination_service_namespace, destination_service_name) (rate(istio_requests_total{reporter="source"}[5m])))
                  and on (cluster, destination_service_namespace, destination_service_name)
                  sum by (cluster, destination_service_namespace, destination_service_name)
                  (rate(istio_requests_total{reporter="source"}[5m])) > 0.1, "namespace",
                  "$1", "destination_service_namespace", "(.*)")
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 5
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: workload
              severity: critical
            noDataState: OK
            title: Service HTTP error rate above 5%
            uid: addons-workload-http-errors
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '110'
              description: A controller-managed or standalone pod failed (for example evicted)
                within the last hour and was not cleaned up within 5 minutes. Job and Argo
                Workflow pods and pods stopped by node shutdown are excluded. Check the pod
                status reason and node pressure. The alert resolves one hour after the failure
                even if the pod object remains.
              summary: Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} entered the
                Failed phase
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: (max by (cluster, namespace, pod) (kube_pod_status_phase{phase="Failed",namespace!="agent-forge-workspaces"})
                  == 1) unless on (cluster, namespace, pod) kube_pod_owner{owner_kind=~"Job|Workflow"}
                  unless on (cluster, namespace, pod) (kube_pod_status_reason{reason=~"Shutdown|NodeShutdown|Terminated"}
                  == 1) unless on (cluster, namespace, pod) (kube_pod_status_phase{phase="Failed"}
                  offset 1h == 1)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Pod failed recently
            uid: addons-pods-failed
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '110'
              description: The Job exhausted its backoffLimit or deadline within the last
                hour. Read the logs of its last pod. The alert resolves after one hour; the
                failed Job object stays until it is deleted.
              summary: Job {{`{{ $labels.namespace }}`}}/{{`{{ $labels.job_name }}`}} failed
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, namespace, job_name) (kube_job_failed{condition="true"})
                  == 1 unless on (cluster, namespace, job_name) (kube_job_failed{condition="true"}
                  offset 1h == 1)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Job failed
            uid: addons-job-failed
          - annotations:
              __dashboardUid__: cluster-overview
              __panelId__: '21'
              description: 'Auto Mode normally adds a node within a few minutes. Check the
                pod events for the reason: node selector or affinity that no node pool satisfies,
                volume zone, quota, or an instance limit.'
              summary: Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} cannot be
                scheduled for 10 minutes
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, namespace, pod) (kube_pod_status_unschedulable)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 10m
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: Pod unschedulable
            uid: addons-pod-unschedulable
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '119'
              description: Expand the PVC or reclaim space before it reaches 95%.
              summary: Volume {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim
                }}`}} is {{`{{ printf "%.0f" $values.A.Value }}`}}% full
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: 100 * max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)
                  / max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 85
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 15m
            labels:
              scope: workload
              severity: warning
            noDataState: OK
            title: PersistentVolume above 85% used
            uid: addons-pvc-filling-up
          - annotations:
              __dashboardUid__: kube-workload
              __panelId__: '119'
              description: Writes fail when the volume is full. Expand the PVC or reclaim
                space now.
              summary: Volume {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim
                }}`}} is {{`{{ printf "%.0f" $values.A.Value }}`}}% full
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: 100 * max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)
                  / max by (cluster, namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 95
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 2m
            labels:
              scope: workload
              severity: critical
            noDataState: OK
            title: PersistentVolume above 95% used
            uid: addons-pvc-critical

  # These target names and host collectors belong to the EKS Prometheus stack.
  # Keep k3s/VictoriaMetrics from alerting on exporters it does not run.
    node-health.yaml:
      secret:
        apiVersion: 1
        groups:
        - folder: addons
          interval: 30s
          name: node-health
          orgId: 1
          rules:
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '113'
              description: Every Prometheus rule keeps its last state while queries fail,
                so this is the only alert for the outage. Check the prometheus-prometheus-prometheus-0
                pod in addon-prometheus (scheduling, PVC attach, OOM) and the Grafana datasource.
              summary: Grafana cannot query Prometheus; metric-based alerts are blind
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: vector(0)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 300
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: Alerting
            for: 3m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Prometheus is not answering alert queries
            uid: addons-prometheus-unreachable
          - annotations:
              __dashboardUid__: cluster-overview
              __panelId__: '24'
              description: The kubelet stopped reporting Ready. Pods there are not served
                and are evicted after 5 minutes. Nodes that Auto Mode is draining are excluded.
                Check EC2 status checks, kubelet and network; a node that stays NotReady is
                not being replaced.
              summary: Node {{`{{ $labels.node }}`}} is NotReady
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, node) (kube_node_status_condition{condition="Ready",status=~"false|unknown"})
                  unless on (cluster, node) kube_node_spec_taint{key="karpenter.sh/disrupted"}
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 2m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Kubernetes node is not Ready
            uid: addons-node-not-ready
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '206'
              description: The kubelet is evicting pods or refusing new processes. Find the
                largest consumers on the node and move or limit them.
              summary: Node {{`{{ $labels.node }}`}} reports {{`{{ $labels.condition }}`}}
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, node, condition) (kube_node_status_condition{condition=~"MemoryPressure|PIDPressure",status="true"})
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 1m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Node under memory or PID pressure
            uid: addons-node-pressure
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '205'
              description: Image and ephemeral storage are nearly full. Check large emptyDir
                volumes and container logs on the node.
              summary: Node {{`{{ $labels.node }}`}} reports DiskPressure and is evicting
                pods
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, node) (kube_node_status_condition{condition="DiskPressure",status="true"})
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Node under disk pressure
            uid: addons-node-disk-pressure
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '7'
              description: Free space before 95% (critical) and kubelet DiskPressure. Check
                emptyDir usage and unused images.
              summary: Filesystem {{`{{ $labels.mountpoint }}`}} on {{`{{ or $labels.node
                $labels.instance }}`}} is {{`{{ printf "%.0f" $values.A.Value }}`}}% full
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, instance, node, mountpoint) (100 * (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint=~"/|/local"}
                  / node_filesystem_size_bytes{job="node-exporter",mountpoint=~"/|/local"})
                  and on (cluster, instance, device, mountpoint) (node_filesystem_readonly{job="node-exporter",mountpoint=~"/|/local"}
                  == 0))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 85
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 10m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Node filesystem above 85% used
            uid: addons-node-disk-usage-high
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '205'
              description: Pods will be evicted soon. Free space now or replace the node.
              summary: Filesystem {{`{{ $labels.mountpoint }}`}} on {{`{{ or $labels.node
                $labels.instance }}`}} is {{`{{ printf "%.0f" $values.A.Value }}`}}% full
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, instance, node, mountpoint) (100 * (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint=~"/|/local"}
                  / node_filesystem_size_bytes{job="node-exporter",mountpoint=~"/|/local"})
                  and on (cluster, instance, device, mountpoint) (node_filesystem_readonly{job="node-exporter",mountpoint=~"/|/local"}
                  == 0))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 95
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 2m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Node filesystem above 95% used
            uid: addons-node-disk-critical
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '107'
              description: Less than 15% of host memory is available. Pod working sets do
                not include kernel memory; check vmalloc, PSI and the largest pods.
              summary: Host memory on {{`{{ or $labels.node $labels.instance }}`}} is {{`{{
                printf "%.0f" $values.A.Value }}`}}% used
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, instance, node) (100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"}
                  / node_memory_MemTotal_bytes{job="node-exporter"}))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 85
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Host memory usage above 85%
            uid: addons-node-memory-high
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '107'
              description: Less than 8% of host memory is available; OOM kills and probe failures
                follow. Move or limit workloads now.
              summary: Host memory on {{`{{ or $labels.node $labels.instance }}`}} is {{`{{
                printf "%.0f" $values.A.Value }}`}}% used
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, instance, node) (100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"}
                  / node_memory_MemTotal_bytes{job="node-exporter"}))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 92
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 2m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Host memory usage above 92%
            uid: addons-node-memory-critical
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '115'
              description: Large kernel allocations reduce workload headroom. Inspect BPF
                maps and vmalloc growth; pod restarts may not reclaim them.
              summary: Kernel vmalloc on {{`{{ or $labels.node $labels.instance }}`}} uses
                {{`{{ printf "%.0f" $values.A.Value }}`}}% of RAM
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, instance, node) (100 * node_memory_VmallocUsed_bytes{job="node-exporter"}
                  / node_memory_MemTotal_bytes{job="node-exporter"})
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 20
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 15m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Kernel vmalloc above 20% of RAM
            uid: addons-node-kernel-memory-high
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '108'
              description: Growth above 256 MiB compared with six hours ago. Needs six hours
                of history. Inspect BPF lifecycle cleanup before host memory runs out.
              summary: Kernel vmalloc on {{`{{ or $labels.node $labels.instance }}`}} grew
                {{`{{ printf "%.0f" $values.A.Value }}`}} MiB in 6 hours
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: (max by (cluster, instance, node) (node_memory_VmallocUsed_bytes{job="node-exporter"})
                  - max by (cluster, instance, node) (node_memory_VmallocUsed_bytes{job="node-exporter"}
                  offset 6h)) / 1024 / 1024
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 256
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 15m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Kernel vmalloc growing over 6 hours
            uid: addons-node-kernel-memory-growth
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '109'
              description: Memory pressure (PSI) slows every process on the node. Correlate
                with swap, vmalloc and host memory.
              summary: Tasks on {{`{{ or $labels.node $labels.instance }}`}} wait on memory
                {{`{{ printf "%.0f" $values.A.Value }}`}}% of the time
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max by (cluster, instance, node) (100 * rate(node_pressure_memory_waiting_seconds_total{job="node-exporter"}[2m]))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 10
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 2m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Tasks stalled on memory above 10%
            uid: addons-node-memory-stalls
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '204'
              description: Sustained CPU saturation causes throttling and latency. Find the
                top CPU workloads on the node.
              summary: CPU on {{`{{ or $labels.node $labels.instance }}`}} is {{`{{ printf
                "%.0f" $values.A.Value }}`}}% busy
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: 100 * (1 - avg by (cluster, instance, node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[2m])))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 90
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 10m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Node CPU busy above 90%
            uid: addons-node-cpu-busy
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '113'
              description: Metrics from this target are missing, so alerts based on it cannot
                fire. Targets of nodes that Auto Mode removes disappear within a few minutes
                and do not reach this alert.
              summary: '{{`{{ $labels.job }}`}} target {{`{{ $labels.instance }}`}} has failed
                scrapes for 5 minutes'
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: min by (cluster, job, instance) (up{job=~"node-exporter|kubelet|apiserver|kube-state-metrics|addon-loki/loki"})
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 1
                    type: lt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 5m
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Core monitoring target down
            uid: addons-core-target-down
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '113'
              description: A required monitoring job disappeared from service discovery; alerts
                based on it are blind. Check the ServiceMonitor and the exporter pods.
              summary: Scrape job {{`{{ $labels.job }}`}} has no targets
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: absent(up{job="node-exporter"}) or absent(up{job="kubelet"}) or absent(up{job="apiserver"})
                  or absent(up{job="kube-state-metrics"}) or absent(up{job="addon-loki/loki"})
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 2m
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: Core monitoring job has no targets
            uid: addons-core-job-missing
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '114'
              description: Restarts of unrelated containers on one node point to the node
                (memory, PSI, network), not to one application. A single crash-looping container
                is reported by the repeated-restart alert instead.
              summary: '{{`{{ printf "%.0f" $values.A.Value }}`}} different containers restarted
                on node {{`{{ $labels.node }}`}} in 10 minutes'
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: count by (cluster, node) ((max by (cluster, namespace, pod, container)
                  (increase(kube_pod_container_status_restarts_total[10m]) or increase(kube_pod_init_container_status_restarts_total[10m]))
                  >= 1) * on (cluster, namespace, pod) group_left(node) (max by (cluster,
                  namespace, pod, node) (kube_pod_info) and on (cluster, namespace, pod) (count
                  by (cluster, namespace, pod) (kube_pod_info) == 1)))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 2
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Several containers restarting on one node
            uid: addons-node-restart-burst
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '112'
              description: Several pods failing liveness on the same node at once point to
                host pressure or networking. Check the node before restarting applications.
              summary: '{{`{{ printf "%.0f" $values.A.Value }}`}} pods on kubelet {{`{{ $labels.instance
                }}`}} failed liveness checks in 5 minutes'
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: count by (cluster, instance) (sum by (cluster, instance, namespace,
                  pod) (increase(prober_probe_total{probe_type="Liveness",result="failed"}[5m]))
                  >= 1)
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 21600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 1
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            labels:
              scope: cluster
              severity: warning
            noDataState: OK
            title: Liveness probes failing for several pods on one node
            uid: addons-node-liveness-burst
    cni-health.yaml:
      secret:
        apiVersion: 1
        groups:
        - folder: addons
          interval: 30s
          name: cni-health
          orgId: 1
          rules:
          - annotations:
              __dashboardUid__: kube-cluster
              __panelId__: '108'
              description: Egress BPF attach failed after ingress allocation. Check node kernel
                vmalloc and CNI cleanup before repeated short-lived Pods accumulate memory.
              summary: AWS network policy agent failed to attach the egress BPF probe on node
                {{`{{ $labels.node }}`}}
            condition: C
            data:
            - datasourceUid: loki
              model:
                datasource:
                  type: loki
                  uid: loki
                editorMode: code
                expr: sum by (cluster, node) (count_over_time({job="kube-system/aws-network-policy-agent"}
                  |= "Failed to Attach Egress TC probe" [5m]))
                queryType: instant
                refId: A
              refId: A
              relativeTimeRange:
                from: 600
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            labels:
              scope: cluster
              severity: critical
            noDataState: OK
            title: AWS CNI egress BPF attach failed
            uid: addons-cni-partial-attach-failed
    workspace-notifications.yaml:
      secret:
        apiVersion: 1
        groups:
        - folder: addons
          interval: 30s
          name: workspace-notifications
          orgId: 1
          rules:
          - annotations:
              __dashboardUid__: workspace-capacity
              __panelId__: '1'
              description: A Forge, Knowledge or Studio Prometheus rule (config/workspace-alerts.yaml)
                is firing. Severity comes from that rule. Open the Workspace Capacity dashboard.
              summary: Agent platform alert {{`{{ $labels.workspace_alert }}`}} is firing
                for {{`{{ $labels.service }}`}}
            condition: C
            data:
            - datasourceUid: prometheus
              model:
                datasource:
                  type: prometheus
                  uid: prometheus
                editorMode: code
                expr: max without (alertname, alertstate) (label_replace(ALERTS{alertstate="firing",service=~"agent-(studio|forge|knowledge)",alertname=~"(Forge.*|StudioWorkspace.*|KnowledgeWorkerUnavailable)"},
                  "workspace_alert", "$1", "alertname", "(.*)"))
                instant: true
                range: false
                refId: A
              refId: A
              relativeTimeRange:
                from: 300
                to: 0
            - datasourceUid: __expr__
              model:
                conditions:
                - evaluator:
                    params:
                    - 0
                    type: gt
                datasource:
                  type: __expr__
                  uid: __expr__
                expression: A
                refId: C
                type: threshold
              refId: C
            execErrState: KeepLast
            for: 0s
            noDataState: OK
            title: Agent platform execution alert firing
            uid: addons-workspace-prometheus-alerts




  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://grafana.demo.rovr.dev"
    # Keep changes to the canonical dashboard files visible to the rollout.
    checksum/managed-dashboards: "07e2184f6ba5cecabf740ddd9f32a9cdad088710386fa6870faeecc031a845f5"

  grafana.ini:

    server:
      root_url: "https://grafana.demo.rovr.dev/"

    # Users land on the overview; the file is written by the dashboard download.
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/managed/cluster-overview.json



    # https://grafana.com/docs/grafana/latest/auth/github/
    auth.github:
      enabled: True
      allow_sign_up: true
      client_id: $__file{/etc/secrets/grafana-secret/github-id}
      client_secret: $__file{/etc/secrets/grafana-secret/github-secret}
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      allowed_organizations: opspresso

      # GitHub reports team membership as groups "@<org>/<team>". The role syncs on every login.
      role_attribute_path: "contains(groups[*], '@opspresso/dev') && 'Admin' || 'Viewer'"





  ingress:
    enabled: false

  route:
    main:
      enabled: true
      annotations:
        link.argocd.argoproj.io/external-link: "https://grafana.demo.rovr.dev"
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway

          name: istio-ingressgateway
          namespace: istio-system

      hostnames:
        - "grafana.demo.rovr.dev"

  datasources:
    datasources.yaml:
      apiVersion: 1
      # Grafana cannot change the uid of a datasource it has already stored: the
      # update path re-reads the row by the uid written here, misses, and fails
      # provisioning hard enough to take the process down with it. Dropping the
      # rows first sends provisioning down the insert path, which honours the
      # uids below. Grafana skips the delete event for a name that is recreated
      # in the same pass, so nothing downstream sees the datasource disappear.
      deleteDatasources:
        - name: Prometheus
          orgId: 1

        - name: Loki
          orgId: 1


      datasources:
      # The uids are pinned because the provisioned alert rules in values.yaml
      # reference them; grafana assigns a random uid otherwise and every rule
      # lands on a datasource that does not exist.
      - name: Prometheus
        type: prometheus
        uid: prometheus

        url: http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090

        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.demo-in.rovr.dev
        access: proxy



  serviceMonitor:

    enabled: True

    labels:

      release: prometheus-eks-demo


raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: grafana-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: grafana-secret
        data:
          - secretKey: admin-user
            remoteRef:
              key: /k8s/common/admin-user
          - secretKey: admin-password
            remoteRef:
              key: /k8s/common/admin-password

          # Read through the SLACK_WEBHOOK_URL env var, not a file mount: the
          # alerting provisioning files interpolate $VAR but cannot read files.
          - secretKey: slack-webhook
            remoteRef:
              key: /k8s/common/slack-webhook/grafana


          - secretKey: github-id
            remoteRef:
              key: /k8s/opspresso/grafana-github-id
          - secretKey: github-secret
            remoteRef:
              key: /k8s/opspresso/grafana-github-secret