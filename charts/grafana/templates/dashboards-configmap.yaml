{{/*
Dashboards vendored under dashboards/ instead of downloaded at pod start.

The grafana subchart's own `file:` option reads .Files from the subchart, which
cannot see this chart's directory, so the ConfigMap is built here and handed
back through grafana.dashboardsConfigMaps.

Mounting also makes deletion work: the url-based dashboards land on grafana's
persistent volume and stay there once dropped from values, while a key removed
from this ConfigMap disappears with the next sync.

Watch the size. Four dashboards is ~250KiB, and Argo CD applies client-side, so
the last-applied annotation carries a second copy against the 1MiB object limit.
Past roughly twice this, split by provider or switch the app to ServerSideApply.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards-kube
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
