apiVersion: v2
description: A Helm chart for Kubernetes
name: nexus
type: application
version: "v2.2.0" # helm chart app version

# Sonatype's chart for Nexus Repository 3.98 (nxrm-ha) needs a Pro license. The
# Community Edition chart (nexus-repository-manager) is archived at 3.64. This
# chart runs the official image sonatype/nexus3 with the opspresso app chart.
dependencies:
- name: app
  alias: nexus
  repository: https://opspresso.github.io/helm-charts/
  version: "v2.2.0" # helm chart app version

- name: raw
  repository: https://opspresso.github.io/helm-charts/
  version: "0.2.5" # helm chart raw version
