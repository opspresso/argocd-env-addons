
nexus:
  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://nexus.demo.opsp.dev"

raw:
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: nexus
        annotations:
          link.argocd.argoproj.io/external-link: "https://nexus.demo.opsp.dev"
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway

            name: istio-ingressgateway
            namespace: istio-system

        hostnames:
          - "nexus.demo.opsp.dev"
        rules:
          # Package clients (Maven, npm, ...) use their LLDAP ID and password,
          # or anonymous read, here without oauth2-proxy. A client must not set
          # the trusted user header on this path.
          - matches:
              - path:
                  type: PathPrefix
                  value: /repository/
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - X-Auth-Request-Preferred-Username
            backendRefs:
              - name: nexus
                port: 8081
          - backendRefs:
              - name: nexus
                port: 8081

    # The UI and the API require a sign-in through oauth2-proxy (the platform
    # Dex, LLDAP). The gateway then sets X-Auth-Request-Preferred-Username (the
    # LLDAP user ID), which Nexus reads with the Remote User Token realm.
    - apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: nexus
        namespace: istio-system
      spec:
        selector:
          matchLabels:
            istio: ingressgateway
        action: CUSTOM
        provider:
          name: oauth2-proxy
        rules:
          - to:
              - operation:
                  hosts:
                    - "nexus.demo.opsp.dev"
                  notPaths:
                    - /repository/*

    # NEXUS_ADMIN_PASSWORD is the local admin. Nexus binds to LLDAP as the LLDAP
    # admin, like the platform Dex (charts/dex).
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: nexus-admin
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: nexus-admin
          # Merge keeps the fetched keys next to the templated bind DN.
          template:
            engineVersion: v2
            mergePolicy: Merge
            data:
              LDAP_BIND_DN: "uid={{ .LDAP_BIND_USER }},ou=people,dc=opspresso,dc=com"
        data:
          - secretKey: NEXUS_ADMIN_PASSWORD
            remoteRef:
              key: /k8s/common/nexus/admin-password
          - secretKey: LDAP_BIND_USER
            remoteRef:
              key: /k8s/common/admin-user
          - secretKey: LDAP_BIND_PW
            remoteRef:
              key: /k8s/common/admin-password

    # This CronJob applies the sign-in rule of every addon (sso in
    # env/<cluster>.yaml). LLDAP is a Nexus user source, and each group in
    # sso.admin_groups maps to nx-admin, each group in sso.member_groups to
    # nx-anonymous (read). It also sets the admin password, the EULA, the
    # realms, anonymous read and the Remote User Token capability.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: nexus-sync

    # Reads /nexus-data/admin.password once, before the admin password is set.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: nexus-sync
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list]
        - apiGroups: [""]
          resources: [pods/exec]
          verbs: [create]

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: nexus-sync
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: nexus-sync
      subjects:
        - kind: ServiceAccount
          name: nexus-sync

    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nexus-sync
      data:
        sync.sh: |
          set -eu
          [ -n "${ADMIN_GROUPS}" ] || { echo "sso.admin_groups is empty"; exit 1; }
          B=http://nexus:8081/service/rest
          api() { curl -fsS -u "admin:${NEXUS_ADMIN_PASSWORD}" -H 'Content-Type: application/json' "$@"; }

          # First run: replace the generated admin password with the SSM value.
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:${NEXUS_ADMIN_PASSWORD}" "$B/v1/status/check")
          if [ "$code" = "401" ]; then
            pod=$(kubectl get pod -l app.kubernetes.io/name=nexus --field-selector=status.phase=Running -o name | head -1)
            initial=$(kubectl exec "$pod" -c nexus -- cat /nexus-data/admin.password)
            curl -fsS -u "admin:${initial}" -H 'Content-Type: text/plain' -X PUT \
              "$B/v1/security/users/admin/change-password" --data-binary "${NEXUS_ADMIN_PASSWORD}"
            echo "admin password set"
          fi

          # Community Edition serves requests only after the EULA is accepted.
          if [ "$(api "$B/v1/system/eula" | jq -r .accepted)" != "true" ]; then
            api "$B/v1/system/eula" | jq '.accepted = true' | api -X POST "$B/v1/system/eula" -d @-
            echo "EULA accepted"
          fi

          # LLDAP as a user source: the LLDAP groups of a user are Nexus role IDs.
          # PUT on every run keeps the bind password equal to SSM.
          ldap=$(jq -n --arg dn "${LDAP_BIND_DN}" --arg pw "${LDAP_BIND_PW}" --arg base "${LDAP_BASE_DN}" '{
            name: "lldap", protocol: "LDAP", host: "lldap.addon-lldap.svc.cluster.local", port: 3890,
            searchBase: $base, authScheme: "SIMPLE", authUsername: $dn, authPassword: $pw,
            connectionTimeoutSeconds: 30, connectionRetryDelaySeconds: 300, maxIncidentsCount: 3,
            userBaseDn: "ou=people", userSubtree: false, userObjectClass: "person",
            userIdAttribute: "uid", userRealNameAttribute: "cn", userEmailAddressAttribute: "mail",
            ldapGroupsAsRoles: true, groupType: "STATIC", groupBaseDn: "ou=groups", groupSubtree: false,
            groupObjectClass: "groupOfUniqueNames", groupIdAttribute: "cn", groupMemberAttribute: "member",
            groupMemberFormat: ("uid=${username},ou=people," + $base)}')
          id=$(api "$B/v1/security/ldap" | jq -r '.[] | select(.name == "lldap") | .id')
          if [ -n "$id" ]; then
            echo "$ldap" | jq --arg id "$id" '.id = $id' | api -X PUT "$B/v1/security/ldap/lldap" -d @-
          else
            echo "$ldap" | api -X POST "$B/v1/security/ldap" -d @-
            echo "LDAP server lldap created"
          fi

          # Remote User Token first: a request with the gateway header signs in as that LLDAP user.
          realms='["rutauth-realm","LdapRealm","NexusAuthenticatingRealm"]'
          if [ "$(api "$B/v1/security/realms/active" | jq -c 'map(select(. != "NexusAuthorizingRealm"))')" != "$realms" ]; then
            api -X PUT "$B/v1/security/realms/active" -d "$realms"
            echo "realms=${realms}"
          fi
          anonymous='{"enabled":true,"realmName":"NexusAuthorizingRealm","userId":"anonymous"}'
          if [ "$(api "$B/v1/security/anonymous" | jq -cS '{enabled, realmName, userId}')" != "$anonymous" ]; then
            api -X PUT "$B/v1/security/anonymous" -d "$anonymous" -o /dev/null
            echo "anonymous read enabled"
          fi

          header=X-Auth-Request-Preferred-Username
          rut=$(api "$B/v1/capabilities" | jq -c '[.[] | select(.type == "rutauth")][0] // empty')
          if [ -z "$rut" ]; then
            jq -n --arg h "$header" '{type: "rutauth", enabled: true, properties: {httpHeader: $h}}' \
              | api -X POST "$B/v1/capabilities" -d @- -o /dev/null
            echo "Rut Auth capability created"
          elif [ "$(echo "$rut" | jq -r '"\(.enabled) \(.properties.httpHeader)"')" != "true ${header}" ]; then
            echo "$rut" | jq --arg h "$header" '.enabled = true | .properties.httpHeader = $h' \
              | api -X PUT "$B/v1/capabilities/$(echo "$rut" | jq -r .id)" -d @- -o /dev/null
            echo "Rut Auth capability updated"
          fi

          # A Nexus role with the ID of an LLDAP group maps that group.
          map_group() {
            want=$(jq -n --arg g "$1" --arg r "$2" \
              '{id: $g, name: $g, description: "LLDAP group \($g)", privileges: [], roles: [$r]}')
            if have=$(api "$B/v1/security/roles/$1" 2>/dev/null); then
              if [ "$(echo "$have" | jq -c '[.privileges, .roles]')" != "[[],[\"$2\"]]" ]; then
                echo "$want" | api -X PUT "$B/v1/security/roles/$1" -d @-
                echo "group $1 -> $2"
              fi
            else
              echo "$want" | api -X POST "$B/v1/security/roles" -d @- -o /dev/null
              echo "group $1 -> $2"
            fi
          }
          for group in ${ADMIN_GROUPS}; do map_group "$group" nx-admin; done
          for group in ${MEMBER_GROUPS}; do map_group "$group" nx-anonymous; done

          # A local user with the ID of an LLDAP user adds its own roles to the
          # LLDAP groups. Earlier versions created such copies: remove them.
          api "$B/v1/security/users?source=default" | jq -r '.[].userId | select(. != "admin" and . != "anonymous")' \
            | while read -r user; do
              if [ "$(api "$B/v1/security/users?source=LDAP&userId=${user}" | jq --arg u "$user" 'map(select(.userId == $u)) | length')" != "0" ]; then
                api -X DELETE "$B/v1/security/users/${user}?realm=NexusAuthenticatingRealm"
                echo "local ${user} removed: LLDAP has it"
              fi
            done

    - apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: nexus-sync
      spec:
        schedule: "*/10 * * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 600
            template:
              spec:
                serviceAccountName: nexus-sync
                restartPolicy: Never
                containers:
                  - name: sync
                    image: alpine/k8s:1.37.1
                    command: [sh, /scripts/sync.sh]
                    env:
                      - name: LDAP_BASE_DN
                        value: "dc=opspresso,dc=com"
                      - name: ADMIN_GROUPS
                        value: "sre"
                      - name: MEMBER_GROUPS
                        value: "dev"
                    envFrom:
                      - secretRef:
                          name: nexus-admin
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        memory: 256Mi
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: scripts
                    configMap:
                      name: nexus-sync
