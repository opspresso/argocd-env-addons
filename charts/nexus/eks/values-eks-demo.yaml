
nexus:
  podAnnotations:
    link.argocd.argoproj.io/external-link: "https://nexus.demo.opsp.dev"

raw:
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: nexus
        annotations:
          link.argocd.argoproj.io/external-link: "https://nexus.demo.opsp.dev"
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway

            name: istio-ingressgateway
            namespace: istio-system

        hostnames:
          - "nexus.demo.opsp.dev"
        rules:
          # Package and Docker clients authenticate with Nexus, without a browser
          # redirect to oauth2-proxy. A client must not set
          # the trusted user header on this path.
          - matches:
              - path:
                  type: PathPrefix
                  value: /repository/
              - path:
                  type: PathPrefix
                  value: /v2
              - path:
                  type: PathPrefix
                  value: /service/rest/v1/assets
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - X-Auth-Request-Preferred-Username
            backendRefs:
              - name: nexus
                port: 8081
          - backendRefs:
              - name: nexus
                port: 8081

    # The UI and the API require a sign-in through oauth2-proxy (the platform
    # Dex, LLDAP). The gateway then sets X-Auth-Request-Preferred-Username (the
    # LLDAP user ID), which Nexus reads with the Remote User Token realm.
    - apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: nexus
        namespace: istio-system
      spec:
        selector:
          matchLabels:
            istio: ingressgateway
        action: CUSTOM
        provider:
          name: oauth2-proxy
        rules:
          - to:
              - operation:
                  hosts:
                    - "nexus.demo.opsp.dev"
                  notPaths:
                    - /repository/*
                    - /v2
                    - /v2/*
                    - /service/rest/v1/assets
                    - /service/rest/v1/assets/*

    # NEXUS_ADMIN_PASSWORD is the local admin. Nexus binds to LLDAP as the LLDAP
    # admin, like the platform Dex (charts/dex).
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: nexus-admin
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: nexus-admin
          # Merge keeps the fetched keys next to the templated bind DN.
          template:
            engineVersion: v2
            mergePolicy: Merge
            data:
              LDAP_BIND_DN: "uid={{ .LDAP_BIND_USER }},ou=people,dc=opspresso,dc=com"
        data:
          - secretKey: NEXUS_ADMIN_PASSWORD
            remoteRef:
              key: /k8s/common/nexus/admin-password
          - secretKey: LDAP_BIND_USER
            remoteRef:
              key: /k8s/common/admin-user
          - secretKey: LDAP_BIND_PW
            remoteRef:
              key: /k8s/common/admin-password

          - secretKey: NEXUS_PUBLISHER_PASSWORD
            remoteRef:
              key: /k8s/common/nexus/runway-publisher-password
          - secretKey: NEXUS_CLEANER_PASSWORD
            remoteRef:
              key: /k8s/common/nexus/runway-cleaner-password
          - secretKey: NEXUS_READER_PASSWORD
            remoteRef:
              key: /k8s/common/nexus/runway-reader-password


    # This CronJob applies the sign-in rule of every addon (sso in
    # env/<cluster>.yaml). LLDAP is a Nexus user source, and each group in
    # sso.admin_groups maps to nx-admin, each group in sso.member_groups to
    # nx-anonymous (read). It also sets the admin password, the EULA, the
    # realms, anonymous read and the Remote User Token capability.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: nexus-sync

    # Reads /nexus-data/admin.password once, before the admin password is set.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: nexus-sync
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list]
        - apiGroups: [""]
          resources: [pods/exec]
          verbs: [create]

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: nexus-sync
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: nexus-sync
      subjects:
        - kind: ServiceAccount
          name: nexus-sync

    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nexus-sync
      data:
        sync.sh: |
          set -eu
          [ -n "${ADMIN_GROUPS}" ] || { echo "sso.admin_groups is empty"; exit 1; }
          B=http://nexus:8081/service/rest
          api() { curl -fsS -u "admin:${NEXUS_ADMIN_PASSWORD}" -H 'Content-Type: application/json' "$@"; }

          # First run: replace the generated admin password with the SSM value.
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:${NEXUS_ADMIN_PASSWORD}" "$B/v1/status/check")
          if [ "$code" = "401" ]; then
            pod=$(kubectl get pod -l app.kubernetes.io/name=nexus --field-selector=status.phase=Running -o name | head -1)
            initial=$(kubectl exec "$pod" -c nexus -- cat /nexus-data/admin.password)
            curl -fsS -u "admin:${initial}" -H 'Content-Type: text/plain' -X PUT \
              "$B/v1/security/users/admin/change-password" --data-binary "${NEXUS_ADMIN_PASSWORD}"
            echo "admin password set"
          fi

          # Community Edition serves requests only after the EULA is accepted.
          if [ "$(api "$B/v1/system/eula" | jq -r .accepted)" != "true" ]; then
            api "$B/v1/system/eula" | jq '.accepted = true' | api -X POST "$B/v1/system/eula" -d @-
            echo "EULA accepted"
          fi

          # LLDAP as a user source: the LLDAP groups of a user are Nexus role IDs.
          # PUT on every run keeps the bind password equal to SSM.
          ldap=$(jq -n --arg dn "${LDAP_BIND_DN}" --arg pw "${LDAP_BIND_PW}" --arg base "${LDAP_BASE_DN}" '{
            name: "lldap", protocol: "LDAP", host: "lldap.addon-lldap.svc.cluster.local", port: 3890,
            searchBase: $base, authScheme: "SIMPLE", authUsername: $dn, authPassword: $pw,
            connectionTimeoutSeconds: 30, connectionRetryDelaySeconds: 300, maxIncidentsCount: 3,
            userBaseDn: "ou=people", userSubtree: false, userObjectClass: "person",
            userIdAttribute: "uid", userRealNameAttribute: "cn", userEmailAddressAttribute: "mail",
            ldapGroupsAsRoles: true, groupType: "STATIC", groupBaseDn: "ou=groups", groupSubtree: false,
            groupObjectClass: "groupOfUniqueNames", groupIdAttribute: "cn", groupMemberAttribute: "member",
            groupMemberFormat: ("uid=${username},ou=people," + $base)}')
          id=$(api "$B/v1/security/ldap" | jq -r '.[] | select(.name == "lldap") | .id')
          if [ -n "$id" ]; then
            echo "$ldap" | jq --arg id "$id" '.id = $id' | api -X PUT "$B/v1/security/ldap/lldap" -d @-
          else
            echo "$ldap" | api -X POST "$B/v1/security/ldap" -d @-
            echo "LDAP server lldap created"
          fi

          # Remote User Token first: a request with the gateway header signs in as that LLDAP user.
          realms='["rutauth-realm","LdapRealm","NexusAuthenticatingRealm","DockerToken"]'
          if [ "$(api "$B/v1/security/realms/active" | jq -c 'map(select(. != "NexusAuthorizingRealm"))')" != "$realms" ]; then
            api -X PUT "$B/v1/security/realms/active" -d "$realms"
            echo "realms=${realms}"
          fi
          anonymous='{"enabled":true,"realmName":"NexusAuthorizingRealm","userId":"anonymous"}'
          if [ "$(api "$B/v1/security/anonymous" | jq -cS '{enabled, realmName, userId}')" != "$anonymous" ]; then
            api -X PUT "$B/v1/security/anonymous" -d "$anonymous" -o /dev/null
            echo "anonymous read enabled"
          fi

          header=X-Auth-Request-Preferred-Username
          rut=$(api "$B/v1/capabilities" | jq -c '[.[] | select(.type == "rutauth")][0] // empty')
          if [ -z "$rut" ]; then
            jq -n --arg h "$header" '{type: "rutauth", enabled: true, properties: {httpHeader: $h}}' \
              | api -X POST "$B/v1/capabilities" -d @- -o /dev/null
            echo "Rut Auth capability created"
          elif [ "$(echo "$rut" | jq -r '"\(.enabled) \(.properties.httpHeader)"')" != "true ${header}" ]; then
            echo "$rut" | jq --arg h "$header" '.enabled = true | .properties.httpHeader = $h' \
              | api -X PUT "$B/v1/capabilities/$(echo "$rut" | jq -r .id)" -d @- -o /dev/null
            echo "Rut Auth capability updated"
          fi

          # A Nexus role with the ID of an LLDAP group maps that group.
          map_group() {
            want=$(jq -n --arg g "$1" --arg r "$2" \
              '{id: $g, name: $g, description: "LLDAP group \($g)", privileges: [], roles: [$r]}')
            if have=$(api "$B/v1/security/roles/$1" 2>/dev/null); then
              if [ "$(echo "$have" | jq -c '[.privileges, .roles]')" != "[[],[\"$2\"]]" ]; then
                echo "$want" | api -X PUT "$B/v1/security/roles/$1" -d @-
                echo "group $1 -> $2"
              fi
            else
              echo "$want" | api -X POST "$B/v1/security/roles" -d @- -o /dev/null
              echo "group $1 -> $2"
            fi
          }
          for group in ${ADMIN_GROUPS}; do map_group "$group" nx-admin; done
          for group in ${MEMBER_GROUPS}; do map_group "$group" nx-anonymous; done

          # A local user with the ID of an LLDAP user adds its own roles to the
          # LLDAP groups. Earlier versions created such copies: remove them.
          api "$B/v1/security/users?source=default" | jq -r '.[].userId | select(. != "admin" and . != "anonymous")' \
            | while read -r user; do
              if [ "$(api "$B/v1/security/users?source=LDAP&userId=${user}" | jq --arg u "$user" 'map(select(.userId == $u)) | length')" != "0" ]; then
                api -X DELETE "$B/v1/security/users/${user}?realm=NexusAuthenticatingRealm"
                echo "local ${user} removed: LLDAP has it"
              fi
            done

          . /scripts/delivery.sh
        delivery.sh: |
          #!/bin/sh
          # Sourced by sync.sh after Nexus authentication is configured. Only 404 means absent.
          set -eu
          set -o pipefail
          : "${NEXUS_PUBLISHER_PASSWORD:?publisher password is required}"
          : "${NEXUS_READER_PASSWORD:?reader password is required}"
          : "${NEXUS_CLEANER_PASSWORD:?cleaner password is required}"
          umask 077
          delivery_tmp=$(mktemp -d)
          trap 'rm -rf "$delivery_tmp"' EXIT HUP INT TERM

          read_delivery() {
            delivery_status=$(curl -sS -u "admin:${NEXUS_ADMIN_PASSWORD}" -o "$delivery_tmp/have.json" \
              -w '%{http_code}' "$B/v1/$1")
            case "$delivery_status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "Nexus read failed: $1 HTTP $delivery_status" >&2; exit 1 ;;
            esac
          }

          # The caller supplies the exact managed fields. Unrelated repository fields remain untouched.
          ensure_delivery() {
            delivery_collection=$1 delivery_name=$2
            cat > "$delivery_tmp/want.json"
            if read_delivery "$delivery_collection/$delivery_name"; then
              if ! jq -e --slurpfile want "$delivery_tmp/want.json" 'if has("privileges") then .privileges == $want[0].privileges and .roles == $want[0].roles else contains($want[0]) end' "$delivery_tmp/have.json" >/dev/null; then
                jq -s '.[0] * .[1]' "$delivery_tmp/have.json" "$delivery_tmp/want.json" \
                  | api -X PUT "$B/v1/$delivery_collection/$delivery_name" -d @- -o /dev/null
              fi
            else
              api -X POST "$B/v1/$delivery_collection" -d @"$delivery_tmp/want.json" -o /dev/null
            fi
          }

          # Preserve anonymous access to the installation's existing public packages, not private app artifacts.
          api "$B/v1/repositories" | jq --argjson names "$NEXUS_PUBLIC_REPOSITORIES" \
            '{id:"public-packages",name:"Public packages",description:"Anonymous reads of configured package repositories",roles:[],
              privileges:[.[] | select(.name as $name | $names | index($name)) |
                "nx-repository-view-\(.format)-\(.name)-read", "nx-repository-view-\(.format)-\(.name)-browse"]}' \
            | ensure_delivery security/roles public-packages
          api "$B/v1/security/users?source=default&userId=anonymous" | jq -e 'map(select(.userId=="anonymous")) | if length==1 then .[0] else error("anonymous user missing or ambiguous") end' > "$delivery_tmp/have.json"
          jq '.roles=["public-packages"]' "$delivery_tmp/have.json" \
            | api -X PUT "$B/v1/security/users/anonymous" -d @- -o /dev/null

          ensure_delivery repositories/raw/hosted runway-artifacts <<'JSON'
          {"name":"runway-artifacts","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW_ONCE"}}
          JSON
          ensure_delivery repositories/docker/hosted runway-images <<'JSON'
          {"name":"runway-images","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW_ONCE","latestPolicy":false},"docker":{"v1Enabled":false,"forceBasicAuth":true,"pathEnabled":true}}
          JSON


          for access in reader publisher cleaner; do
            jq -n --arg access "$access" \
              '{id:("runway-"+$access),name:("Runway "+$access),description:"Agent Runway artifacts only",roles:[],
                privileges:([["raw","runway-artifacts"],["docker","runway-images"]] | [.[] as $repo |
                  (["read","browse"] + (if $access=="publisher" then ["add","edit"] elif $access=="cleaner" then ["delete"] else [] end))[] |
                  "nx-repository-view-\($repo[0])-\($repo[1])-\(.)"])}' \
              | ensure_delivery security/roles "runway-$access"
            api "$B/v1/security/users?source=default&userId=runway-$access" \
              | jq --arg id "runway-$access" 'map(select(.userId==$id))' > "$delivery_tmp/users.json"
            if [ "$(jq length "$delivery_tmp/users.json")" = 0 ]; then
              jq -n --arg access "$access" \
                '{userId:("runway-"+$access),firstName:"Runway",lastName:$access,emailAddress:"runway@example.invalid",status:"active",
                  roles:["runway-"+$access],password:(if $access=="publisher" then env.NEXUS_PUBLISHER_PASSWORD elif $access=="cleaner" then env.NEXUS_CLEANER_PASSWORD else env.NEXUS_READER_PASSWORD end)}' \
                | api -X POST "$B/v1/security/users" -d @- -o /dev/null
            else
              jq -e --arg role "runway-$access" 'if length==1 then .[0] | .roles=[$role] | .status="active" else error("ambiguous user") end' "$delivery_tmp/users.json" \
                | api -X PUT "$B/v1/security/users/runway-$access" -d @- -o /dev/null
            fi
          done
          echo 'Runway repositories and scoped accounts synchronized'


    - apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: nexus-sync
      spec:
        schedule: "*/10 * * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 600
            template:
              spec:
                serviceAccountName: nexus-sync
                restartPolicy: Never
                containers:
                  - name: sync
                    image: alpine/k8s:1.37.1
                    command: [sh, /scripts/sync.sh]
                    env:
                      - name: LDAP_BASE_DN
                        value: "dc=opspresso,dc=com"
                      - name: ADMIN_GROUPS
                        value: "sre"
                      - name: MEMBER_GROUPS
                        value: "dev"

                      - name: NEXUS_PUBLIC_REPOSITORIES
                        value: '["maven-releases", "maven-snapshots", "maven-central", "maven-public", "nuget-hosted", "nuget.org-proxy", "nuget-group"]'

                    envFrom:
                      - secretRef:
                          name: nexus-admin
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        memory: 256Mi
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: scripts
                    configMap:
                      name: nexus-sync
