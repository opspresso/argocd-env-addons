argo-rollouts:
  fullnameOverride: argo-rollouts

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: True
        namespace: addon-argo-rollouts

  dashboard:
    podAnnotations:
      link.argocd.argoproj.io/external-link: "https://rollouts.demo.rovr.dev"

    ingress:
      enabled: false
      ingressClassName: "nginx"
      hosts:
        - "rollouts.demo.rovr.dev"

    httproute:
      enabled: true
      annotations:
        link.argocd.argoproj.io/external-link: "https://rollouts.demo.rovr.dev"
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "rollouts.demo.rovr.dev"

route:
  resources:
    - apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: rollouts
        namespace: istio-system
      spec:
        selector:
          matchLabels:
            istio: ingressgateway
        action: CUSTOM
        provider:
          name: oauth2-proxy
        rules:
        - to:
          - operation:
              hosts:
              - "rollouts.demo.rovr.dev"