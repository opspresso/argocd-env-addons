argo-rollouts:
  fullnameOverride: argo-rollouts

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: False
        namespace: addon-argo-rollouts

  dashboard:
    podAnnotations:
      link.argocd.argoproj.io/external-link: "https://rollouts.demo.opsp.dev"

    ingress:
      enabled: false
      ingressClassName: "nginx"
      hosts:
        - "rollouts.demo.opsp.dev"

route:
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: argo-rollouts-dashboard
        annotations:
          link.argocd.argoproj.io/external-link: "https://rollouts.demo.opsp.dev"
      spec:
        parentRefs:
          - name: istio-ingressgateway
            namespace: istio-system
        hostnames:
          - "rollouts.demo.opsp.dev"
        rules:
          - backendRefs:
              - name: argo-rollouts-dashboard
                port: 3100

    - apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: rollouts
        namespace: istio-system
      spec:
        selector:
          matchLabels:
            istio: ingressgateway
        action: CUSTOM
        provider:
          name: oauth2-proxy
        rules:
        - to:
          - operation:
              hosts:
              - "rollouts.demo.opsp.dev"