
keep:
  backend:
    env:
      - name: SECRET_MANAGER_TYPE
        value: k8s
      - name: PORT
        value: "8080"
      - name: PROMETHEUS_MULTIPROC_DIR
        value: /tmp/prometheus
      # Grafana and Argo CD send alerts to this in-cluster address. Keep also
      # prints it in the webhook instructions of the providers page.
      - name: KEEP_API_URL
        value: http://keep-backend.addon-keep.svc.cluster.local:8080
      # No websocket server: Soketi takes its app secret only as a plain value.
      # The UI refreshes by polling.
      - name: PUSHER_DISABLED
        value: "true"
      - name: POSTHOG_DISABLED
        value: "true"
      - name: AUTH_TYPE
        value: OIDC
      - name: KEEP_OIDC_ISSUER
        value: "https://argocd.demo.opsp.dev/api/dex"
      - name: KEEP_OIDC_CLIENT_ID
        value: keep-sso
      # sso.admin_groups get admin, sso.member_groups the read-only noc role.
      # A user in no listed group gets 403: Keep has no default role.
      - name: KEEP_OIDC_ADMIN_ROLES
        value: "opspresso:sre,sre"
      - name: KEEP_OIDC_NOC_ROLES
        value: "opspresso:dev,dev"

    # KEEP_PROVIDERS. Keep reconciles these at startup and removes provisioned
    # providers that are not listed. "$(NAME)" is replaced with the env var NAME.
    # install_webhook stays false: Grafana alerting and Argo CD notifications are
    # provisioned from this repository, and Keep would rewrite them.
    provision:
      providers:
        # No prometheus provider: Alertmanager pushes alerts with send_resolved.
        # Pulled alerts get a different fingerprint and never resolve.

        loki:
          type: grafana_loki
          install_webhook: false
          authentication:
            host_url: http://loki.addon-loki.svc.cluster.local:3100
            authentication_type: NoAuth

        argocd:
          type: argocd
          install_webhook: false
          authentication:
            deployment_url: http://argocd-server.argocd.svc.cluster.local
            argocd_access_token: "$(ARGOCD_ACCESS_TOKEN)"
        # Bot token of the Slack app "Keep" in the nalbam workspace
        # (chat:write, chat:write.public). A token, not a webhook: the workflows
        # edit a posted message and reply in its thread.
        slack:
          type: slack
          install_webhook: false
          authentication:
            access_token: "$(SLACK_BOT_TOKEN)"








    # Slack messages. Keep is the only sender: Grafana, Alertmanager and Argo CD
    # send their alerts to Keep. The Slack app "Keep" posts with its bot token.
    # Each workflow reads only fields its source always sets, because Keep fails
    # the action on a missing field.
    # Slack gets only alerts that need a person: critical Grafana and Prometheus
    # alerts (and Agent platform alerts), and Argo CD sync failures. Warnings
    # stay in Keep. Rules wait out short states before they turn critical.
    # only_on_change sends on status changes, not on repeats. A recovery counts
    # only after a firing (firingCounter > 1).
    # Problem messages mention the kube-sre agent with its channel keyword; Agent
    # Studio runs app messages only when they contain that keyword. The resolved
    # edit and the thread reply carry neither (Studio also ignores edits and other
    # apps' thread replies).
    # Times are Slack date tokens, so each reader sees their own time zone.
    # Keep renders the mustache tags inside the Jinja2 raw blocks.
      workflows:




        - id: grafana-alert-to-slack
          name: Grafana alert to Slack
          description: Posts critical Grafana alerts to Slack, asks kube-sre to investigate, and marks the message resolved.
          triggers:
            - type: alert
              cel: '"grafana" in source && severity == "critical" && (status == "firing" || (status == "resolved" && firingCounter > 1))'
              only_on_change: [status]
          actions:
            - name: post-problem
              if: "'{{ alert.status }}' == 'firing'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: "🔴 {{ alert.name }} — {{ alert.annotations.summary }} <@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."
                  enrich_alert:
                    - {key: slack_timestamp, value: results.slack_timestamp}
                  blocks:

                    - type: header
                      text: {type: plain_text, emoji: true, text: "🔴 {{ alert.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "*{{ alert.annotations.summary }}*\n{{ alert.description }}"}
                    - type: context
                      elements:
                        - {type: mrkdwn, text: "심각도 `{{ alert.severity }}` · Grafana · 시작 <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}
                    - type: section
                      text: {type: mrkdwn, text: "<{{ alert.dashboardUrl }}|대시보드> · <{{ alert.url }}|규칙> · <{{ alert.silenceURL }}|알림 끄기> · <https://keep.demo.opsp.dev/alerts/feed|Keep>"}

                    - type: section
                      text: {type: mrkdwn, text: "<@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."}

            - name: mark-resolved
              if: "'{{ alert.status }}' == 'resolved' and '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  slack_timestamp: "{{ alert.slack_timestamp }}"
                  message: "✅ {{ alert.name }} — {{ alert.annotations.summary }}"
                  blocks:

                    - type: header
                      text: {type: plain_text, emoji: true, text: "✅ {{ alert.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "*{{ alert.annotations.summary }}*\n{{ alert.description }}"}
                    - type: context
                      elements:
                        - {type: mrkdwn, text: "심각도 `{{ alert.severity }}` · Grafana · 해소 <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}
                    - type: section
                      text: {type: mrkdwn, text: "<{{ alert.dashboardUrl }}|대시보드> · <{{ alert.url }}|규칙> · <{{ alert.silenceURL }}|알림 끄기> · <https://keep.demo.opsp.dev/alerts/feed|Keep>"}

                    - type: context
                      elements:
                        - {type: mrkdwn, text: "✅ *해소됨* <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}

            - name: reply-resolved
              if: "'{{ alert.status }}' == 'resolved' and '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  thread_timestamp: "{{ alert.slack_timestamp }}"
                  message: "✅ 해소됐습니다. <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"
            - name: post-resolved
              if: "'{{ alert.status }}' == 'resolved' and not '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: "✅ 해소: {{ alert.name }} <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"




        - id: prometheus-alert-to-slack
          name: Prometheus alert to Slack
          description: Posts critical and Agent platform Prometheus alerts to Slack, asks kube-sre to investigate, and marks the message resolved.
          triggers:
            - type: alert
              cel: '"prometheus" in source && (severity == "critical" || (type(service) == string && service.matches("^agent-(studio|forge|knowledge)$"))) && (status == "firing" || (status == "resolved" && firingCounter > 1))'
              only_on_change: [status]
          actions:
            - name: post-problem
              if: "'{{ alert.status }}' == 'firing'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: "🔴 {{ alert.name }} — {{ alert.description }} <@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."
                  enrich_alert:
                    - {key: slack_timestamp, value: results.slack_timestamp}
                  blocks:

                    - type: header
                      text: {type: plain_text, emoji: true, text: "🔴 {{ alert.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "{{ alert.description }}"}
                    - type: context
                      elements:
                        - {type: mrkdwn, text: "심각도 `{{ alert.severity }}` · Prometheus · 시작 <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}
                    - type: section
                      text: {type: mrkdwn, text: "<https://keep.demo.opsp.dev/alerts/feed|Keep>"}

                    - type: section
                      text: {type: mrkdwn, text: "<@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."}

            - name: mark-resolved
              if: "'{{ alert.status }}' == 'resolved' and '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  slack_timestamp: "{{ alert.slack_timestamp }}"
                  message: "✅ {{ alert.name }} — {{ alert.description }}"
                  blocks:

                    - type: header
                      text: {type: plain_text, emoji: true, text: "✅ {{ alert.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "{{ alert.description }}"}
                    - type: context
                      elements:
                        - {type: mrkdwn, text: "심각도 `{{ alert.severity }}` · Prometheus · 해소 <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}
                    - type: section
                      text: {type: mrkdwn, text: "<https://keep.demo.opsp.dev/alerts/feed|Keep>"}

                    - type: context
                      elements:
                        - {type: mrkdwn, text: "✅ *해소됨* <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}

            - name: reply-resolved
              if: "'{{ alert.status }}' == 'resolved' and '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  thread_timestamp: "{{ alert.slack_timestamp }}"
                  message: "✅ 해소됐습니다. <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"
            - name: post-resolved
              if: "'{{ alert.status }}' == 'resolved' and not '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: "✅ 해소: {{ alert.name }} <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"





        - id: argocd-alert-to-slack
          name: Argo CD alert to Slack
          description: Posts each Argo CD sync failure to Slack, asks kube-sre to investigate, and marks the message resolved.
          triggers:
            - type: alert
              cel: '"argocd" in source && (status == "firing" || (status == "resolved" && firingCounter > 1))'
              only_on_change: [status]
          actions:
            - name: post-problem
              if: "'{{ alert.status }}' == 'firing'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: "🔴 {{ alert.name }} <@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."
                  enrich_alert:
                    - {key: slack_timestamp, value: results.slack_timestamp}
                  blocks:

                    - type: header
                      text: {type: plain_text, emoji: true, text: "🔴 {{ alert.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "{{ alert.description }}"}
                    - type: context
                      elements:
                        - {type: mrkdwn, text: "심각도 `{{ alert.severity }}` · Argo CD · 프로젝트 `{{ alert.labels.project }}` · 시작 <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}
                    - type: section
                      text: {type: mrkdwn, text: "<{{ alert.url }}|Argo CD> · <https://keep.demo.opsp.dev/alerts/feed|Keep>"}

                    - type: section
                      text: {type: mrkdwn, text: "<@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."}

            - name: mark-resolved
              if: "'{{ alert.status }}' == 'resolved' and '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  slack_timestamp: "{{ alert.slack_timestamp }}"
                  message: "✅ {{ alert.name }}"
                  blocks:

                    - type: header
                      text: {type: plain_text, emoji: true, text: "✅ {{ alert.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "{{ alert.description }}"}
                    - type: context
                      elements:
                        - {type: mrkdwn, text: "심각도 `{{ alert.severity }}` · Argo CD · 프로젝트 `{{ alert.labels.project }}` · 해소 <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}
                    - type: section
                      text: {type: mrkdwn, text: "<{{ alert.url }}|Argo CD> · <https://keep.demo.opsp.dev/alerts/feed|Keep>"}

                    - type: context
                      elements:
                        - {type: mrkdwn, text: "✅ *해소됨* <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"}

            - name: reply-resolved
              if: "'{{ alert.status }}' == 'resolved' and '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  thread_timestamp: "{{ alert.slack_timestamp }}"
                  message: "✅ 해소됐습니다. <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"
            - name: post-resolved
              if: "'{{ alert.status }}' == 'resolved' and not '{{ alert.slack_timestamp }}'"
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: "✅ 해소: {{ alert.name }} <!date^keep.to_timestamp('{{ alert.lastReceived }}')^{date_short_pretty} {time}|{{ alert.lastReceived }}>"

        - id: incident-to-slack
          name: New incident to Slack
          description: Posts each incident Keep creates to Slack and asks kube-sre to investigate.
          triggers:
            - type: incident
              events: [created]
          actions:
            - name: slack
              provider:
                type: slack
                config: "{{ providers.slack }}"
                with:
                  channel: C0BPEEU2B8S
                  message: '🧩 새 incident: {{ incident.name }} <@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요.'
                  blocks:
                    - type: header
                      text: {type: plain_text, emoji: true, text: "🧩 새 incident: {{ incident.name }}"}
                    - type: section
                      text: {type: mrkdwn, text: "경보 {{ incident.alerts_count }}개를 하나의 incident로 묶었습니다. 심각도 `{{ incident.severity }}`"}
                    - type: section
                      text: {type: mrkdwn, text: "<https://keep.demo.opsp.dev/incidents/{{ incident.id }}|Keep에서 보기>"}
                    - type: section
                      text: {type: mrkdwn, text: "<@U0C3UAFR7SM> *원인 조사 요청*: 이 경보의 원인과 영향, 우선 조치를 이 스레드에 짧게 남겨 주세요."}
  frontend:
    env:
      - name: NEXTAUTH_URL
        value: "https://keep.demo.opsp.dev"
      - name: VERCEL
        value: "1"
      - name: ENV
        value: production
      - name: NODE_ENV
        value: production
      - name: HOSTNAME
        value: 0.0.0.0
      - name: FRIGADE_DISABLED
        value: "true"
      - name: PUSHER_DISABLED
        value: "true"
      - name: AUTH_TYPE
        value: OIDC
      - name: KEEP_OIDC_ISSUER
        value: "https://argocd.demo.opsp.dev/api/dex"
      - name: KEEP_OIDC_CLIENT_ID
        value: keep-sso
      - name: KEEP_OIDC_ADMIN_ROLES
        value: "opspresso:sre,sre"
      - name: KEEP_OIDC_NOC_ROLES
        value: "opspresso:dev,dev"

    podAnnotations:
      link.argocd.argoproj.io/external-link: "https://keep.demo.opsp.dev"

raw:
  resources:
    # The UI calls the API through its own /backend rewrite, so one route serves both.
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: keep
        annotations:
          link.argocd.argoproj.io/external-link: "https://keep.demo.opsp.dev"
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway

            name: istio-ingressgateway
            namespace: istio-system

        hostnames:
          - "keep.demo.opsp.dev"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: keep-frontend
                port: 3000

    # Slack fetches every link of a Keep message to build a preview. Keep,
    # Grafana and Argo CD show it only a sign-in page, so each alert gets
    # previews of sign-in pages. Keep's Slack provider cannot send
    # unfurl_links=false, so the gateway refuses Slack's link expander
    # (User-Agent "Slackbot-LinkExpanding ...") on these hosts.
    - apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: keep-slack-no-unfurl
        namespace: istio-system
      spec:
        selector:
          matchLabels:
            istio: ingressgateway
        action: DENY
        rules:
          - to:
              - operation:
                  hosts:
                    - "keep.demo.opsp.dev"
                    - "grafana.demo.opsp.dev"
                    - "argocd.demo.opsp.dev"
            when:
              - key: request.headers[User-Agent]
                values: ["Slackbot*"]

    # Names start with addon-keep-, not keep-: the chart's pre-delete hook
    # deletes every Secret whose name starts with keep-.
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: addon-keep-database
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: addon-keep-database
        data:
          - secretKey: password
            remoteRef:
              key: /k8s/common/keep/database-password

    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: addon-keep-backend
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: addon-keep-backend
          template:
            engineVersion: v2
            data:
              DATABASE_CONNECTION_STRING: "postgresql+psycopg2://postgres:{{ .database_password }}@keep-database:5432/keep"
              # name:role:secret. Keep creates each key once at startup and never
              # changes an existing one; see README.md to rotate.
              KEEP_DEFAULT_API_KEYS: "grafana:webhook:{{ .grafana_api_key }},argocd:webhook:{{ .argocd_api_key }},alertmanager:webhook:{{ .alertmanager_api_key }}"
              ARGOCD_ACCESS_TOKEN: "{{ .argocd_access_token }}"
              SLACK_BOT_TOKEN: "{{ .slack_bot_token }}"
        data:
          - secretKey: database_password
            remoteRef:
              key: /k8s/common/keep/database-password
          - secretKey: grafana_api_key
            remoteRef:
              key: /k8s/common/keep/grafana-api-key
          - secretKey: argocd_api_key
            remoteRef:
              key: /k8s/common/keep/argocd-api-key
          - secretKey: alertmanager_api_key
            remoteRef:
              key: /k8s/common/keep/alertmanager-api-key
          - secretKey: argocd_access_token
            remoteRef:
              key: /k8s/common/keep/argocd-api-token
          - secretKey: slack_bot_token
            remoteRef:
              key: /k8s/common/keep/slack-bot-token

    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: addon-keep-frontend
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: addon-keep-frontend
        data:
          - secretKey: NEXTAUTH_SECRET
            remoteRef:
              key: /k8s/common/keep/nextauth-secret
          - secretKey: KEEP_OIDC_CLIENT_SECRET
            remoteRef:
              key: /k8s/common/keep/oidc-client-secret
