argo-cd:
  fullnameOverride: argocd


  controller:
    metrics:
      serviceMonitor:
        enabled: False
        selector:
          release: prometheus-k3s-demo

  server:
    replicas: 1
    ingress:
      enabled: false
      hostname: "argocd.demo.opsp.dev"
      annotations:
        kubernetes.io/ingress.class: "alb"
        external-dns.alpha.kubernetes.io/hostname: "argocd.demo.opsp.dev"
        alb.ingress.kubernetes.io/scheme: "internet-facing"
        alb.ingress.kubernetes.io/target-type: "ip"
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/certificate-arn: ""
        alb.ingress.kubernetes.io/actions.ssl-redirect: |
          {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}

    httproute:
      enabled: True
      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway
      hostnames:
        - "argocd.demo.opsp.dev"

    metrics:
      serviceMonitor:
        enabled: False
        selector:
          release: prometheus-k3s-demo

  repoServer:
    replicas: 1
    metrics:
      serviceMonitor:
        enabled: False
        selector:
          release: prometheus-k3s-demo

  applicationSet:
    replicas: 1

  dex:
    enabled: False
    metrics:
      serviceMonitor:
        enabled: False
        selector:
          release: prometheus-k3s-demo

  notifications:
    enabled: False
    argocdUrl: https://argocd.demo.opsp.dev

  configs:
    rbac:
      policy.default: "role:readonly"

      # `mcp` is the API-token account that mcp-argocd (argocd-env-demo) runs
      # as. Named permissions rather than role:admin, because this token sits in
      # a pod an LLM drives: what it may *change* is applications and nothing
      # else. Repositories, clusters, accounts and this policy itself have no
      # write here, and `exec` appears in neither this role nor the default one.
      # Deleting the create/update/delete/sync and action/* lines is what makes
      # it read-only, and this is the boundary that counts — MCP_READ_ONLY on
      # the pod only decides which tools get listed.
      #
      # It does not narrow reading, though. policy.default below is
      # role:readonly, every account inherits it, and Argo CD's built-in
      # definition of that role is `get` on applications, applicationsets,
      # certificates, clusters, repositories, projects, accounts, gpgkeys and
      # logs. So the logs/projects/clusters lines below are redundant today —
      # they are kept so the role still stands on its own if policy.default is
      # ever tightened. Narrowing reads for this account alone would take
      # explicit deny rules, which Argo CD evaluates ahead of allows.
      policy.csv: |
        g, opspresso:sre, role:admin

        p, role:mcp, applications, get, */*, allow
        p, role:mcp, applications, create, */*, allow
        p, role:mcp, applications, update, */*, allow
        p, role:mcp, applications, delete, */*, allow
        p, role:mcp, applications, sync, */*, allow
        p, role:mcp, applications, action/*, */*, allow
        p, role:mcp, logs, get, */*, allow
        p, role:mcp, projects, get, *, allow
        p, role:mcp, clusters, get, *, allow
        g, mcp, role:mcp

    cm:
      url: https://argocd.demo.opsp.dev

      statusbadge.url: https://argocd.demo.opsp.dev/

      help.chatUrl: ""
      help.chatText: "Chat now!"

      # Local account for mcp-argocd. `apiKey` and not `login`: it may mint API
      # tokens but cannot sign in, so there is no password on it to guess and it
      # never turns into a UI session.
      accounts.mcp: apiKey

      dex.config: |
        connectors:
        - type: github
          id: github
          name: github
          config:
            clientID: $dex.github.clientId
            clientSecret: $dex.github.clientSecret
            teamNameField: slug
            orgs:
              - name: opspresso
        staticClients:
        - id: argo-workflows-sso
          name: Argo Workflow
          redirectURIs:
            - https://workflows.demo.opsp.dev/oauth2/callback
          secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        - id: oauth2-proxy-sso
          name: OAuth2 Proxy
          redirectURIs:
            - https://auth.demo.opsp.dev/oauth2/callback
          secretEnv: OAUTH2_PROXY_SSO_CLIENT_SECRET
