argo-cd:
  fullnameOverride: argocd

  controller:
    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo


  server:
    replicas: 2


    autoscaling:
      enabled: false

    ingress:
      enabled: false
      hostname: "argocd.demo.opsp.dev"
      annotations:
        kubernetes.io/ingress.class: "alb"
        external-dns.alpha.kubernetes.io/hostname: "argocd.demo.opsp.dev"
        alb.ingress.kubernetes.io/scheme: "internet-facing"
        alb.ingress.kubernetes.io/target-type: "ip"
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:396608815058:certificate/7ee515dd-b28a-4c71-b134-9b6b6fa55064"
        alb.ingress.kubernetes.io/actions.ssl-redirect: |
          {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}

    httproute:
      enabled: True
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "argocd.demo.opsp.dev"

    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  repoServer:
    replicas: 2


    autoscaling:
      enabled: false

    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  applicationSet:
    replicas: 1


  dex:
    enabled: True
    # Connector credentials as environment variables, each from its own
    # ExternalSecret below. Optional: a missing GitHub OAuth App or LLDAP
    # account disables only that sign-in, and Dex still starts (it continues on
    # connector failure).
    envFrom:
      - secretRef:
          name: argocd-dex-github
          optional: true

      - secretRef:
          name: argocd-dex-lldap
          optional: true


    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo



  notifications:
    enabled: True
    argocdUrl: https://argocd.demo.opsp.dev

    # Keep (charts/keep) receives each sync failure and its recovery, so an
    # alert there resolves itself. Keep sends the Slack message.
    subscriptions:
      - recipients:
          - keep
        triggers:
          - on-keep-sync



  configs:
    rbac:
      policy.default: "role:readonly"

      # mcp-argocd can mutate every Application, including Argo CD itself.
      # With the current unrestricted AppProjects, updating Helm values and
      # syncing can change cluster resources and RBAC. Treat this API token
      # as an administrative credential; the named role is not a sandbox.
      # Read-only access requires removing create/update/delete/sync/action
      # grants here and in install/eks/values.yaml. MCP_READ_ONLY only hides tools.
      # Every account inherits policy.default; deny rules cannot remove those
      # default grants. Narrower reads require a smaller default role first.
      # sso.admin_groups (env/<cluster>.yaml) administer; everyone else reads (policy.default).
      policy.csv: |
        g, opspresso:sre, role:admin
        g, sre, role:admin

        p, role:mcp, applications, get, */*, allow
        p, role:mcp, applications, create, */*, allow
        p, role:mcp, applications, update, */*, allow
        p, role:mcp, applications, delete, */*, allow
        p, role:mcp, applications, sync, */*, allow
        p, role:mcp, applications, action/*, */*, allow
        p, role:mcp, logs, get, */*, allow
        p, role:mcp, projects, get, *, allow
        p, role:mcp, clusters, get, *, allow
        g, mcp, role:mcp

        # keep has no grants here: policy.default gives it read-only access,
        # which is all the Keep argocd provider uses (applications, resource trees).

    cm:
      url: https://argocd.demo.opsp.dev

      statusbadge.url: https://argocd.demo.opsp.dev/

      help.chatUrl: "https://app.slack.com/client/T03FUG4UB/C035P1YD72A"
      help.chatText: "Chat now!"

      # Local account for mcp-argocd. `apiKey` and not `login`: it may mint API
      # tokens but cannot sign in, so there is no password on it to guess and it
      # never turns into a UI session.
      accounts.mcp: apiKey
      # Local account for the Keep argocd provider. install/eks/token.sh signs its token.
      accounts.keep: apiKey

      dex.config: |
        connectors:
        - type: github
          id: github
          name: github
          config:
            # Secret argocd-dex-github (dex.envFrom).
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            teamNameField: slug
            orgs:
              - name: opspresso

        # LLDAP (charts/lldap): ID and password. The claim groups holds the
        # LLDAP group names. The bind user is the LLDAP admin. Dex expands the
        # environment variables from the Secret argocd-dex-lldap (dex.envFrom).
        - type: ldap
          id: lldap
          name: LLDAP
          config:
            host: lldap.addon-lldap.svc.cluster.local:3890
            # Plain LDAP inside the cluster: the NetworkPolicy of charts/lldap
            # admits only the Dex Pods to this port.
            insecureNoSSL: true
            bindDN: $LLDAP_BIND_DN
            bindPW: $LLDAP_BIND_PW
            usernamePrompt: Username
            userSearch:
              baseDN: ou=people,dc=opspresso,dc=com
              filter: "(objectClass=person)"
              username: uid
              idAttr: uid
              emailAttr: mail
              nameAttr: displayName
              preferredUsernameAttr: uid
            groupSearch:
              baseDN: ou=groups,dc=opspresso,dc=com
              filter: "(objectClass=groupOfUniqueNames)"
              userMatchers:
                - userAttr: DN
                  groupAttr: member
              nameAttr: cn

        staticClients:
        - id: argo-workflows-sso
          name: Argo Workflow
          redirectURIs:
            - https://workflows.demo.opsp.dev/oauth2/callback
          secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        - id: oauth2-proxy-sso
          name: OAuth2 Proxy
          redirectURIs:
            - https://auth.demo.opsp.dev/oauth2/callback
          secretEnv: OAUTH2_PROXY_SSO_CLIENT_SECRET
        - id: keep-sso
          name: Keep
          redirectURIs:
            - https://keep.demo.opsp.dev/api/auth/callback/oidc
          secretEnv: KEEP_SSO_CLIENT_SECRET
        - id: gitlab-sso
          name: GitLab
          redirectURIs:
            - https://gitlab.demo.opsp.dev/users/auth/openid_connect/callback
          secretEnv: GITLAB_SSO_CLIENT_SECRET
        - id: grafana-sso
          name: Grafana
          redirectURIs:
            - https://grafana.demo.opsp.dev/login/generic_oauth
          secretEnv: GRAFANA_SSO_CLIENT_SECRET
        - id: jenkins-sso
          name: Jenkins
          redirectURIs:
            - https://jenkins.demo.opsp.dev/securityRealm/finishLogin
          secretEnv: JENKINS_SSO_CLIENT_SECRET




raw:
  resources:
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: addons
      spec:
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
        destinations:
          - name: "*"
            namespace: "*"
            server: "*"
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-addons"
          - "http://opspresso.github.io/helm-charts"

    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: apps
      spec:
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
        destinations:
          - name: "*"
            namespace: "*"
            server: "*"
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-apps"
          - "http://opspresso.github.io/helm-charts"


    # Apps that Agent Runway deploys (agent-platform docs/APP_DELIVERY.md, docs/DELIVERY_V2.md). The app-deploy and
    # resource-sync workflows write argocd-env-projects projects/<slug>/<env>/{app,resources}.yaml and
    # resources/<name>.yaml; only that step writes them, so the project limits where these Applications deploy (app-* namespaces other than
    # app-delivery), not which namespaced kinds they hold.
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: projects
      spec:
        description: One Application per Agent Runway Project environment and dedicated chart resource
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-projects.git"
          - "https://opspresso.github.io/helm-charts"
        destinations:
          - name: "eks-demo"
            namespace: "app-*"
          - name: "*"
            namespace: "!app-delivery"
        clusterResourceWhitelist:
          - group: ""
            kind: Namespace
        namespaceResourceWhitelist:
          # Every kind: Argo CD hides a child kind its project does not list, and the tree must show all resources.
          - {group: "*", kind: "*"}

    # The app-build, app-deploy and resource-sync WorkflowTemplates, their step identities, Agent Runway's submit
    # permission, and the env-cleanup CronWorkflow that removes emptied environment directories once nothing is live.
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: delivery
      spec:
        description: The Argo Workflows delivery of Agent Runway apps
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-projects.git"
        destinations:
          - name: "eks-demo"
            namespace: app-delivery
        clusterResourceWhitelist:
          - {group: "", kind: Namespace}
          - {group: rbac.authorization.k8s.io, kind: ClusterRole}
          - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
        namespaceResourceWhitelist:
          - {group: "", kind: ServiceAccount}
          - {group: "", kind: ConfigMap}
          # The executor-only ServiceAccount token of the runner steps.
          - {group: "", kind: Secret}
          - {group: rbac.authorization.k8s.io, kind: Role}
          - {group: rbac.authorization.k8s.io, kind: RoleBinding}
          - {group: networking.k8s.io, kind: NetworkPolicy}
          - {group: external-secrets.io, kind: ExternalSecret}
          - {group: argoproj.io, kind: WorkflowTemplate}
          - {group: argoproj.io, kind: CronWorkflow}



    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-notifications-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-notifications-secret
        data:
          # X-API-KEY of service.webhook.keep: a Keep API key with the webhook role.
          - secretKey: keep-api-key
            remoteRef:
              key: /k8s/common/keep/argocd-api-key


    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-applicationset-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-applicationset-secret
        data:
          - secretKey: webhook.github.secret
            remoteRef:
              key: /k8s/common/argocd-webhook


    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-secret
        data:
          - secretKey: admin.password
            remoteRef:
              key: /k8s/common/argocd-password
          - secretKey: admin.passwordMtime
            remoteRef:
              key: /k8s/common/argocd-mtime
          - secretKey: webhook.github.secret
            remoteRef:
              key: /k8s/common/argocd-webhook
          - secretKey: server.secretkey
            remoteRef:
              key: /k8s/common/argocd-server-secret
          # The `mcp` account's token list, seeded rather than left where Argo
          # CD puts it. `argocd account generate-token` writes the list into
          # this very Secret in-cluster, and this ExternalSecret owns the
          # Secret — so nothing in git would bring the list back after a
          # rebuild, and the token mcp-argocd holds would start answering 401
          # with no trace of why. Seeding it keeps both sides agreeing, the same
          # bargain admin.password already takes.
          #
          # install/token.sh writes this parameter, and install/values.yaml
          # seeds the same key at bootstrap. It must exist before this renders:
          # a missing parameter fails the whole ExternalSecret, so on a fresh
          # cluster argocd-secret would never appear at all.
          - secretKey: accounts.mcp.tokens
            remoteRef:
              key: /k8s/common/argocd-mcp-tokens
          # The keep account's token list. install/eks/token.sh --account keep writes it.
          - secretKey: accounts.keep.tokens
            remoteRef:
              key: /k8s/common/argocd-keep-tokens

          - secretKey: argo-workflows-client-secret
            remoteRef:
              key: /k8s/common/argo-workflows-client-secret
          - secretKey: oauth2-proxy-client-secret
            remoteRef:
              key: /k8s/common/oauth2-proxy-client-secret
          - secretKey: keep-client-secret
            remoteRef:
              key: /k8s/common/keep/oidc-client-secret
          - secretKey: gitlab-client-secret
            remoteRef:
              key: /k8s/common/gitlab/oidc-client-secret
          - secretKey: grafana-client-secret
            remoteRef:
              key: /k8s/common/grafana/oidc-client-secret
          - secretKey: jenkins-client-secret
            remoteRef:
              key: /k8s/common/jenkins/oidc-client-secret

    # GitHub OAuth App of the Dex connector github. It is apart from
    # argocd-secret: a missing App fails only this ExternalSecret and the GitHub
    # sign-in, not the admin password and API tokens. dex.config resolves $<key>
    # only from argocd-secret, so Dex reads these values as environment variables.
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-dex-github
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-dex-github
        data:
          - secretKey: GITHUB_CLIENT_ID
            remoteRef:
              key: /k8s/opspresso/argocd-github-id
          - secretKey: GITHUB_CLIENT_SECRET
            remoteRef:
              key: /k8s/opspresso/argocd-github-secret


    # Bind user of the Dex connector lldap: the Argo CD admin, which is also
    # the LLDAP admin. Dex reads these values as environment variables.
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-dex-lldap
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-dex-lldap
          template:
            engineVersion: v2
            data:
              LLDAP_BIND_DN: "uid={{ .user }},ou=people,dc=opspresso,dc=com"
              LLDAP_BIND_PW: "{{ .password }}"
        data:
          - secretKey: user
            remoteRef:
              key: /k8s/common/admin-user
          - secretKey: password
            remoteRef:
              key: /k8s/common/admin-password

