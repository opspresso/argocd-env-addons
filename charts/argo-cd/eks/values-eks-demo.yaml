argo-cd:
  fullnameOverride: argocd


  controller:
    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  server:
    ingress:
      enabled: false
      hostname: "argocd.demo.opspresso.com"
      annotations:
        kubernetes.io/ingress.class: "alb"
        external-dns.alpha.kubernetes.io/hostname: "argocd.demo.opspresso.com"
        alb.ingress.kubernetes.io/scheme: "internet-facing"
        alb.ingress.kubernetes.io/target-type: "ip"
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:396608815058:certificate/1e9672d7-627a-4e00-826c-925e330b5165"
        alb.ingress.kubernetes.io/actions.ssl-redirect: |
          {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}

    httproute:
      enabled: true
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "argocd.demo.opspresso.com"

    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  repoServer:
    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  dex:
    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  notifications:
    argocdUrl: https://argocd.demo.opspresso.com

  configs:
    rbac:
      policy.default: "role:readonly"

      # `mcp` is the API-token account that mcp-argocd (argocd-env-demo) runs
      # as. Named permissions rather than role:admin, because this token sits in
      # a pod an LLM drives: what it may *change* is applications and nothing
      # else. Repositories, clusters, accounts and this policy itself have no
      # write here, and `exec` appears in neither this role nor the default one.
      # Deleting the create/update/delete/sync and action/* lines is what makes
      # it read-only, and this is the boundary that counts — MCP_READ_ONLY on
      # the pod only decides which tools get listed.
      #
      # It does not narrow reading, though. policy.default below is
      # role:readonly, every account inherits it, and Argo CD's built-in
      # definition of that role is `get` on applications, applicationsets,
      # certificates, clusters, repositories, projects, accounts, gpgkeys and
      # logs. So the logs/projects/clusters lines below are redundant today —
      # they are kept so the role still stands on its own if policy.default is
      # ever tightened. Narrowing reads for this account alone would take
      # explicit deny rules, which Argo CD evaluates ahead of allows.
      policy.csv: |
        g, opspresso:sre, role:admin

        p, role:mcp, applications, get, */*, allow
        p, role:mcp, applications, create, */*, allow
        p, role:mcp, applications, update, */*, allow
        p, role:mcp, applications, delete, */*, allow
        p, role:mcp, applications, sync, */*, allow
        p, role:mcp, applications, action/*, */*, allow
        p, role:mcp, logs, get, */*, allow
        p, role:mcp, projects, get, *, allow
        p, role:mcp, clusters, get, *, allow
        g, mcp, role:mcp

    cm:
      url: https://argocd.demo.opspresso.com

      statusbadge.url: https://argocd.demo.opspresso.com/

      help.chatUrl: "https://app.slack.com/client/T03FUG4UB/C035P1YD72A"
      help.chatText: "Chat now!"

      # Local account for mcp-argocd. `apiKey` and not `login`: it may mint API
      # tokens but cannot sign in, so there is no password on it to guess and it
      # never turns into a UI session.
      accounts.mcp: apiKey

      dex.config: |
        connectors:
        - type: github
          id: github
          name: github
          config:
            clientID: $dex.github.clientId
            clientSecret: $dex.github.clientSecret
            teamNameField: slug
            orgs:
              - name: opspresso
        staticClients:
        - id: argo-workflows-sso
          name: Argo Workflow
          redirectURIs:
            - https://workflows.demo.opspresso.com/oauth2/callback
          secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        - id: oauth2-proxy-sso
          name: OAuth2 Proxy
          redirectURIs:
            - https://auth.demo.opspresso.com/oauth2/callback
          secretEnv: OAUTH2_PROXY_SSO_CLIENT_SECRET

raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-secret
        data:
          - secretKey: admin.password
            remoteRef:
              key: /k8s/common/argocd-password
          - secretKey: admin.passwordMtime
            remoteRef:
              key: /k8s/common/argocd-mtime
          - secretKey: dex.github.clientId
            remoteRef:
              key: /k8s/opspresso/argocd-github-id
          - secretKey: dex.github.clientSecret
            remoteRef:
              key: /k8s/opspresso/argocd-github-secret
          - secretKey: webhook.github.secret
            remoteRef:
              key: /k8s/common/argocd-webhook
          - secretKey: server.secretkey
            remoteRef:
              key: /k8s/common/argocd-server-secret
          # The `mcp` account's token list, seeded rather than left where Argo
          # CD puts it. `argocd account generate-token` writes the list into
          # this very Secret in-cluster, and this ExternalSecret owns the
          # Secret — so nothing in git would bring the list back after a
          # rebuild, and the token mcp-argocd holds would start answering 401
          # with no trace of why. Seeding it keeps both sides agreeing, the same
          # bargain admin.password already takes.
          #
          # install/token.sh writes this parameter, and install/values.yaml
          # seeds the same key at bootstrap. It must exist before this renders:
          # a missing parameter fails the whole ExternalSecret, so on a fresh
          # cluster argocd-secret would never appear at all.
          - secretKey: accounts.mcp.tokens
            remoteRef:
              key: /k8s/common/argocd-mcp-tokens

          - secretKey: argo-workflows-client-secret
            remoteRef:
              key: /k8s/common/argo-workflows-client-secret
          - secretKey: oauth2-proxy-client-secret
            remoteRef:
              key: /k8s/common/oauth2-proxy-client-secret
