argo-cd:
  fullnameOverride: argocd

  controller:
    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo


  server:
    replicas: 2


    autoscaling:
      enabled: false

    ingress:
      enabled: false
      hostname: "argocd.demo.rovr.dev"
      annotations:
        kubernetes.io/ingress.class: "alb"
        external-dns.alpha.kubernetes.io/hostname: "argocd.demo.rovr.dev"
        alb.ingress.kubernetes.io/scheme: "internet-facing"
        alb.ingress.kubernetes.io/target-type: "ip"
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:396608815058:certificate/d4da4325-af9e-43f7-8d35-868b1b6f8fa7"
        alb.ingress.kubernetes.io/actions.ssl-redirect: |
          {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}

    httproute:
      enabled: True
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "argocd.demo.rovr.dev"

    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  repoServer:
    replicas: 2


    autoscaling:
      enabled: false

    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo

  applicationSet:
    replicas: 1


  dex:
    enabled: True

    metrics:
      serviceMonitor:
        enabled: True
        selector:
          release: prometheus-eks-demo



  notifications:
    enabled: True
    argocdUrl: https://argocd.demo.rovr.dev
    # Report outcomes only. Every GitOps commit syncs many apps, so the
    # running and succeeded triggers flooded the channel.
    subscriptions:
      - recipients:
          - slack:noti-eks-demo
        triggers:
          - on-deployed
          - on-health-degraded
          - on-sync-failed
          - on-sync-status-unknown


  configs:
    rbac:
      policy.default: "role:readonly"

      # mcp-argocd can mutate every Application, including Argo CD itself.
      # With the current unrestricted AppProjects, updating Helm values and
      # syncing can change cluster resources and RBAC. Treat this API token
      # as an administrative credential; the named role is not a sandbox.
      # Read-only access requires removing create/update/delete/sync/action
      # grants here and in install/eks/values.yaml. MCP_READ_ONLY only hides tools.
      # Every account inherits policy.default; deny rules cannot remove those
      # default grants. Narrower reads require a smaller default role first.
      policy.csv: |
        g, opspresso:dev, role:admin

        p, role:mcp, applications, get, */*, allow
        p, role:mcp, applications, create, */*, allow
        p, role:mcp, applications, update, */*, allow
        p, role:mcp, applications, delete, */*, allow
        p, role:mcp, applications, sync, */*, allow
        p, role:mcp, applications, action/*, */*, allow
        p, role:mcp, logs, get, */*, allow
        p, role:mcp, projects, get, *, allow
        p, role:mcp, clusters, get, *, allow
        g, mcp, role:mcp

    cm:
      url: https://argocd.demo.rovr.dev

      statusbadge.url: https://argocd.demo.rovr.dev/

      help.chatUrl: "https://app.slack.com/client/T03FUG4UB/C035P1YD72A"
      help.chatText: "Chat now!"

      # Local account for mcp-argocd. `apiKey` and not `login`: it may mint API
      # tokens but cannot sign in, so there is no password on it to guess and it
      # never turns into a UI session.
      accounts.mcp: apiKey

      dex.config: |
        connectors:
        - type: github
          id: github
          name: github
          config:
            clientID: $dex.github.clientId
            clientSecret: $dex.github.clientSecret
            teamNameField: slug
            orgs:
              - name: opspresso
        staticClients:
        - id: argo-workflows-sso
          name: Argo Workflow
          redirectURIs:
            - https://workflows.demo.rovr.dev/oauth2/callback
          secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        - id: oauth2-proxy-sso
          name: OAuth2 Proxy
          redirectURIs:
            - https://auth.demo.rovr.dev/oauth2/callback
          secretEnv: OAUTH2_PROXY_SSO_CLIENT_SECRET




raw:
  resources:
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: addons
      spec:
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
        destinations:
          - name: "*"
            namespace: "*"
            server: "*"
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-addons"

    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: apps
      spec:
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
        destinations:
          - name: "*"
            namespace: "*"
            server: "*"
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-apps"

    # Apps that Agent Broker delivers (agent-platform docs/APP_DELIVERY.md). The app-delivery workflow writes
    # argocd-env-projects projects/<slug>/<env>.yaml; these Applications may only create the kinds the app chart
    # renders, in app-* namespaces other than app-delivery.
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: projects
      spec:
        description: One Application per Agent Broker Project environment
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-projects.git"
        destinations:
          - name: "eks-demo"
            namespace: "app-*"
          - name: "*"
            namespace: "!app-delivery"
        clusterResourceWhitelist:
          - group: ""
            kind: Namespace
        namespaceResourceWhitelist:
          - {group: "", kind: ServiceAccount}
          - {group: "", kind: Service}
          - {group: "", kind: ResourceQuota}
          - {group: apps, kind: Deployment}
          - {group: autoscaling, kind: HorizontalPodAutoscaler}
          - {group: policy, kind: PodDisruptionBudget}
          - {group: networking.k8s.io, kind: NetworkPolicy}
          - {group: gateway.networking.k8s.io, kind: HTTPRoute}
          - {group: external-secrets.io, kind: SecretStore}
          - {group: external-secrets.io, kind: ExternalSecret}

    # The app-delivery WorkflowTemplate, its step identities and the Broker's submit permission.
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: delivery
      spec:
        description: The Argo Workflows delivery of Agent Broker apps
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-projects.git"
        destinations:
          - name: "eks-demo"
            namespace: app-delivery
        clusterResourceWhitelist:
          - {group: "", kind: Namespace}
          - {group: rbac.authorization.k8s.io, kind: ClusterRole}
          - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
        namespaceResourceWhitelist:
          - {group: "", kind: ServiceAccount}
          - {group: "", kind: ConfigMap}
          - {group: rbac.authorization.k8s.io, kind: Role}
          - {group: rbac.authorization.k8s.io, kind: RoleBinding}
          - {group: networking.k8s.io, kind: NetworkPolicy}
          - {group: external-secrets.io, kind: ExternalSecret}
          - {group: argoproj.io, kind: WorkflowTemplate}

    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: app-delivery
        labels:
          opspresso.com/cluster: "eks-demo"
          opspresso.com/group: "projects"
      spec:
        project: delivery
        destination:
          name: "eks-demo"
          namespace: app-delivery
        source:
          repoURL: https://github.com/opspresso/argocd-env-projects.git
          targetRevision: HEAD
          path: charts/delivery
          helm:
            valuesObject:
              registry: "396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/projects"
              pushRoleArn: "arn:aws:iam::396608815058:role/app-delivery-push"
              region: "ap-northeast-2"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

    # One Application per projects/<slug>/<env>.yaml. Project, environment, namespace and domain come from the
    # file path and this cluster, never from the file, so a values file cannot move or rename an app.
    - apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: projects
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - git:
              repoURL: https://github.com/opspresso/argocd-env-projects.git
              revision: HEAD
              requeueAfterSeconds: 30
              files:
                - path: "projects/*/dev.yaml"
                - path: "projects/*/prod.yaml"
        template:
          metadata:
            name: 'app-{{ .path.basename }}-{{ trimSuffix ".yaml" .path.filename }}'
            labels:
              opspresso.com/cluster: "eks-demo"
              opspresso.com/group: "projects"
              opspresso.com/broker-project: '{{ .path.basename }}'
              opspresso.com/broker-env: '{{ trimSuffix ".yaml" .path.filename }}'
          spec:
            project: projects
            destination:
              name: "eks-demo"
              namespace: 'app-{{ .path.basename }}-{{ trimSuffix ".yaml" .path.filename }}'
            source:
              repoURL: https://github.com/opspresso/argocd-env-projects.git
              targetRevision: HEAD
              path: charts/app
              helm:
                valueFiles:
                  - '../../{{ .path.path }}/{{ .path.filename }}'
                parameters:
                  - name: project
                    value: '{{ .path.basename }}'
                  - name: environment
                    value: '{{ trimSuffix ".yaml" .path.filename }}'
                  - name: domain
                    value: "apps.rovr.dev"
                  - name: cluster
                    value: "eks-demo"
                  - name: region
                    value: "ap-northeast-2"
                  - name: tenantSecretsRoleArn
                    value: "arn:aws:iam::396608815058:role/agent-broker-tenant-secrets"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
              # The Broker tenant secrets policy accepts the SecretStore only in a namespace with these labels.
              managedNamespaceMetadata:
                labels:
                  opspresso.com/broker-tenant: "true"
                  opspresso.com/broker-project: '{{ .path.basename }}'
                  opspresso.com/broker-env: '{{ trimSuffix ".yaml" .path.filename }}'

    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-notifications-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-notifications-secret
        data:
          - secretKey: slack-token
            remoteRef:
              key: /k8s/common/argocd-noti-token

    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-applicationset-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-applicationset-secret
        data:
          - secretKey: webhook.github.secret
            remoteRef:
              key: /k8s/common/argocd-webhook
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-secret
        data:
          - secretKey: admin.password
            remoteRef:
              key: /k8s/common/argocd-password
          - secretKey: admin.passwordMtime
            remoteRef:
              key: /k8s/common/argocd-mtime
          - secretKey: dex.github.clientId
            remoteRef:
              key: /k8s/opspresso/argocd-github-id
          - secretKey: dex.github.clientSecret
            remoteRef:
              key: /k8s/opspresso/argocd-github-secret
          - secretKey: webhook.github.secret
            remoteRef:
              key: /k8s/common/argocd-webhook
          - secretKey: server.secretkey
            remoteRef:
              key: /k8s/common/argocd-server-secret
          # The `mcp` account's token list, seeded rather than left where Argo
          # CD puts it. `argocd account generate-token` writes the list into
          # this very Secret in-cluster, and this ExternalSecret owns the
          # Secret — so nothing in git would bring the list back after a
          # rebuild, and the token mcp-argocd holds would start answering 401
          # with no trace of why. Seeding it keeps both sides agreeing, the same
          # bargain admin.password already takes.
          #
          # install/token.sh writes this parameter, and install/values.yaml
          # seeds the same key at bootstrap. It must exist before this renders:
          # a missing parameter fails the whole ExternalSecret, so on a fresh
          # cluster argocd-secret would never appear at all.
          - secretKey: accounts.mcp.tokens
            remoteRef:
              key: /k8s/common/argocd-mcp-tokens

          - secretKey: argo-workflows-client-secret
            remoteRef:
              key: /k8s/common/argo-workflows-client-secret
          - secretKey: oauth2-proxy-client-secret
            remoteRef:
              key: /k8s/common/oauth2-proxy-client-secret