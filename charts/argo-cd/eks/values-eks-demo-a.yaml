argo-cd:
  fullnameOverride: argocd



raw:
  resources:
    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: addons
      spec:
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
        destinations:
          - name: "*"
            namespace: "*"
            server: "*"
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-addons"
          - "http://opspresso.github.io/helm-charts"

    - apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: apps
      spec:
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
        destinations:
          - name: "*"
            namespace: "*"
            server: "*"
        sourceRepos:
          - "https://github.com/opspresso/argocd-env-apps"
          - "http://opspresso.github.io/helm-charts"





    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-applicationset-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argocd-applicationset-secret
        data:
          - secretKey: webhook.github.secret
            remoteRef:
              key: /k8s/common/argocd-webhook


