argo-cd:
  fullnameOverride: argocd

  redisSecretInit:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

  controller:
    # Working set p95 1.7Gi and peak 3.4Gi during full reconciles; CPU p95
    # 200m (7 days to 2026-11-11). The request covers the peak so a full
    # reconcile on a full node is not the first Pod evicted.
    resources:
      requests:
        cpu: 240m
        memory: 3456Mi
      limits:
        memory: 5Gi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s

  server:
    replicas: 1

    # maxUnavailable keeps drains possible when an env runs one replica.
    pdb:
      enabled: true
      maxUnavailable: 1

    # Working set p95 100Mi.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

    service:
      type: ClusterIP

    ingress:
      enabled: false

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s

  # Manifest generation can burst above its reservation without a CPU ceiling.
  repoServer:
    replicas: 1

    pdb:
      enabled: true
      maxUnavailable: 1
    # Working set p95 310Mi, peak 540Mi while rendering; CPU p95 100m (7 days to 2026-11-11).
    resources:
      requests:
        cpu: 125m
        memory: 544Mi
      limits:
        memory: 1Gi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s

  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  # Off: Argo CD signs in through the platform Dex (charts/dex, oidc.config).
  dex:
    enabled: false

  redis:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  notifications:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi

    secret:
      create: false

    notifiers:
      # Keep's generic alert endpoint (POST /alerts/event) reads the keep-* templates.
      service.webhook.keep: |
        url: http://keep-backend.addon-keep.svc.cluster.local:8080
        headers:
          - name: Content-Type
            value: application/json
          - name: X-API-KEY
            value: $keep-api-key

    templates:
      # Keep alert for a failed sync. One fingerprint per application: the
      # failure sends status firing, the next successful sync resolves it.
      # Degraded health and Unknown sync status are not sent from here: they
      # are often short (installs, rollouts, deletions), notifications cannot
      # wait them out, and a deleted application never sends its recovery.
      # Grafana rules on argocd_app_info alert on them after they persist
      # (config/workload-health-alerts.yaml).
      # toJson quotes values that can hold quotes or newlines.
      template.keep-app-sync: |
        webhook:
          keep:
            method: POST
            path: /alerts/event
            body: |
              {
                "name": {{printf "Argo CD application %s sync %s" .app.metadata.name .app.status.operationState.phase | toJson}},
                "status": "{{if eq .app.status.operationState.phase "Succeeded"}}resolved{{else}}firing{{end}}",
                "severity": "high",
                "source": ["argocd"],
                "service": {{.app.metadata.name | toJson}},
                "fingerprint": {{printf "argocd-sync-%s" .app.metadata.name | toJson}},
                "lastReceived": "{{(call .time.Now).UTC.Format "2006-01-02T15:04:05Z"}}",
                "description": {{.app.status.operationState.message | toJson}},
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}",
                "labels": {
                  "application": {{.app.metadata.name | toJson}},
                  "project": {{.app.spec.project | toJson}},
                  "revision": {{.app.status.operationState.syncResult.revision | toJson}}
                }
              }

    triggers:
      # Fires on the problem and on its recovery.
      trigger.on-keep-sync: |
        - description: Application syncing has failed
          send:
          - keep-app-sync
          when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        - description: Application syncing has succeeded
          send:
          - keep-app-sync
          when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']

  configs:
    params:
      server.insecure: true

    cm:

      statusbadge.enabled: "true"
      # EKS Auto Mode churns NodeClaims on every scale event; keep them out of
      # the resource cache.
      resource.exclusions: |
        - apiGroups:
            - karpenter.sh
          kinds:
            - NodeClaim
          clusters:
            - "*"

      # Agent Runway RdsPostgres (kro, charts/kro): Healthy when kro reports Ready, Degraded when ACK reports a
      # terminal error, Progressing while RDS is created (about 10 minutes).
      resource.customizations.health.kro.run_RdsPostgres: |
        local hs = {status = "Progressing", message = "Waiting for the RDS instance"}
        local status = obj.status
        if status == nil then
          return hs
        end
        if status.message ~= nil and status.message ~= "" then
          hs.message = status.message
        end
        if status.terminal == true then
          hs.status = "Degraded"
          return hs
        end
        if status.conditions ~= nil then
          for _, condition in ipairs(status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "The RDS instance is available"
            end
          end
        end
        return hs

      # Agent Runway ValkeyCache and S3Bucket (kro, charts/kro): same rules as RdsPostgres.
      resource.customizations.health.kro.run_ValkeyCache: |
        local hs = {status = "Progressing", message = "Waiting for the serverless cache"}
        local status = obj.status
        if status == nil then
          return hs
        end
        if status.message ~= nil and status.message ~= "" then
          hs.message = status.message
        end
        if status.terminal == true then
          hs.status = "Degraded"
          return hs
        end
        if status.conditions ~= nil then
          for _, condition in ipairs(status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "The serverless cache is available"
            end
          end
        end
        return hs

      resource.customizations.health.kro.run_S3Bucket: |
        local hs = {status = "Progressing", message = "Waiting for the S3 bucket"}
        local status = obj.status
        if status == nil then
          return hs
        end
        if status.message ~= nil and status.message ~= "" then
          hs.message = status.message
        end
        if status.terminal == true then
          hs.status = "Degraded"
          return hs
        end
        if status.conditions ~= nil then
          for _, condition in ipairs(status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "The S3 bucket is ready"
            end
          end
        end
        return hs

    secret:
      createSecret: false

    repositories:
      env-addons-repo:
        name: env-addons
        type: git
        url: https://github.com/opspresso/argocd-env-addons
      env-demo-repo:
        name: env-demo
        type: git
        url: https://github.com/opspresso/argocd-env-apps
      opspresso-repo:
        name: opspresso
        type: helm
        url: https://opspresso.github.io/helm-charts
