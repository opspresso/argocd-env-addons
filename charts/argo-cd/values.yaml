argo-cd:
  fullnameOverride: argocd

  redisSecretInit:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

  controller:
    # Working set idles near 800Mi and reaches 2.8Gi during full reconciles.
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        memory: 4Gi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s
        # selector:
        #   release: prometheus-{{cluster}}

  server:
    replicas: 1

    # maxUnavailable keeps drains possible when an env runs one replica.
    pdb:
      enabled: true
      maxUnavailable: 1

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    service:
      type: ClusterIP

    ingress:
      enabled: false

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s
        # selector:
        #   release: prometheus-{{cluster}}

  # Manifest generation can burst above its reservation without a CPU ceiling.
  repoServer:
    replicas: 1

    pdb:
      enabled: true
      maxUnavailable: 1
    # autoscaling:
    #   enabled: true
    #   minReplicas: 2
    #   maxReplicas: 4
    #   targetCPUUtilizationPercentage: 60
    #   targetMemoryUtilizationPercentage: 60

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s
        # selector:
        #   release: prometheus-{{cluster}}

  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  dex:
    resources:
      requests:
        cpu: 5m
        memory: 96Mi
      limits:
        memory: 256Mi

    env:
      - name: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: argo-workflows-client-secret
      - name: OAUTH2_PROXY_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: oauth2-proxy-client-secret
      - name: KEEP_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: keep-client-secret
      - name: GITLAB_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: gitlab-client-secret
      - name: GRAFANA_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: grafana-client-secret
      - name: JENKINS_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: jenkins-client-secret
      - name: HARBOR_SSO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: argocd-secret
            key: harbor-client-secret

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        interval: 30s
        # selector:
        #   release: prometheus-{{cluster}}

  redis:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  notifications:
    # argocdUrl: https://{{argocd.hostname}}

    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi

    secret:
      create: false

    notifiers:
      # Keep's generic alert endpoint (POST /alerts/event) reads the keep-* templates.
      service.webhook.keep: |
        url: http://keep-backend.addon-keep.svc.cluster.local:8080
        headers:
          - name: Content-Type
            value: application/json
          - name: X-API-KEY
            value: $keep-api-key

    templates:
      # Keep alerts. One fingerprint per application and signal: the problem
      # sends status firing, the recovery sends resolved to the same alert.
      # toJson quotes values that can hold quotes or newlines.
      template.keep-app-health: |
        webhook:
          keep:
            method: POST
            path: /alerts/event
            body: |
              {
                "name": {{printf "Argo CD application %s is %s" .app.metadata.name .app.status.health.status | toJson}},
                "status": "{{if eq .app.status.health.status "Healthy"}}resolved{{else}}firing{{end}}",
                "severity": "high",
                "source": ["argocd"],
                "service": {{.app.metadata.name | toJson}},
                "fingerprint": {{printf "argocd-health-%s" .app.metadata.name | toJson}},
                "lastReceived": "{{(call .time.Now).UTC.Format "2006-01-02T15:04:05Z"}}",
                "description": {{.app.status.health.message | default (printf "Health status is %s." .app.status.health.status) | toJson}},
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}",
                "labels": {
                  "application": {{.app.metadata.name | toJson}},
                  "project": {{.app.spec.project | toJson}},
                  "health": {{.app.status.health.status | toJson}},
                  "sync": {{.app.status.sync.status | toJson}}
                }
              }
      template.keep-app-sync: |
        webhook:
          keep:
            method: POST
            path: /alerts/event
            body: |
              {
                "name": {{printf "Argo CD application %s sync %s" .app.metadata.name .app.status.operationState.phase | toJson}},
                "status": "{{if eq .app.status.operationState.phase "Succeeded"}}resolved{{else}}firing{{end}}",
                "severity": "high",
                "source": ["argocd"],
                "service": {{.app.metadata.name | toJson}},
                "fingerprint": {{printf "argocd-sync-%s" .app.metadata.name | toJson}},
                "lastReceived": "{{(call .time.Now).UTC.Format "2006-01-02T15:04:05Z"}}",
                "description": {{.app.status.operationState.message | toJson}},
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}",
                "labels": {
                  "application": {{.app.metadata.name | toJson}},
                  "project": {{.app.spec.project | toJson}},
                  "revision": {{.app.status.operationState.syncResult.revision | toJson}}
                }
              }
      template.keep-app-sync-status: |
        webhook:
          keep:
            method: POST
            path: /alerts/event
            body: |
              {
                "name": {{printf "Argo CD application %s sync status is %s" .app.metadata.name .app.status.sync.status | toJson}},
                "status": "{{if eq .app.status.sync.status "Unknown"}}firing{{else}}resolved{{end}}",
                "severity": "warning",
                "source": ["argocd"],
                "service": {{.app.metadata.name | toJson}},
                "fingerprint": {{printf "argocd-sync-status-%s" .app.metadata.name | toJson}},
                "lastReceived": "{{(call .time.Now).UTC.Format "2006-01-02T15:04:05Z"}}",
                "description": {{printf "Argo CD cannot compare the desired and live state (sync status %s). Check the repository, the manifest generation and the cluster connection." .app.status.sync.status | toJson}},
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}",
                "labels": {
                  "application": {{.app.metadata.name | toJson}},
                  "project": {{.app.spec.project | toJson}},
                  "sync": {{.app.status.sync.status | toJson}}
                }
              }

    triggers:
      # Each pair fires on the problem and on its recovery.
      trigger.on-keep-health: |
        - description: Application has degraded
          send:
          - keep-app-health
          when: app.status.health.status == 'Degraded'
        - description: Application is healthy
          send:
          - keep-app-health
          when: app.status.health.status == 'Healthy'
      trigger.on-keep-sync: |
        - description: Application syncing has failed
          send:
          - keep-app-sync
          when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        - description: Application syncing has succeeded
          send:
          - keep-app-sync
          when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
      trigger.on-keep-sync-status: |
        - description: Application sync status is Unknown
          send:
          - keep-app-sync-status
          when: app.status.sync.status == 'Unknown'
        - description: Application sync status is known again
          send:
          - keep-app-sync-status
          when: app.status.sync.status in ['Synced', 'OutOfSync']

  configs:
    # rbac:
    #   policy.default: "role:readonly"
    #   policy.csv: |
    #     g, {{argocd.github.org}}:{{argocd.github.team}}, role:admin

    params:
      server.insecure: true

    cm:

      statusbadge.enabled: "true"
      # statusbadge.url: https://{{argocd.hostname}}

      # EKS Auto Mode churns NodeClaims on every scale event; keep them out of
      # the resource cache.
      resource.exclusions: |
        - apiGroups:
            - karpenter.sh
          kinds:
            - NodeClaim
          clusters:
            - "*"

      # Agent Runway RdsPostgres (kro, charts/kro): Healthy when kro reports Ready, Degraded when ACK reports a
      # terminal error, Progressing while RDS is created (about 10 minutes).
      resource.customizations.health.kro.run_RdsPostgres: |
        local hs = {status = "Progressing", message = "Waiting for the RDS instance"}
        local status = obj.status
        if status == nil then
          return hs
        end
        if status.message ~= nil and status.message ~= "" then
          hs.message = status.message
        end
        if status.terminal == true then
          hs.status = "Degraded"
          return hs
        end
        if status.conditions ~= nil then
          for _, condition in ipairs(status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "The RDS instance is available"
            end
          end
        end
        return hs

      # Agent Runway ValkeyCache and S3Bucket (kro, charts/kro): same rules as RdsPostgres.
      resource.customizations.health.kro.run_ValkeyCache: |
        local hs = {status = "Progressing", message = "Waiting for the serverless cache"}
        local status = obj.status
        if status == nil then
          return hs
        end
        if status.message ~= nil and status.message ~= "" then
          hs.message = status.message
        end
        if status.terminal == true then
          hs.status = "Degraded"
          return hs
        end
        if status.conditions ~= nil then
          for _, condition in ipairs(status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "The serverless cache is available"
            end
          end
        end
        return hs

      resource.customizations.health.kro.run_S3Bucket: |
        local hs = {status = "Progressing", message = "Waiting for the S3 bucket"}
        local status = obj.status
        if status == nil then
          return hs
        end
        if status.message ~= nil and status.message ~= "" then
          hs.message = status.message
        end
        if status.terminal == true then
          hs.status = "Degraded"
          return hs
        end
        if status.conditions ~= nil then
          for _, condition in ipairs(status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "The S3 bucket is ready"
            end
          end
        end
        return hs

      # help.chatUrl: "{{argocd.chatUrl}}"
      # help.chatText: "Chat now!"

      # dex.config: |
      #   connectors:
      #   - type: github
      #     id: github
      #     name: github
      #     config:
      #       clientID: $dex.github.clientId
      #       clientSecret: $dex.github.clientSecret
      #       teamNameField: slug
      #       orgs:
      #         - name: {{argocd.github.org}}
      #   staticClients:
      #   - id: argo-workflows-sso
      #     name: Argo Workflow
      #     redirectURIs:
      #       - https://workflows.{{hostname.public}}/oauth2/callback
      #     secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
      #   - id: oauth2-proxy-sso
      #     name: OAuth2 Proxy
      #     redirectURIs:
      #       - https://auth.{{hostname.public}}/oauth2/callback
      #     secretEnv: OAUTH2_PROXY_SSO_CLIENT_SECRET

    secret:
      createSecret: false

    repositories:
      env-addons-repo:
        name: env-addons
        type: git
        url: https://github.com/opspresso/argocd-env-addons
      env-demo-repo:
        name: env-demo
        type: git
        url: https://github.com/opspresso/argocd-env-apps
      opspresso-repo:
        name: opspresso
        type: helm
        url: https://opspresso.github.io/helm-charts
