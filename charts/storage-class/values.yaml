raw:
  fullnameOverride: storage-class

  resources:
    # EKS Auto Mode built-in EBS CSI driver (ebs.csi.eks.amazonaws.com)
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: gp3
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
          # parameters are immutable. Recreating the class does not touch
          # existing PersistentVolumes.
          argocd.argoproj.io/sync-options: Force=true,Replace=true
      provisioner: ebs.csi.eks.amazonaws.com
      volumeBindingMode: WaitForFirstConsumer
      # Keep the EBS volume when its claim is deleted, so data survives an
      # accidental prune. Delete released volumes by hand.
      reclaimPolicy: Retain
      parameters:
        type: gp3
        encrypted: "true"
      allowVolumeExpansion: true

    # Scratch volumes whose data ends with their claim, such as Argo Workflows
    # volumeClaimTemplates. Deleting the claim deletes the EBS volume.
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: gp3-ephemeral
        annotations:
          argocd.argoproj.io/sync-options: Force=true,Replace=true
      provisioner: ebs.csi.eks.amazonaws.com
      volumeBindingMode: WaitForFirstConsumer
      reclaimPolicy: Delete
      parameters:
        type: gp3
        encrypted: "true"
      allowVolumeExpansion: true
