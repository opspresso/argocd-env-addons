oauth2-proxy:
  fullnameOverride: oauth2-proxy
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

  # client-id, client-secret, cookie-secret
  config:
    existingSecret: oauth2-proxy-secret

raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: oauth2-proxy-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: oauth2-proxy-secret
          template:
            engineVersion: v2
            mergePolicy: Merge
            data:
              client-id: oauth2-proxy-sso
        data:
          - secretKey: client-secret
            remoteRef:
              key: /k8s/common/oauth2-proxy-client-secret
          - secretKey: cookie-secret
            remoteRef:
              key: /k8s/common/cookie-secret
