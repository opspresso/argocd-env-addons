
oauth2-proxy:
  config:
    # Sign-in through Argo CD Dex (client oauth2-proxy-sso). Dex accepts only
    # members of the opspresso organization. Istio sends the hosts of
    # the AuthorizationPolicies with provider oauth2-proxy here (charts/istio).
    configFile: |-
      provider = "oidc"
      provider_display_name = "GitHub"
      oidc_issuer_url = "https://argocd.demo.opsp.dev/api/dex"
      client_id = "oauth2-proxy-sso"
      scope = "openid profile email groups"
      code_challenge_method = "S256"
      redirect_url = "https://auth.demo.opsp.dev/oauth2/callback"
      skip_provider_button = true

      upstreams = [ "static://200" ]
      email_domains = [ "*" ]
      cookie_domains = [ ".demo.opsp.dev" ]
      whitelist_domains = [ ".demo.opsp.dev" ]
      cookie_secure = true

      reverse_proxy = true
      set_xauthrequest = true
      pass_access_token = true

      silence_ping_logging = true

raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: oauth2-proxy-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: oauth2-proxy-secret
          template:
            engineVersion: v2
            mergePolicy: Merge
            data:
              client-id: oauth2-proxy-sso
        data:
          - secretKey: client-secret
            remoteRef:
              key: /k8s/common/oauth2-proxy-client-secret
          - secretKey: cookie-secret
            remoteRef:
              key: /k8s/common/cookie-secret

    # The OAuth callback. The protected hosts redirect here and back.
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: oauth2-proxy
      spec:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway

            name: istio-ingressgateway
            namespace: istio-system

        hostnames:
          - "auth.demo.opsp.dev"
        rules:
          - backendRefs:
              - name: oauth2-proxy
                port: 80
