# Harbor 2.15 publishes amd64 images only. Every Pod runs on the harbor-amd64
# NodePool (terraform-env-demo demo/6-eks-node), which only Harbor tolerates.
x-amd64: &amd64
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations:
    - key: opspresso.com/harbor
      operator: Equal
      value: "true"
      effect: NoSchedule

x-small: &small
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

harbor:
  fullnameOverride: harbor

  # The gateway terminates TLS; nginx in this chart routes portal, core and registry.
  expose:
    type: clusterIP
    tls:
      enabled: false
    clusterIP:
      name: harbor

  existingSecretAdminPassword: harbor-secret
  existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
  existingSecretSecretKey: harbor-secret

  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:
      registry:
        storageClass: gp3
        size: 50Gi
      jobservice:
        jobLog:
          storageClass: gp3
          size: 1Gi
      database:
        storageClass: gp3
        size: 5Gi
      redis:
        storageClass: gp3
        size: 1Gi
      trivy:
        storageClass: gp3
        size: 5Gi

  nginx:
    <<: *amd64
    resources: *small
  portal:
    <<: *amd64
    resources: *small
  core:
    <<: *amd64
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # CONFIG_OVERWRITE_JSON (the OIDC settings) comes from the Secret harbor-oidc.
    extraEnvVars:
      - name: CONFIG_OVERWRITE_JSON
        valueFrom:
          secretKeyRef:
            name: harbor-oidc
            key: CONFIG_OVERWRITE_JSON
  jobservice:
    <<: *amd64
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  registry:
    <<: *amd64
    registry:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
    controller:
      resources: *small
  trivy:
    <<: *amd64
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  database:
    internal:
      <<: *amd64
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      initContainer:
        migrator:
          resources: *small
        permissions:
          resources: *small
  redis:
    internal:
      <<: *amd64
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 512Mi
  metrics:
    enabled: false
