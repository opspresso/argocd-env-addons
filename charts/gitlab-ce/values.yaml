gitlab-ce:
  fullnameOverride: gitlab-ce

  image:
    repository: gitlab/gitlab-ce
    tag: "19.5.3-ce.0"

  containerName: gitlab

  # One Pod owns the ReadWriteOnce volume, so a rolling update would wait for
  # the old Pod to release it.
  controller:
    strategy:
      type: Recreate

  # Omnibus nginx serves plain HTTP. The gateway terminates TLS.
  service:
    name: http
    port: 80
    targetPort: 80

  # Puma, Sidekiq, Gitaly, PostgreSQL and Redis run in this one container.
  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      memory: 6Gi

  # The first start runs the database migrations, which take several minutes.
  startupProbe:
    httpGet:
      path: /-/readiness
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 90
  readinessProbe:
    httpGet:
      path: /-/readiness
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /-/liveness
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  # GitLab stops its services on SIGTERM; PostgreSQL needs time to shut down cleanly.
  terminationGracePeriodSeconds: 120

  # One volume holds the configuration and the data. /etc/gitlab keeps
  # gitlab-secrets.json, the keys that decrypt the database secrets: losing it
  # makes CI variables, tokens and 2FA settings unreadable.
  # gp3 keeps the EBS volume (Retain) after the PVC is deleted.
  persistence:
    enabled: true
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    mountPath: /var/opt/gitlab
    subPath: data
  extraVolumeMounts:
    - name: data
      mountPath: /etc/gitlab
      subPath: config
    - name: logs
      mountPath: /var/log/gitlab
    # PostgreSQL uses /dev/shm. The GitLab Docker guide asks for 256MB; a
    # container gets 64MB by default.
    - name: shm
      mountPath: /dev/shm
  extraVolumes:
    - name: logs
      emptyDir:
        sizeLimit: 2Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi

  # Secret keys: GITLAB_ROOT_PASSWORD and GITLAB_OIDC_CLIENT_SECRET.
  externalSecrets:
    enabled: true
    name: gitlab-ce-secret
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
    data:
      # Omnibus sets the root password from GITLAB_ROOT_PASSWORD only when it
      # creates the database. Later changes have no effect.
      - key: /k8s/common/gitlab-ce/root-password
        name: GITLAB_ROOT_PASSWORD
      - key: /k8s/common/gitlab-ce/oidc-client-secret
        name: GITLAB_OIDC_CLIENT_SECRET
