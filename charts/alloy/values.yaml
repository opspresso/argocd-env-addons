alloy:
  fullnameOverride: alloy

  alloy:
    # /var/log/pods is root-owned on the node, so the collector has to run as
    # root to tail it.
    securityContext:
      runAsUser: 0

    # Read offsets live under storagePath; on the default /tmp/alloy they die
    # with the pod and every restart re-reads (duplicates) all logs.
    storagePath: /var/lib/alloy

    mounts:
      varlog: true

      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy

    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  controller:
    type: daemonset

    volumes:
      extra:
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate

    tolerations:
      - operator: Exists

    updateStrategy:
      rollingUpdate:
        maxUnavailable: 25%
