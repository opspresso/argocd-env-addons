alloy:
  fullnameOverride: alloy


  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"

          // Node-local discovery only: every daemon watches its own node
          // instead of the whole cluster.
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex         = "(.+)"
            target_label  = "app"
          }

          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.cri {}

          // One label value per log file otherwise.
          stage.label_drop {
            values = ["filename"]
          }

          forward_to = [loki.write.default.receiver]
        }


        // Auto Mode node agents are host processes, absent from Pod log discovery.
        local.file_match "aws_cni" {
          path_targets = [
            {"__path__" = "/var/log/aws-routed-eni/network-policy-agent.log", "job" = "kube-system/aws-network-policy-agent", "namespace" = "kube-system", "node" = sys.env("NODE_NAME")},
            {"__path__" = "/var/log/aws-routed-eni/ebpf-sdk.log", "job" = "kube-system/aws-ebpf-sdk", "namespace" = "kube-system", "node" = sys.env("NODE_NAME")},
          ]
        }

        loki.source.file "aws_cni" {
          targets    = local.file_match.aws_cni.targets
          forward_to = [loki.process.aws_cni.receiver]
        }

        loki.process "aws_cni" {
          // Debug conntrack events are high-volume; keep failures, including SDK errors at info level.
          stage.match {
            selector = "{namespace=\"kube-system\"} !~ \"(?i)error|failed\""
            action   = "drop"
          }
          stage.json {
            expressions = {"timestamp" = "ts"}
          }
          stage.timestamp {
            source = "timestamp"
            format = "RFC3339Nano"
          }
          stage.label_drop {
            values = ["filename"]
          }
          forward_to = [loki.write.default.receiver]
        }


        loki.write "default" {
          endpoint {
            url = "http://loki.demo-in.opspresso.com/loki/api/v1/push"
          }

          external_labels = {
            cluster = "eks-demo",
          }
        }

  rbac:
    # The chart concatenates both lists; an empty list breaks its ClusterRole YAML.
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get"]
    clusterRules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["list", "watch"]
raw:
  resources:
    # Auto Mode DefaultDeny also applies to infrastructure DaemonSets.
    # DNS rules follow Loki's load balancer addresses without allowing all HTTP.
    - apiVersion: networking.k8s.aws/v1alpha1
      kind: ApplicationNetworkPolicy
      metadata:
        name: alloy-network
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              - ipBlock:
                  cidr: 10.10.112.0/20
              - ipBlock:
                  cidr: 10.10.144.0/20
            ports:
              - protocol: TCP
                port: 12345
        egress:
          - to:
              - ipBlock:
                  cidr: 172.20.0.10/32
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - to:
              - ipBlock:
                  cidr: 172.20.0.1/32
            ports:
              - protocol: TCP
                port: 443
          - to:
              - domainNames:
                  - loki.demo-in.opspresso.com
            ports:
              - protocol: TCP
                port: 80

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vibemon-collector
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: vibemon-collector-eks-demo
      rules:
        - apiGroups: [""]
          resources: ["nodes", "pods"]
          verbs: ["list"]
        - apiGroups: ["metrics.k8s.io"]
          resources: ["nodes"]
          verbs: ["get", "list"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: vibemon-collector-eks-demo
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: vibemon-collector-eks-demo
      subjects:
        - kind: ServiceAccount
          name: vibemon-collector
          namespace: addon-alloy
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: vibemon-collector
      spec:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: vibemon-collector
          creationPolicy: Owner
        data:
          - secretKey: VIBEMON_WRITE_TOKEN
            remoteRef:
              key: /k8s/eks-demo/vibemon/write-token
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vibemon-collector
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app.kubernetes.io/name: vibemon-collector
        template:
          metadata:
            labels:
              app.kubernetes.io/name: vibemon-collector
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            serviceAccountName: vibemon-collector
            nodeSelector:
              kubernetes.io/os: linux
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: collector
                image: public.ecr.aws/z5d8x0d6/vibemon-collector@sha256:8a789311267207fdd9c47e0c19c9e31fd61884fd42dbf509e75fe45b3936829e
                args:
                  - --source-id
                  - eks-demo
                  - --name
                  - "EKS demo"
                  - --kind
                  - cluster
                  - --cluster-backend
                  - metrics-api
                  - --kubectl-command
                  - kubectl --cache-dir=/tmp/kubectl
                  - --url
                  - https://vibemon.io
                  - --health-file
                  - /tmp/vibemon-health
                env:
                  - name: VIBEMON_WRITE_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: vibemon-collector
                        key: VIBEMON_WRITE_TOKEN
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]

                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 192Mi

                readinessProbe:
                  exec:
                    command: ["python", "-m", "vibemon_collector.health", "/tmp/vibemon-health"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 1
                volumeMounts:
                  - name: temporary
                    mountPath: /tmp
            volumes:
              - name: temporary
                emptyDir:
                  sizeLimit: 32Mi

    - apiVersion: networking.k8s.aws/v1alpha1
      kind: ApplicationNetworkPolicy
      metadata:
        name: vibemon-collector-network
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vibemon-collector
        policyTypes: ["Ingress", "Egress"]
        ingress: []
        egress:
          - to:

              - ipBlock:
                  cidr: 172.20.0.10/32

            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - to:

              - ipBlock:
                  cidr: 172.20.0.1/32

            ports:
              - protocol: TCP
                port: 443
          - to:
              - domainNames:
                  - vibemon.io
            ports:
              - protocol: TCP
                port: 443
