alloy:
  fullnameOverride: alloy


  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"

          // Node-local discovery only: every daemon watches its own node
          // instead of the whole cluster.
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex         = "(.+)"
            target_label  = "app"
          }

          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.cri {}

          // One label value per log file otherwise.
          stage.label_drop {
            values = ["filename"]
          }

          forward_to = [loki.write.default.receiver]
        }


        // Auto Mode node agents are host processes, absent from Pod log discovery.
        local.file_match "aws_cni" {
          path_targets = [
            {"__path__" = "/var/log/aws-routed-eni/network-policy-agent.log", "job" = "kube-system/aws-network-policy-agent", "namespace" = "kube-system", "node" = sys.env("NODE_NAME")},
            {"__path__" = "/var/log/aws-routed-eni/ebpf-sdk.log", "job" = "kube-system/aws-ebpf-sdk", "namespace" = "kube-system", "node" = sys.env("NODE_NAME")},
          ]
        }

        loki.source.file "aws_cni" {
          targets    = local.file_match.aws_cni.targets
          forward_to = [loki.process.aws_cni.receiver]
        }

        loki.process "aws_cni" {
          // Debug conntrack events are high-volume; keep failures, including SDK errors at info level.
          stage.match {
            selector = "{namespace=\"kube-system\"} !~ \"(?i)error|failed\""
            action   = "drop"
          }
          stage.json {
            expressions = {"timestamp" = "ts"}
          }
          stage.timestamp {
            source = "timestamp"
            format = "RFC3339Nano"
          }
          stage.label_drop {
            values = ["filename"]
          }
          forward_to = [loki.write.default.receiver]
        }


        loki.write "default" {
          endpoint {
            url = "http://loki.demo-in.opspresso.com/loki/api/v1/push"
          }

          external_labels = {
            cluster = "eks-demo-b",
          }
        }

  rbac:
    # The chart concatenates both lists; an empty list breaks its ClusterRole YAML.
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get"]
    clusterRules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["list", "watch"]