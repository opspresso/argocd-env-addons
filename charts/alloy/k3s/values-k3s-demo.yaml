alloy:
  fullnameOverride: alloy


  alloy:
    configMap:
      content: |

        discovery.kubernetes "pods" {
          role = "pod"

          // Node-local discovery only: every daemon watches its own node
          // instead of the whole cluster.
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex         = "(.+)"
            target_label  = "app"
          }

          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.cri {}

          // One label value per log file otherwise.
          stage.label_drop {
            values = ["filename"]
          }

          forward_to = [loki.write.default.receiver]
        }



        loki.write "default" {
          endpoint {
            url = "http://loki.addon-loki.svc.cluster.local:3100/loki/api/v1/push"
          }

          external_labels = {
            cluster = "k3s-demo",
          }
        }


        // Cluster metrics are scraped by Prometheus; forward only application metrics.
        prometheus.remote_write "local" {
          external_labels = { "cluster" = "k3s-demo" }
          endpoint {
            url = "http://prometheus-prometheus.addon-prometheus.svc.cluster.local:9090/api/v1/write"
            write_relabel_config {
              source_labels = ["job"]
              regex = "agent-(studio|memory|knowledge|forge)"
              action = "keep"
            }
          }
        }

        prometheus.remote_write "grafana_cloud" {
          external_labels = { "cluster" = "k3s-demo" }

          endpoint {
            url = "https://prometheus-us-central1.grafana.net/api/prom/push"
            basic_auth {
              username = "2124611"
              password = sys.env("GCLOUD_RW_API_KEY")
            }

            // Apply the same policy to any samples replayed from the existing WAL.
            write_relabel_config {
              source_labels = ["job", "__name__"]
              regex = "integrations/node_exporter;.+|agent-studio;.+|agent-memory;.+|agent-knowledge;.+|agent-forge;.+|workspace-state;(up|kube_(pod_status_phase|pod_container_status_last_terminated_reason|resourcequota|node_labels|node_status_condition|deployment_status_replicas_available|deployment_spec_replicas))|kubelet;(up|kubelet_(node_name|running_pods|running_containers|volume_stats_.+|runtime_operations_(total|errors_total)))|integrations/cadvisor;(up|container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes|fs_reads_bytes_total|fs_writes_bytes_total|oom_events_total))"
              action = "keep"
            }


          }
        }

        // Filter before remote_write: discarded series must not enter its WAL or caches.
        prometheus.relabel "retained_metrics" {
          forward_to = [prometheus.remote_write.grafana_cloud.receiver, prometheus.remote_write.local.receiver]
          rule {
            source_labels = ["job", "__name__"]
            regex = "integrations/node_exporter;.+|agent-studio;.+|agent-memory;.+|agent-knowledge;.+|agent-forge;.+|workspace-state;(up|kube_(pod_status_phase|pod_container_status_last_terminated_reason|resourcequota|node_labels|node_status_condition|deployment_status_replicas_available|deployment_spec_replicas))|kubelet;(up|kubelet_(node_name|running_pods|running_containers|volume_stats_.+|runtime_operations_(total|errors_total)))|integrations/cadvisor;(up|container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes|fs_reads_bytes_total|fs_writes_bytes_total|oom_events_total))"
            action = "keep"
          }
        }

        prometheus.exporter.unix "node" {
          procfs_path    = "/host/proc"
          rootfs_path    = "/host/root"
          sysfs_path     = "/host/sys"
          udev_data_path = "/host/root/run/udev/data"

          filesystem {
            mount_points_exclude = "^/(dev|proc|sys|run/credentials/.+|var/lib/kubelet/.+|var/lib/rancher/k3s/.+)($|/)"
            mount_timeout        = "5s"
          }
        }

        discovery.relabel "node" {
          targets = prometheus.exporter.unix.node.targets
          rule {
            target_label = "instance"
            replacement  = sys.env("GCLOUD_FM_COLLECTOR_ID")
          }
          rule {
            target_label = "job"
            replacement  = "integrations/node_exporter"
          }
        }

        prometheus.scrape "node" {
          targets         = discovery.relabel.node.output
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.node.receiver]
        }

        prometheus.relabel "node" {
          forward_to = [prometheus.relabel.retained_metrics.receiver]
          rule {
            source_labels = ["__name__"]
            regex         = "node_scrape_collector_.+"
            action        = "drop"
          }
        }

        prometheus.scrape "kubelet" {
          targets = [{
            "__address__"      = "kubernetes.default.svc:443",
            "__metrics_path__" = "/api/v1/nodes/" + sys.env("NODE_NAME") + "/proxy/metrics",
            "instance"         = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          tls_config {
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }
          job_name        = "kubelet"
          scrape_interval = "30s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        // Use the API server's verified TLS endpoint to reach this node's kubelet.
        prometheus.scrape "cadvisor" {
          targets = [{
            "__address__"      = "kubernetes.default.svc:443",
            "__metrics_path__" = "/api/v1/nodes/" + sys.env("NODE_NAME") + "/proxy/metrics/cadvisor",
            "instance"         = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          tls_config {
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }
          job_name        = "integrations/cadvisor"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.cadvisor.receiver]
        }

        prometheus.relabel "cadvisor" {
          forward_to = [prometheus.relabel.retained_metrics.receiver]
          rule {
            source_labels = ["namespace"]
            regex         = ""
            action        = "drop"
          }
          // Keep pod network metrics, including the sandbox, under the workload name.
          rule {
            source_labels = ["container"]
            target_label  = "service"
          }
          rule {
            source_labels = ["pod"]
            regex         = "(.+)-[a-z0-9]+-[a-z0-9]+"
            target_label  = "service"
            replacement   = "$1"
          }
          rule {
            source_labels = ["pod"]
            regex         = "(.+)-[0-9]+"
            target_label  = "service"
            replacement   = "$1"
          }
          // Node-level cAdvisor samples have no Pod discovery labels.
          rule {
            source_labels = ["namespace", "pod"]
            separator     = ";"
            regex         = "agent-forge-workspaces;forge-ws-[a-f0-9]{40}-[a-z0-9]{5}"
            target_label  = "service"
            replacement   = "agent-forge-sandbox"
          }
        }

        prometheus.scrape "workspace_state" {
          targets = [{ "__address__" = "workspace-metrics.addon-workspace-metrics.svc.cluster.local:8080" }]
          job_name        = "workspace-state"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        prometheus.scrape "agent_studio" {
          targets = [{
            "__address__" = "agent-studio.agent-studio.svc:3000",
            "namespace"   = "agent-studio",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          metrics_path    = "/api/metrics"
          bearer_token    = sys.env("AGENT_STUDIO_METRICS_BEARER_TOKEN")
          job_name        = "agent-studio"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        prometheus.scrape "agent_memory" {
          targets = [{
            "__address__" = "agent-memory.agent-memory.svc:3000",
            "namespace"   = "agent-memory",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          metrics_path    = "/api/metrics"
          bearer_token    = sys.env("AGENT_MEMORY_METRICS_BEARER_TOKEN")
          job_name        = "agent-memory"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        prometheus.scrape "agent_knowledge" {
          targets = [{
            "__address__" = "agent-knowledge.agent-knowledge.svc:3000",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
            "namespace"   = "agent-knowledge",
            "component"   = "web",
          }, {
            "__address__" = "agent-knowledge-worker.agent-knowledge.svc:3000",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
            "namespace"   = "agent-knowledge",
            "component"   = "worker",
          }]
          metrics_path    = "/api/metrics"
          bearer_token    = sys.env("AGENT_KNOWLEDGE_METRICS_BEARER_TOKEN")
          job_name        = "agent-knowledge"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        prometheus.scrape "agent_forge" {
          targets = [{
            "__address__" = "agent-forge.agent-forge.svc:3103",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
            "namespace"   = "agent-forge",
          }]
          metrics_path    = "/metrics"
          bearer_token    = sys.env("AGENT_FORGE_METRICS_BEARER_TOKEN")
          job_name        = "agent-forge"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

    extraEnv:
      - name: GCLOUD_FM_COLLECTOR_ID
        value: "k3s-demo"
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    envFrom:
      - secretRef:
          name: alloy-grafana-cloud
    mounts:
      varlog: True
      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
        - name: host-root
          mountPath: /host/root
          readOnly: true
          mountPropagation: HostToContainer

    resources: null


  rbac:
    rules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get"]
    clusterRules:
      - apiGroups: [""]
        resources: ["nodes/proxy"]
        verbs: ["get"]

      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]



  configReloader:
    resources: null


  controller:
    type: daemonset
    priorityClassName: null
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

    volumes:
      extra:
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-root
          hostPath:
            path: /


raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: alloy-grafana-cloud
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: alloy-grafana-cloud
          creationPolicy: Owner
        data:
          - secretKey: GCLOUD_RW_API_KEY
            remoteRef:
              key: /k8s/common/grafana-cloud/remote-write-api-key
          - secretKey: AGENT_STUDIO_METRICS_BEARER_TOKEN
            remoteRef:
              key: /k8s/k3s-demo/agent-studio/metrics-bearer-token
          - secretKey: AGENT_MEMORY_METRICS_BEARER_TOKEN
            remoteRef:
              key: /k8s/k3s-demo/agent-memory/metrics-bearer-token
          - secretKey: AGENT_KNOWLEDGE_METRICS_BEARER_TOKEN
            remoteRef:
              key: /k8s/k3s-demo/agent-knowledge/metrics-bearer-token
          - secretKey: AGENT_FORGE_METRICS_BEARER_TOKEN
            remoteRef:
              key: /k8s/k3s-demo/agent-forge/metrics-bearer-token