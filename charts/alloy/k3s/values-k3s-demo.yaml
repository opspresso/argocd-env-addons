alloy:
  fullnameOverride: alloy


  alloy:
    configMap:
      content: |
        prometheus.remote_write "grafana_cloud" {
          external_labels = { "cluster" = "k3s-demo" }

          endpoint {
            url = "https://prometheus-us-central1.grafana.net/api/prom/push"
            basic_auth {
              username = "2124611"
              password = sys.env("GCLOUD_RW_API_KEY")
            }

            // Apply the same policy to any samples replayed from the existing WAL.
            write_relabel_config {
              source_labels = ["job", "__name__"]
              regex = "integrations/node_exporter;.+|agent-studio;.+|agent-memory;.+|workspace-state;(up|kube_(pod_status_phase|pod_container_status_last_terminated_reason|resourcequota|node_labels|node_status_condition|deployment_status_replicas_available|deployment_spec_replicas))|kubelet;(up|kubelet_(node_name|running_pods|running_containers|volume_stats_.+|runtime_operations_(total|errors_total)))|integrations/cadvisor;(up|container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes|fs_reads_bytes_total|fs_writes_bytes_total|oom_events_total))"
              action = "keep"
            }


          }
        }

        // Filter before remote_write: discarded series must not enter its WAL or caches.
        prometheus.relabel "retained_metrics" {
          forward_to = [prometheus.remote_write.grafana_cloud.receiver]
          rule {
            source_labels = ["job", "__name__"]
            regex = "integrations/node_exporter;.+|agent-studio;.+|agent-memory;.+|workspace-state;(up|kube_(pod_status_phase|pod_container_status_last_terminated_reason|resourcequota|node_labels|node_status_condition|deployment_status_replicas_available|deployment_spec_replicas))|kubelet;(up|kubelet_(node_name|running_pods|running_containers|volume_stats_.+|runtime_operations_(total|errors_total)))|integrations/cadvisor;(up|container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes|fs_reads_bytes_total|fs_writes_bytes_total|oom_events_total))"
            action = "keep"
          }
        }

        prometheus.exporter.unix "node" {
          procfs_path    = "/host/proc"
          rootfs_path    = "/host/root"
          sysfs_path     = "/host/sys"
          udev_data_path = "/host/root/run/udev/data"

          filesystem {
            mount_points_exclude = "^/(dev|proc|sys|run/credentials/.+|var/lib/kubelet/.+|var/lib/rancher/k3s/.+)($|/)"
            mount_timeout        = "5s"
          }
        }

        discovery.relabel "node" {
          targets = prometheus.exporter.unix.node.targets
          rule {
            target_label = "instance"
            replacement  = sys.env("GCLOUD_FM_COLLECTOR_ID")
          }
          rule {
            target_label = "job"
            replacement  = "integrations/node_exporter"
          }
        }

        prometheus.scrape "node" {
          targets         = discovery.relabel.node.output
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.node.receiver]
        }

        prometheus.relabel "node" {
          forward_to = [prometheus.relabel.retained_metrics.receiver]
          rule {
            source_labels = ["__name__"]
            regex         = "node_scrape_collector_.+"
            action        = "drop"
          }
        }

        prometheus.scrape "kubelet" {
          targets = [{
            "__address__"      = "kubernetes.default.svc:443",
            "__metrics_path__" = "/api/v1/nodes/" + sys.env("NODE_NAME") + "/proxy/metrics",
            "instance"         = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          tls_config {
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }
          job_name        = "kubelet"
          scrape_interval = "30s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        // Use the API server's verified TLS endpoint to reach this node's kubelet.
        prometheus.scrape "cadvisor" {
          targets = [{
            "__address__"      = "kubernetes.default.svc:443",
            "__metrics_path__" = "/api/v1/nodes/" + sys.env("NODE_NAME") + "/proxy/metrics/cadvisor",
            "instance"         = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          scheme            = "https"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          tls_config {
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }
          job_name        = "integrations/cadvisor"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.cadvisor.receiver]
        }

        prometheus.relabel "cadvisor" {
          forward_to = [prometheus.relabel.retained_metrics.receiver]
          rule {
            source_labels = ["namespace"]
            regex         = ""
            action        = "drop"
          }
          // Keep pod network metrics, including the sandbox, under the workload name.
          rule {
            source_labels = ["container"]
            target_label  = "service"
          }
          rule {
            source_labels = ["pod"]
            regex         = "(.+)-[a-z0-9]+-[a-z0-9]+"
            target_label  = "service"
            replacement   = "$1"
          }
          rule {
            source_labels = ["pod"]
            regex         = "(.+)-[0-9]+"
            target_label  = "service"
            replacement   = "$1"
          }
          rule {
            source_labels = ["pod"]
            regex         = "studio-ws-[a-f0-9]{40}"
            target_label  = "service"
            replacement   = "agent-studio-sandbox"
          }
        }

        prometheus.scrape "workspace_state" {
          targets = [{ "__address__" = "workspace-metrics.addon-workspace-metrics.svc.cluster.local:8080" }]
          job_name        = "workspace-state"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        prometheus.scrape "agent_studio" {
          targets = [{
            "__address__" = "agent-studio.agent-studio.svc:80",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          metrics_path    = "/api/metrics"
          job_name        = "agent-studio"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

        prometheus.scrape "agent_memory" {
          targets = [{
            "__address__" = "agent-memory.agent-memory.svc:80",
            "instance"    = sys.env("GCLOUD_FM_COLLECTOR_ID"),
          }]
          metrics_path    = "/api/metrics"
          bearer_token    = sys.env("AGENT_MEMORY_METRICS_BEARER_TOKEN")
          job_name        = "agent-memory"
          scrape_interval = "15s"
          forward_to      = [prometheus.relabel.retained_metrics.receiver]
        }

    extraEnv:
      - name: GCLOUD_FM_COLLECTOR_ID
        value: "k3s-demo"
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    envFrom:
      - secretRef:
          name: alloy-grafana-cloud
    mounts:
      varlog: false
      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
        - name: host-root
          mountPath: /host/root
          readOnly: true
          mountPropagation: HostToContainer

    resources: null


  rbac:
    rules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get"]
    clusterRules:
      - apiGroups: [""]
        resources: ["nodes/proxy"]
        verbs: ["get"]


  configReloader:
    resources: null


  controller:
    type: daemonset
    priorityClassName: null
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

    volumes:
      extra:
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-root
          hostPath:
            path: /


raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: alloy-grafana-cloud
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: alloy-grafana-cloud
          creationPolicy: Owner
        data:
          - secretKey: GCLOUD_RW_API_KEY
            remoteRef:
              key: /k8s/common/grafana-cloud/remote-write-api-key
          - secretKey: AGENT_MEMORY_METRICS_BEARER_TOKEN
            remoteRef:
              key: /k8s/k3s-demo/agent-memory/metrics-bearer-token

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vibemon-collector
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: vibemon-collector-k3s-demo
      rules:
        - apiGroups: [""]
          resources: ["nodes", "pods"]
          verbs: ["list"]
        - apiGroups: ["metrics.k8s.io"]
          resources: ["nodes"]
          verbs: ["get", "list"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: vibemon-collector-k3s-demo
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: vibemon-collector-k3s-demo
      subjects:
        - kind: ServiceAccount
          name: vibemon-collector
          namespace: addon-alloy
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: vibemon-collector
      spec:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: vibemon-collector
          creationPolicy: Owner
        data:
          - secretKey: VIBEMON_WRITE_TOKEN
            remoteRef:
              key: /k8s/k3s-demo/vibemon/write-token
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vibemon-collector
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app.kubernetes.io/name: vibemon-collector
        template:
          metadata:
            labels:
              app.kubernetes.io/name: vibemon-collector
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            serviceAccountName: vibemon-collector
            nodeSelector:
              kubernetes.io/os: linux
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: collector
                image: public.ecr.aws/z5d8x0d6/vibemon-collector@sha256:8a789311267207fdd9c47e0c19c9e31fd61884fd42dbf509e75fe45b3936829e
                args:
                  - --source-id
                  - k3s-demo
                  - --name
                  - "AWS EC2 k3s"
                  - --kind
                  - cluster
                  - --cluster-backend
                  - metrics-api
                  - --kubectl-command
                  - kubectl --cache-dir=/tmp/kubectl
                  - --url
                  - https://vibemon.io
                  - --health-file
                  - /tmp/vibemon-health
                env:
                  - name: VIBEMON_WRITE_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: vibemon-collector
                        key: VIBEMON_WRITE_TOKEN
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]

                readinessProbe:
                  exec:
                    command: ["python", "-m", "vibemon_collector.health", "/tmp/vibemon-health"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 1
                volumeMounts:
                  - name: temporary
                    mountPath: /tmp
            volumes:
              - name: temporary
                emptyDir:
                  sizeLimit: 32Mi
