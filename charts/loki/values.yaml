loki:
  fullnameOverride: loki

  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

    limits_config:
      retention_period: 744h

  singleBinary:
    replicas: 1

    persistence:
      enabled: true
      size: 50Gi
      storageClass: gp3 # aws-ebs-sc
      # The chart default deletes the claim when the StatefulSet scales to zero. That
      # detaches the log store from its volume during any maintenance stop.
      enableStatefulSetAutoDeletePVC: false

    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        memory: 1Gi

  # Rules sidecar in the loki pod; unset it and the whole pod drops to
  # BestEffort no matter what singleBinary asks for. The limit has room to
  # spare - this is a python process, and it OOMKilled in four seconds at 64Mi.
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 96Mi
      limits:
        memory: 256Mi

  read:
    replicas: 0

  write:
    replicas: 0

  backend:
    replicas: 0

  gateway:
    enabled: false

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  lokiCanary:
    enabled: false

  test:
    enabled: false
