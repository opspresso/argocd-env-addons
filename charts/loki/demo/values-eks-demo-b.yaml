loki:
  fullnameOverride: loki

  # The chart labels its own metrics cluster=<release>, which lands as
  # cluster="loki" and puts this one job outside every cluster filter.
  clusterLabelOverride: eks-demo-b

  monitoring:
    serviceMonitor:
      enabled: True
      labels:
        release: prometheus-eks-demo-b



raw:
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: loki
      spec:
        parentRefs:
          - name: istio-ingressgateway
            namespace: istio-system
        hostnames:
          - "loki.demo-in.opspresso.com"
        rules:
          - backendRefs:
              - name: loki
                port: 3100