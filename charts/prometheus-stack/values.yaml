kube-prometheus-stack:
  fullnameOverride: prometheus

  # Grafana owns alert delivery to Slack. Alertmanager is disabled by default; the
  # template enables it where Keep runs, and it sends only to Keep.
  defaultRules:
    disabled:
      PrometheusNotConnectedToAlertmanagers: true
      # Replaced below: the Workspace namespace grows against its bounded NodePool.
      KubeCPUQuotaOvercommit: true
      KubeMemoryQuotaOvercommit: true

  additionalPrometheusRulesMap:
    nonelastic-quota-capacity:
      groups:
        - name: nonelastic-quota-capacity
          rules:
            - alert: KubeCPUQuotaOvercommit
              expr: sum by (cluster) (min without(resource) (kube_resourcequota{job="kube-state-metrics",type="hard",resource=~"(cpu|requests.cpu)",namespace!="agent-forge-workspaces"})) / sum by (cluster) (kube_node_status_allocatable{resource="cpu",job="kube-state-metrics"}) > 1.5
              for: 5m
              labels: {severity: warning}
              annotations:
                summary: Non-elastic namespace CPU quotas exceed current cluster capacity.
            - alert: KubeMemoryQuotaOvercommit
              expr: sum by (cluster) (min without(resource) (kube_resourcequota{job="kube-state-metrics",type="hard",resource=~"(memory|requests.memory)",namespace!="agent-forge-workspaces"})) / sum by (cluster) (kube_node_status_allocatable{resource="memory",job="kube-state-metrics"}) > 1.5
              for: 5m
              labels: {severity: warning}
              annotations:
                summary: Non-elastic namespace memory quotas exceed current cluster capacity.

  prometheusOperator:
    admissionWebhooks:
      patch:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # Runs as a sidecar in the prometheus and alertmanager pods, and a pod is
    # only as good as its least specified container.
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

  prometheus:
    enabled: true

    prometheusSpec:
      # Time-based retention alone lets a burst in ingestion fill the volume and
      # take Prometheus down; the size cap leaves headroom for the WAL and for
      # compaction, which needs room for both the old and new block.
      retention: 10d
      retentionSize: 60GiB

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3 # aws-ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 80Gi

      # Working set holds near 1.2Gi with 1.3Gi peaks; CPU peaks near 100m.
      resources:
        requests:
          cpu: 100m
          memory: 1536Mi
        limits:
          memory: 3Gi

  alertmanager:
    enabled: false

    # Keep (charts/keep) reads the Alertmanager webhook at /alerts/event/prometheus
    # and takes its API key as the basic auth password. send_resolved closes the
    # alert in Keep; pulling from Prometheus cannot, because it sees only firing alerts.
    config:
      route:
        receiver: "keep"
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog fires continuously by design - it is the dead man's switch
          # that proves the alert path is alive. Forwarding it would keep one
          # alert open in Keep forever, so it is swallowed here.
          - matchers:
              - alertname = Watchdog
            receiver: "null"

      receivers:
        - name: "null"
        - name: "keep"
          webhook_configs:
            - url: http://keep-backend.addon-keep.svc.cluster.local:8080/alerts/event/prometheus
              send_resolved: true
              http_config:
                basic_auth:
                  username: alertmanager
                  password_file: /etc/alertmanager/secrets/prometheus-alertmanager-secret/keep-api-key

    alertmanagerSpec:
      secrets:
        - prometheus-alertmanager-secret

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3 # aws-ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              # Only silences and the notification log live here, which stay in
              # the tens of megabytes.
              requests:
                storage: 5Gi

      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi

  kube-state-metrics:
    fullnameOverride: kube-state-metrics

    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # https://github.com/kubernetes/kube-state-metrics/tree/main/docs
    extraArgs:
      - --metric-labels-allowlist=nodes=[*],namespaces=[*],deployments=[*],pods=[*],services=[*],statefulsets=[*],daemonsets=[*]

  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter

    # Host memory/PSI include kernel allocations absent from pod working sets.
    # Keep collection frequent enough to see a short node stall before restart.
    prometheus:
      monitor:
        interval: 15s
        scrapeTimeout: 10s
        relabelings:
          - action: replace
            sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node

    # Same reasoning as alloy: a node agent that loses the last slot on a full
    # node leaves that node unmonitored, which is when you most want the data.
    priorityClassName: system-node-critical

    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi

  # AWS runs these on the managed control plane, so their Services resolve to no
  # endpoints and the bundled rules report them permanently Down. Left on, they
  # post three critical alerts to slack every repeat_interval, forever.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  kubelet:
    serviceMonitor:
      interval: 15s
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
      cAdvisorRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
      probesRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path

  grafana:
    enabled: false

  kubeApiServer:
    serviceMonitor:
      # Keep API latency/SLO histograms and counters; omit unused detailed buckets.
      metricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds|storage_list_duration_seconds|watch_events_sizes)_bucket'
