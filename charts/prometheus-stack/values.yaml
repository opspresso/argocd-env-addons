kube-prometheus-stack:
  fullnameOverride: prometheus

  # Alertmanager is disabled by default; the template enables it where Keep
  # runs, and it sends only to Keep.
  #
  # Grafana rules (config/*-alerts.yaml) own node and workload symptoms: they
  # carry dashboard links, a first action and promtool tests. The bundled rules
  # below report the same symptoms under other names, so Keep would hold two
  # alerts for one problem. The bundled rules that stay watch the monitoring
  # stack itself, the API server and certificates, which Grafana does not cover.
  defaultRules:
    disabled:
      PrometheusNotConnectedToAlertmanagers: true
      # Same symptom as a Grafana rule (Grafana title in the comment).
      KubePodCrashLooping: true             # Container stuck in CrashLoopBackOff
      KubeContainerWaiting: true            # Workload container cannot start
      KubePodNotReady: true                 # Workload replicas below desired
      KubeDeploymentReplicasMismatch: true  # Workload replicas below desired
      KubeStatefulSetReplicasMismatch: true # Workload replicas below desired
      KubeJobFailed: true                   # Job failed
      KubeNodeNotReady: true                # Kubernetes node is not Ready
      KubeNodePressure: true                # Node under memory, PID or disk pressure
      NodeFilesystemAlmostOutOfSpace: true  # Node filesystem above 85% / 95% used
      NodeMemoryHighUtilization: true       # Host memory usage above 85% / 92%
      NodeCPUHighUsage: true                # Node CPU busy above 90%
      # EKS Auto Mode sizes the cluster to its requests, so requests or quotas
      # above current node capacity are the normal state, not a risk. The limit
      # that matters is the NodePool ceiling (nodepool-capacity below); a pod
      # that cannot fit raises "Pod unschedulable" in Grafana.
      KubeCPUOvercommit: true
      KubeMemoryOvercommit: true
      KubeCPUQuotaOvercommit: true
      KubeMemoryQuotaOvercommit: true
      # A full node is not a problem when Auto Mode adds the next one.
      KubeletTooManyPods: true

  additionalPrometheusRulesMap:
    nodepool-capacity:
      groups:
        - name: nodepool-capacity
          rules:
            # karpenter_nodepool_limit comes from the kube-state-metrics
            # custom resource config below. Karpenter counts node capacity,
            # not allocatable, and the number of nodes against the limit.
            # Pools without a limit have no series and never fire.
            - alert: NodePoolNearLimit
              expr: |
                100 * (
                  sum by (cluster, nodepool, resource) (
                    label_replace(
                      max by (cluster, node, resource) (kube_node_status_capacity{job="kube-state-metrics",resource=~"cpu|memory"})
                      * on (cluster, node) group_left(label_karpenter_sh_nodepool)
                      max by (cluster, node, label_karpenter_sh_nodepool) (kube_node_labels{job="kube-state-metrics"}),
                      "nodepool", "$1", "label_karpenter_sh_nodepool", "(.+)"))
                  or
                  label_replace(
                    count by (cluster, nodepool) (
                      label_replace(
                        max by (cluster, node, label_karpenter_sh_nodepool) (kube_node_labels{job="kube-state-metrics"}),
                        "nodepool", "$1", "label_karpenter_sh_nodepool", "(.+)")),
                    "resource", "nodes", "", "")
                ) / on (cluster, nodepool, resource) group_left()
                max by (cluster, nodepool, resource) (karpenter_nodepool_limit{resource=~"cpu|memory|nodes"}) > 90
              for: 15m
              labels: {severity: warning}
              annotations:
                summary: 'NodePool {{ $labels.nodepool }} uses {{ printf "%.0f" $value }}% of its {{ $labels.resource }} limit.'
                description: >-
                  Karpenter cannot add nodes to this pool past its limit, so new pods
                  that need it stay Pending. Raise the NodePool limit in
                  terraform-env-demo or reduce the pool's workload.

  prometheusOperator:
    admissionWebhooks:
      patch:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # Runs as a sidecar in the prometheus and alertmanager pods, and a pod is
    # only as good as its least specified container.
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

  prometheus:
    enabled: true

    prometheusSpec:
      # Time-based retention alone lets a burst in ingestion fill the volume and
      # take Prometheus down; the size cap leaves headroom for the WAL and for
      # compaction, which needs room for both the old and new block.
      retention: 10d
      retentionSize: 60GiB

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3 # aws-ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 80Gi

      # Working set p95 2.3Gi, peak 2.6Gi; CPU p95 330m, peak 390m (7 days to 2026-11-11).
      resources:
        requests:
          cpu: 400m
          memory: 2656Mi
        limits:
          memory: 4Gi

  alertmanager:
    enabled: false

    # Keep (charts/keep) reads the Alertmanager webhook at /alerts/event/prometheus
    # and takes its API key as the basic auth password. send_resolved closes the
    # alert in Keep; pulling from Prometheus cannot, because it sees only firing alerts.
    config:
      route:
        receiver: "keep"
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog fires continuously by design - it is the dead man's switch
          # that proves the alert path is alive. Forwarding it would keep one
          # alert open in Keep forever, so it is swallowed here.
          - matchers:
              - alertname = Watchdog
            receiver: "null"

      receivers:
        - name: "null"
        - name: "keep"
          webhook_configs:
            - url: http://keep-backend.addon-keep.svc.cluster.local:8080/alerts/event/prometheus
              send_resolved: true
              http_config:
                basic_auth:
                  username: alertmanager
                  password_file: /etc/alertmanager/secrets/prometheus-alertmanager-secret/keep-api-key

    alertmanagerSpec:
      secrets:
        - prometheus-alertmanager-secret

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3 # aws-ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              # Only silences and the notification log live here, which stay in
              # the tens of megabytes.
              requests:
                storage: 5Gi

      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi

  kube-state-metrics:
    fullnameOverride: kube-state-metrics

    # A rolling update scrapes the old and the new pod together for a while,
    # so every kube_* series exists twice and joins on node or pod fail with
    # "duplicate series" in rules and dashboards. Recreate leaves a gap of a
    # few seconds instead, which the alert `for` durations absorb.
    updateStrategy: Recreate

    # Working set p95 and peak 127Mi (7 days to 2026-11-11); the old 128Mi limit left no headroom.
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
      limits:
        memory: 256Mi

    # https://github.com/kubernetes/kube-state-metrics/tree/main/docs
    extraArgs:
      - --metric-labels-allowlist=nodes=[*],namespaces=[*],deployments=[*],pods=[*],services=[*],statefulsets=[*],daemonsets=[*]

    # NodePool limits for the nodepool-capacity rule: karpenter_nodepool_limit{nodepool,resource}.
    rbac:
      extraRules:
        - apiGroups: ["karpenter.sh"]
          resources: ["nodepools"]
          verbs: ["list", "watch"]
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind: {group: karpenter.sh, version: v1, kind: NodePool}
              metricNamePrefix: karpenter_nodepool
              labelsFromPath:
                nodepool: [metadata, name]
              metrics:
                - name: limit
                  help: NodePool resource limit (spec.limits).
                  each:
                    type: Gauge
                    gauge:
                      path: [spec, limits]
                      labelFromKey: resource

  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter

    # Host memory/PSI include kernel allocations absent from pod working sets.
    # Keep collection frequent enough to see a short node stall before restart.
    prometheus:
      monitor:
        interval: 15s
        scrapeTimeout: 10s
        relabelings:
          - action: replace
            sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node

    # Same reasoning as alloy: a node agent that loses the last slot on a full
    # node leaves that node unmonitored, which is when you most want the data.
    priorityClassName: system-node-critical

    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi

  # AWS runs these on the managed control plane, so their Services resolve to no
  # endpoints and the bundled rules report them permanently Down. Left on, they
  # post three critical alerts to slack every repeat_interval, forever.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  kubelet:
    serviceMonitor:
      interval: 15s
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
      cAdvisorRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
      probesRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path

  grafana:
    enabled: false

  kubeApiServer:
    serviceMonitor:
      # The API server is half of all series. Rules and dashboards read API
      # latency from apiserver_request_sli_duration_seconds_bucket and etcd
      # latency from the _sum/_count pair, so these histograms are unread.
      metricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds|storage_list_duration_seconds|watch_events_sizes|request_duration_seconds|watch_events_dispatch_duration_seconds|watch_cache_initialization_duration_seconds)_bucket|etcd_request_duration_seconds_bucket|kubernetes_feature_enabled'
