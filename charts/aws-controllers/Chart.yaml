apiVersion: v2
name: aws-controllers
description: AWS Controllers for Kubernetes (ACK). One controller per AWS service, each turned on by <service>.enabled
type: application
# The wrapper version follows rds-chart. scripts/update_charts.sh updates the other controllers' dependency
# lines only ("wrapper": false in config/versions.json); see README "ACK 컨트롤러 추가".
version: "1.15.1" # helm chart rds-chart version

dependencies:
- name: rds-chart
  alias: rds
  condition: rds.enabled
  repository: oci://public.ecr.aws/aws-controllers-k8s
  version: "1.15.1" # helm chart rds-chart version

- name: s3-chart
  alias: s3
  condition: s3.enabled
  repository: oci://public.ecr.aws/aws-controllers-k8s
  version: "1.16.0" # helm chart s3-chart version

- name: dynamodb-chart
  alias: dynamodb
  condition: dynamodb.enabled
  repository: oci://public.ecr.aws/aws-controllers-k8s
  version: "1.16.0" # helm chart dynamodb-chart version
