# One ACK controller per AWS service, each with its own ServiceAccount ack-<service>-controller and its own IAM role
# pod-role--ack-<service> (terraform-env-demo 4-role, Pod Identity in 5-eks). Permissions are never shared.
rds:
  # kro RdsPostgres instances (charts/kro) create DBInstance objects.
  enabled: true
  fullnameOverride: ack-rds-controller

  # EKS Pod Identity binds the IAM role pod-role--ack-rds to this ServiceAccount
  # (terraform-env-demo demo/5-eks), so the ServiceAccount has no IRSA annotation.
  serviceAccount:
    create: true
    name: ack-rds-controller

  # kro RdsPostgres instances create DBInstance only. The other RDS kinds stay
  # unreconciled, and the IAM policy allows DBInstance actions only.
  reconcile:
    resources:
      - DBInstance

  # installScope stays cluster: the namespace scope takes a fixed namespace list and cannot follow new app-*
  # namespaces. The upstream ClusterRole therefore reads Secrets in every namespace. Only kro creates DBInstance
  # objects, and the RdsPostgres template pins the password Secret to the instance namespace.
  installScope: cluster

  # One account, no cross-account role map (CARM) ConfigMaps.
  enableCARM: false

  # Deleting a DBInstance deletes the RDS instance. The DBInstance annotations
  # from the RdsPostgres template skip the final snapshot.
  deletionPolicy: delete

  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    # The chart's values schema requires a CPU limit.
    limits:
      cpu: 200m
      memory: 256Mi

s3:
  # kro S3Bucket instances (charts/kro) create Bucket objects.
  enabled: true
  fullnameOverride: ack-s3-controller

  # EKS Pod Identity binds the IAM role pod-role--ack-s3 to this ServiceAccount (terraform-env-demo demo/5-eks).
  serviceAccount:
    create: true
    name: ack-s3-controller

  reconcile:
    resources:
      - Bucket

  installScope: cluster
  enableCARM: false

  # Deleting a Bucket deletes the S3 bucket. S3 refuses to delete a bucket that still holds objects, so ACK keeps
  # retrying and the Bucket stays until the bucket is emptied; no object is deleted by the controller.
  deletionPolicy: delete

  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

dynamodb:
  # kro DynamoTable instances (charts/kro) create Table objects.
  enabled: true
  fullnameOverride: ack-dynamodb-controller

  # EKS Pod Identity binds the IAM role pod-role--ack-dynamodb to this ServiceAccount (terraform-env-demo demo/5-eks).
  serviceAccount:
    create: true
    name: ack-dynamodb-controller

  # The IAM policy allows this kind only.
  reconcile:
    resources:
      - Table

  installScope: cluster
  enableCARM: false

  # Deleting a Table deletes the DynamoDB table and its data.
  deletionPolicy: delete

  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi
