istiod:
  global:
    hub: "gcr.io/istio-release"

  replicaCount: 2

  autoscaleEnabled: False
  autoscaleMin: 2
  autoscaleMax: 6

gateway:
  replicaCount: 2

  autoscaling:
    enabled: False
    minReplicas: 2
    maxReplicas: 6

tgb:
  resources:
    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-public
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-http-0/070b8ed8937ffe4c"
        targetType: ip

    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-internal
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-0/723b1031f0f96bb6"
        targetType: ip