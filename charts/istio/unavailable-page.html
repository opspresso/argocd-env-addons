  let touched = false;
  addEventListener("pointermove", (e) => {
    view.tx = (e.clientX - w / 2) * -0.12;
    view.ty = (e.clientY - h / 2) * -0.12;
  });
  const interactive = (el) => el.closest("button, select, summary, details, a, dl");
  function startThrust(e) {
    if (e && interactive(e.target)) return;
    if (holding || state === "recovered") return;
    holding = performance.now();
    if (!touched) { touched = true; $("hint").classList.add("done"); }
    setCourse();
  }
  function stopThrust() {
    holding = 0;
    setCourse();
  }
  addEventListener("pointerdown", startThrust);
  addEventListener("pointerup", stopThrust);
  addEventListener("pointercancel", stopThrust);
  addEventListener("blur", stopThrust);
  addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat || interactive(document.activeElement || document.body)) return;
    e.preventDefault();
    startThrust();
  });
  addEventListener("keyup", (e) => { if (e.code === "Space") stopThrust(); });

  // Recovery polling ----------------------------------------------------
  const DELAYS = [5, 10, 15, 20, 30];
  let lang = pickLang();
  let t = I18N[lang];
  let state = "waiting";
  let attempt = 0;
  let missed = false;
  let deadline = 0;

  function setLive(text) {
    const live = $("live");
    if (live.textContent !== text) live.textContent = text;
  }
  function render() {
    document.body.dataset.state = state;
    $("retry").disabled = state === "checking" || state === "recovered";
    let line;
    if (state === "checking") line = t.checking;
    else if (state === "recovered") line = t.recovered;
    else if (state === "offline") line = t.offline;
    else {
      const next = t.next.replace("{s}", Math.max(1, Math.ceil((deadline - Date.now()) / 1000)));
      line = missed ? t.notYet + " " + next : next;
    }
    $("status").textContent = line;
    setLive(state === "waiting" ? (missed ? t.notYet : "") : line);
    setCourse();
  }
  function schedule() {
    deadline = Date.now() + DELAYS[Math.min(attempt, DELAYS.length - 1)] * 1000;
    state = navigator.onLine === false ? "offline" : "waiting";
    render();
  }
  async function probe() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    try {
      const res = await fetch(location.href, {
        cache: "no-store",
        credentials: "same-origin",
        redirect: "manual",
        headers: { accept: "text/html" },
        signal: ctrl.signal
      });
      // Any answer other than a gateway failure means the service is back,
      // including a redirect to sign in.
      return !(res.status >= 502 && res.status <= 504);
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }
  function arrive() {
    const flash = $("flash");
    if (reduce.matches) { location.replace(location.href); return; }
    flash.style.setProperty("--fx", (w / 2 + view.x) + "px");
    flash.style.setProperty("--fy", (h / 2 + view.y) + "px");
    flash.animate([{ opacity: 0 }, { opacity: 0 }, { opacity: 1 }], { duration: 1300, easing: "cubic-bezier(0.6, 0, 0.9, 0.4)", fill: "forwards" })
      .finished.then(() => location.replace(location.href));
  }
  async function check() {
    if (state === "checking" || state === "recovered") return;
    if (navigator.onLine === false) { state = "offline"; render(); return; }
    state = "checking";
    render();
    const started = performance.now();
    const ok = await probe();
    // Hold the jump long enough to be felt.
    const wait = Math.max(0, (reduce.matches ? 400 : 2200) - (performance.now() - started));
    setTimeout(() => {
      if (ok) {
        state = "recovered";
        render();
        arrive();
      } else {
        missed = true;
        attempt += 1;
        schedule();
      }
    }, wait);
  }
  setInterval(() => {
    if (state !== "waiting" || document.hidden) return;
    if (Date.now() >= deadline) check();
    else render();
  }, 250);
  addEventListener("online", () => { if (state === "offline") check(); });
  addEventListener("offline", () => { if (state === "waiting") { state = "offline"; render(); } });
  $("retry").addEventListener("click", check);

  // Text ----------------------------------------------------------------
  function applyLang(next) {
    lang = next;
    t = I18N[lang];
    root.lang = lang;
    document.title = t.title;
    useDisplay(lang);
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t[el.dataset.i18n];
    $("lang").value = lang;
    render();
  }
  const select = $("lang");
  for (const key of Object.keys(I18N)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = I18N[key].name;
    select.appendChild(opt);
  }
  select.addEventListener("change", () => {
    try { localStorage.setItem(LANG_KEY, select.value); } catch (e) {}
    applyLang(select.value);
  });

  $("host").textContent = location.host;
  $("code").textContent = detail ? code + " (" + detail + ")" : code;
  if (requestId) $("request").textContent = requestId;
  else for (const el of document.querySelectorAll(".request-row")) el.hidden = true;
  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(requestId);
      $("copy").textContent = t.copied;
      setTimeout(() => { $("copy").textContent = t.copy; }, 2000);
    } catch (e) {
      getSelection().selectAllChildren($("request"));
    }
  });

  addEventListener("resize", resize);
  reduce.addEventListener("change", resize);
  resize();
  applyLang(lang);
  schedule();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
