istiod:
  revisionTags: ["default"]

  # Images come from the chart default hub (docker.io/istio); Istio 1.31
  # stopped publishing to gcr.io/istio-release.
  global:
    # Sidecars cannot start without istiod, so it outranks the workloads.
    priorityClassName: system-cluster-critical

    proxy:
      startupProbe:
        enabled: true

      lifecycle:
        postStart:
          exec:
            command:
              - pilot-agent
              - wait

      # Every meshed pod carries one; Envoy idles near 40Mi.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

  env:
    EXCLUDE_UNSAFE_503_FROM_DEFAULT_RETRY: "false"
    ENABLE_100_CONTINUE_HEADERS: "false"

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

  trafficDistribution: PreferSameZone

  # Spread by host only. The baseline nodes and every EBS volume sit in one
  # zone, so a zone preference made Auto Mode keep an extra node in another
  # zone without adding real zone redundancy.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app: istiod

  meshConfig:
    defaultConfig:
      proxyMetadata:
        EXIT_ON_ZERO_ACTIVE_CONNECTIONS: "true"
        MINIMUM_DRAIN_DURATION: "10s"
      gatewayTopology:
        numTrustedProxies: 1
      holdApplicationUntilProxyStarts: true
      terminationDrainDuration: 30s
      # Sidecars report only a subset of Envoy stats by default. Expose retry
      # budget rejections (upstream_rq_retry_overflow) so defaultHttpRetryPolicy
      # exhaustion is observable.
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*upstream_rq_retry_overflow.*"
    enableTracing: false
    rootNamespace: istio-system
    dnsRefreshRate: 300s
    defaultHttpRetryPolicy:
      attempts: 2
      retryOn: connect-failure,refused-stream,unavailable,cancelled,503
    # localityLbSetting:
    #   enabled: true

    extensionProviders:
      - name: oauth2-proxy
        envoyExtAuthzHttp:
          service: "oauth2-proxy.addon-oauth2-proxy.svc.cluster.local"
          port: "80"
          headersToDownstreamOnDeny:
            - content-type
            - set-cookie
          headersToUpstreamOnAllow:
            - authorization
            - cookie
            - path
            - x-auth-request-access-token
            - x-auth-request-user
            - x-auth-request-email
            - x-forwarded-access-token
          includeHeadersInCheck:
            - cookie
            - x-forwarded-access-token
            # - x-forwarded-user
            # - x-forwarded-email
          includeAdditionalHeadersInCheck:
            authorization: "%REQ(x-auth-request-access-token)%"

gateway:
  name: istio-ingressgateway

  # Every request into the cluster passes through these pods.
  priorityClassName: system-cluster-critical
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 512Mi

  # Both replicas carry all cluster ingress, and Auto Mode recycles nodes on its
  # own schedule. Without this a consolidation can drain them together.
  podDisruptionBudget:
    minAvailable: 1

  service:
    type: ClusterIP

    # externalTrafficPolicy: Local

  # Spread by host only. The baseline nodes and every EBS volume sit in one
  # zone, so a zone preference made Auto Mode keep an extra node in another
  # zone without adding real zone redundancy.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app: istio-ingressgateway
