istiod:
  revisionTags: ["default"]

  global:
    hub: gcr.io/istio-release

    proxy:
      startupProbe:
        enabled: true

      lifecycle:
        postStart:
          exec:
            command:
              - pilot-agent
              - wait

      resources:
        requests:
          cpu: 100m
          memory: 128Mi

  env:
    EXCLUDE_UNSAFE_503_FROM_DEFAULT_RETRY: "false"
    ENABLE_100_CONTINUE_HEADERS: "false"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  trafficDistribution: PreferSameZone

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app: istiod
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app: istiod

  meshConfig:
    defaultConfig:
      proxyMetadata:
        EXIT_ON_ZERO_ACTIVE_CONNECTIONS: "true"
        MINIMUM_DRAIN_DURATION: "10s"
      gatewayTopology:
        numTrustedProxies: 1
      holdApplicationUntilProxyStarts: true
      terminationDrainDuration: 30s
      # Sidecars report only a subset of Envoy stats by default. Expose retry
      # budget rejections (upstream_rq_retry_overflow) so defaultHttpRetryPolicy
      # exhaustion is observable.
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*upstream_rq_retry_overflow.*"
    enableTracing: false
    rootNamespace: istio-system
    dnsRefreshRate: 300s
    defaultHttpRetryPolicy:
      attempts: 2
      retryOn: connect-failure,refused-stream,unavailable,cancelled,503
    # localityLbSetting:
    #   enabled: true

    extensionProviders:
      - name: oauth2-proxy
        envoyExtAuthzHttp:
          service: "oauth2-proxy.addon-oauth2-proxy.svc.cluster.local"
          port: "80"
          headersToDownstreamOnDeny:
            - content-type
            - set-cookie
          headersToUpstreamOnAllow:
            - authorization
            - cookie
            - path
            - x-auth-request-access-token
            - x-auth-request-user
            - x-auth-request-email
            - x-forwarded-access-token
          includeHeadersInCheck:
            - cookie
            - x-forwarded-access-token
            # - x-forwarded-user
            # - x-forwarded-email
          includeAdditionalHeadersInCheck:
            authorization: "%REQ(x-auth-request-access-token)%"

gateway:
  name: istio-ingressgateway

  # Both replicas carry all cluster ingress, and Auto Mode recycles nodes on its
  # own schedule. Without this a consolidation can drain them together.
  podDisruptionBudget:
    minAvailable: 1

  service:
    type: ClusterIP

    # externalTrafficPolicy: Local

    annotations:
      service.kubernetes.io/topology-aware-hints: auto

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app: istio-ingressgateway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app: istio-ingressgateway
