istiod:
  replicaCount: 2

  autoscaleEnabled: True
  autoscaleMin: 2
  autoscaleMax: 6

gateway:
  replicaCount: 2

  autoscaling:
    enabled: True
    minReplicas: 2
    maxReplicas: 6

tgb:
  resources:
    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-public
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-0/7f5705c5101010d1"
        targetType: ip

    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-internal
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-0/5d5e6ca19ebeefee"
        targetType: ip


    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-grpc
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-grpc-0/43e90b2856ed46af"
        targetType: ip


raw:
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: istio-ingressgateway
        namespace: istio-system
      spec:
        gatewayClassName: istio
        addresses:
          - value: istio-ingressgateway.istio-system.svc.cluster.local
            type: Hostname
        listeners:
          - name: http
            port: 80
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All

    - apiVersion: v1
      kind: Service
      metadata:
        labels:
          app: istio-ingressgateway
          istio: ingressgateway
        name: istio-ingressgateway-metrics
      spec:
        ports:
          - name: http-envoy-prom
            port: 25090
            protocol: TCP
            targetPort: 15090
        selector:
          app: istio-ingressgateway
          istio: ingressgateway
        type: ClusterIP

    - apiVersion: networking.istio.io/v1alpha3
      kind: EnvoyFilter
      metadata:
        name: preserve-external-request-id
        namespace: istio-system
      spec:
        configPatches:
          - applyTo: NETWORK_FILTER
            match:
              context: ANY
              listener:
                filterChain:
                  filter:
                    name: envoy.filters.network.http_connection_manager
            patch:
              operation: MERGE
              value:
                typed_config:
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
                  preserve_external_request_id: true

    - apiVersion: networking.istio.io/v1alpha3
      kind: EnvoyFilter
      metadata:
        name: uuid-unable-trace-reason
        namespace: istio-system
      spec:
        configPatches:
          - applyTo: NETWORK_FILTER
            match:
              context: ANY
              listener:
                filterChain:
                  filter:
                    name: envoy.filters.network.http_connection_manager
            patch:
              operation: MERGE
              value:
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  request_id_extension:
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                      pack_trace_reason: false

    # Prometheus only adopts a ServiceMonitor carrying its release label, so
    # without it these are collected by nobody and the istio dashboards stay
    # empty. The metrics service above is what this scrapes.
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        labels:
          app: istio-ingressgateway

          release: prometheus-eks-demo

        name: istio-ingressgateway-metrics
      spec:
        endpoints:
          - interval: 15s
            path: /stats/prometheus
            port: http-envoy-prom
        jobLabel: istio-ingressgateway
        namespaceSelector:
          matchNames:
            - istio-system
        selector:
          matchLabels:
            app: istio-ingressgateway
            istio: ingressgateway

    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        labels:
          app: istio-components

          release: prometheus-eks-demo

        name: istio-components-metrics
      spec:
        endpoints:
          - interval: 30s
            metricRelabelings:
              - sourceLabels:
                  - cluster
                targetLabel: istio_cluster
              - action: labeldrop
                regex: cluster
            port: http-monitoring
        jobLabel: istio
        namespaceSelector:
          matchNames:
            - istio-system
        selector:
          matchExpressions:
            - key: istio
              operator: In
              values:
                - mixer
                - pilot
                - galley
                - citadel
                - sidecar-injector
                - istiod

    # Sidecar metrics for every meshed pod. Keep only the Istio standard
    # metrics and the retry budget counter that meshConfig proxyStatsMatcher
    # exposes; the raw Envoy stats would multiply the series per pod.
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        labels:
          app: istio-sidecars

          release: prometheus-eks-demo

        name: istio-sidecars
      spec:
        jobLabel: istio-sidecars
        namespaceSelector:
          any: true
        selector:
          matchExpressions:
            - key: security.istio.io/tlsMode
              operator: Exists
        podMetricsEndpoints:
          - interval: 30s
            path: /stats/prometheus
            port: http-envoy-prom
            metricRelabelings:
              - sourceLabels: [__name__]
                action: keep
                regex: istio_.*|envoy_cluster_upstream_rq_retry_overflow