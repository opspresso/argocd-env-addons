                                padding: 16px var(--gutter) max(22px, env(safe-area-inset-bottom));
                                font-size: 0.8125rem;
                                color: var(--faint);
                                animation: fade 1400ms 700ms ease both;
                              }
                              .host { color: var(--muted); letter-spacing: 0.02em; overflow-wrap: anywhere; }
                              .tools { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 28px; }
                              summary { cursor: pointer; list-style: none; color: var(--muted); }
                              summary::-webkit-details-marker { display: none; }
                              summary::after { content: " +"; }
                              details[open] summary::after { content: " \2212"; }
                              dl {
                                display: grid;
                                grid-template-columns: auto 1fr auto;
                                gap: 6px 14px;
                                margin: 12px 0 0;
                                max-width: 34rem;
                                text-align: left;
                                -webkit-user-select: text;
                                user-select: text;
                              }
                              dt { white-space: nowrap; }
                              dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
                              dd.wide { grid-column: span 2; }
                              .link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
                              select { font: inherit; color: var(--muted); background: transparent; border: 0; padding: 0; cursor: pointer; }
                              option { color: #111; }

                              @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
                              @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
                              @media (prefers-reduced-motion: reduce) {
                                .copy, footer { animation: none; }
                              }
                              @media (max-width: 560px) {
                                footer { flex-direction: column; align-items: flex-start; }
                              }
                              </style>
                              </head>
                              <body data-state="travel">
                              <canvas id="space" aria-hidden="true"></canvas>
                              <div class="flash" id="flash"></div>
                              <main>
                                <div class="copy">
                                  <h1><span id="title">Arriving shortly</span></h1>
                                  <p class="lead" data-i18n="body">This service isn't responding right now. It may be under maintenance or being updated. Keep this page open and it will take you there the moment the service is ready.</p>
