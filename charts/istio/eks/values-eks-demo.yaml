                                const DISPLAY = { ko: "Noto Sans KR", ja: "Noto Sans JP", "zh-Hans": "Noto Sans SC", "zh-Hant": "Noto Sans TC" };
                                const DISPLAY_FALLBACK = "\"Helvetica Neue\", \"Apple SD Gothic Neo\", \"Hiragino Sans\", \"PingFang SC\", Arial, sans-serif";
                                const LANG_KEY = "unavailable-page.lang";
                                const loadedFonts = new Set();

                                function match(tag) {
                                  tag = String(tag || "").toLowerCase();
                                  if (tag.startsWith("zh")) return /hant|tw|hk|mo/.test(tag) ? "zh-Hant" : "zh-Hans";
                                  const base = tag.split("-")[0];
                                  return I18N[base] ? base : null;
                                }
                                function pickLang() {
                                  try {
                                    const saved = localStorage.getItem(LANG_KEY);
                                    if (saved && I18N[saved]) return saved;
                                  } catch (e) {}
                                  for (const tag of navigator.languages || [navigator.language]) {
                                    const m = match(tag);
                                    if (m) return m;
                                  }
                                  return "en";
                                }
                                function useDisplay(lang) {
                                  const family = DISPLAY[lang] || "Noto Sans Display";
                                  if (!loadedFonts.has(family)) {
                                    loadedFonts.add(family);
                                    const link = document.createElement("link");
                                    link.rel = "stylesheet";
                                    link.href = "https://fonts.googleapis.com/css2?family=" + family.replace(/ /g, "+") + ":wght@300&display=swap";
                                    document.head.appendChild(link);
                                  }
                                  root.style.setProperty("--display", "\"" + family + "\", " + DISPLAY_FALLBACK);
                                }

                                // Space ---------------------------------------------------------------
                                // Stars live in a unit cube in front of the viewer and are projected
                                // through a vanishing point. Speed is in depth units per second; each
                                // star is drawn from where it was a moment ago, so speed stretches
                                // points into streaks.
                                const canvas = $("space");
                                const ctx = canvas.getContext("2d");
                                // The page opens at cruise, then jumps to light speed and stays there
                                // until the service answers; arrival drops out of light speed.
                                const CRUISE = 0.07;
                                const WARP = 2.4;
                                const SURGE = 3.8;
                                const LAUNCH_MS = 1800;
                                let w = 0, h = 0, focal = 0, stars = [];
                                let field = null;
                                let speed = CRUISE;
                                let target = CRUISE;
                                const view = { x: 0, y: 0, roll: 0, tx: 0, ty: 0, troll: 0 };

                                function spawn(s, far) {
                                  s.x = Math.random() * 2 - 1;
                                  s.y = Math.random() * 2 - 1;
                                  s.z = far ? 1 : 0.04 + Math.random() * 0.96;
                                  s.warm = Math.random() < 0.12;
                                  s.size = 0.6 + Math.random() * 0.9;
                                  return s;
                                }
                                function resize() {
                                  const dpr = Math.min(devicePixelRatio || 1, 2);
                                  w = innerWidth;
                                  h = innerHeight;
                                  canvas.width = Math.round(w * dpr);
                                  canvas.height = Math.round(h * dpr);
                                  canvas.style.width = w + "px";
                                  canvas.style.height = h + "px";
                                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                                  focal = Math.max(w, h) * 0.55;
                                  const count = Math.round(Math.min(1500, Math.max(400, w * h / 1100)));
                                  stars = Array.from({ length: count }, () => spawn({}, false));
                                  // Distant stars that never come closer: depth behind the moving field.
                                  field = document.createElement("canvas");
                                  field.width = canvas.width;
                                  field.height = canvas.height;
                                  const fctx = field.getContext("2d");
                                  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                                  for (let i = 0, n = Math.round(w * h / 1400); i < n; i++) {
                                    const r = Math.random();
                                    fctx.globalAlpha = 0.15 + r * r * 0.6;
                                    fctx.fillStyle = r > 0.92 ? "#ffd9b0" : r > 0.8 ? "#c8d8ff" : "#ffffff";
                                    fctx.beginPath();
                                    fctx.arc(Math.random() * w, Math.random() * h, 0.3 + r * r * 0.9, 0, Math.PI * 2);
                                    fctx.fill();
                                  }
                                  if (reduce.matches) draw(0);
                                }
                                function draw(dt) {
                                  ctx.clearRect(0, 0, w, h);
                                  ctx.save();
                                  // Banking: the view rolls around the screen centre as the ship turns.
                                  ctx.translate(w / 2, h / 2);
                                  ctx.rotate(view.roll);
                                  ctx.translate(-w / 2, -h / 2);
                                  const cx = w / 2 + view.x;
                                  const cy = h / 2 + view.y;
                                  // The far field fades as the jump starts, and drifts a little with the view.
                                  ctx.globalAlpha = Math.max(0, 1 - speed / 2.5);
                                  ctx.drawImage(field, view.x * 0.15, view.y * 0.15, w, h);
                                  // Trail length grows with the square of speed: points at cruise, streaks in a jump.
                                  const stretch = Math.min(0.5, speed * speed * 0.035);
                                  // In a jump the streaks clear the middle of the screen so the text stays legible.
                                  const tunnel = Math.min(1, Math.max(0, (speed - 0.6) / 1.6)) * Math.min(w, h) * 0.42;
                                  const blue = Math.min(1, Math.max(0, (speed - 0.4) / 3));
                                  // Light ahead blue-shifts as the ship approaches light speed.
                                  const cool = "rgb(" + Math.round(255 - 95 * blue) + "," + Math.round(255 - 50 * blue) + ",255)";
                                  const warm = "rgb(255," + Math.round(214 - 40 * blue) + "," + Math.round(170 + 60 * blue) + ")";
                                  ctx.lineCap = "round";
                                  for (const s of stars) {
                                    s.z -= speed * dt;
                                    if (s.z <= 0.02) { spawn(s, true); continue; }
                                    const k = focal / s.z;
                                    const x = cx + s.x * k;
                                    const y = cy + s.y * k;
                                    if (x < -60 || x > w + 60 || y < -60 || y > h + 60) { spawn(s, true); continue; }
                                    const tz = Math.min(1.2, s.z + stretch + 0.0015);
                                    const kt = focal / tz;
                                    const near = 1 - s.z;
                                    let alpha = Math.min(1, near * near * 1.6 + 0.08);
                                    if (tunnel > 0) {
                                      const d = Math.hypot((x - w / 2) / 1.6, y - h / 2) / tunnel;
                                      if (d < 1) alpha *= d * d;
                                    }
                                    ctx.globalAlpha = alpha;
                                    ctx.strokeStyle = s.warm ? warm : cool;
                                    ctx.lineWidth = s.size * (0.4 + near * 1.8);
                                    ctx.beginPath();
                                    ctx.moveTo(cx + s.x * kt, cy + s.y * kt);
                                    ctx.lineTo(x, y);
                                    ctx.stroke();
                                  }
                                  ctx.globalAlpha = 1;
                                  if (speed > 1) {
                                    // The bloom of light at the vanishing point during a jump.
                                    const glow = Math.min(0.4, (speed - 1) / 7);
                                    const r = Math.max(w, h) * 0.35;
                                    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                                    g.addColorStop(0, "rgba(190, 215, 255, " + glow.toFixed(3) + ")");
                                    g.addColorStop(1, "rgba(190, 215, 255, 0)");
                                    ctx.fillStyle = g;
                                    ctx.fillRect(-w, -h, w * 3, h * 3);
                                  }
                                  ctx.restore();
                                }
                                const launchAt = performance.now() + (reduce.matches ? 0 : LAUNCH_MS);
                                let surgeUntil = 0;
                                let arriving = false;
                                let last = performance.now();
                                function frame(now) {
                                  const dt = Math.min(0.05, (now - last) / 1000);
                                  last = now;
                                  if (!reduce.matches) {
                                    const target = state === "recovered" ? 0 : now < launchAt ? CRUISE : now < surgeUntil ? SURGE : WARP;
                                    // Accelerate briskly, come out of light speed a little slower.
                                    const rate = target > speed ? 1.5 : 1.3;
                                    speed += (target - speed) * (1 - Math.exp(-dt * rate));
                                    const steer = 1 - Math.exp(-dt * 3);
                                    view.x += (view.tx - view.x) * steer;
                                    view.y += (view.ty - view.y) * steer;
                                    view.roll += (view.troll - view.roll) * steer;
                                    draw(dt);
                                    if (state === "recovered" && speed < 0.15) arrive();
                                  }
                                  requestAnimationFrame(frame);
                                }

                                // Steering ------------------------------------------------------------
                                addEventListener("pointermove", (e) => {
                                  const dx = e.clientX - w / 2;
                                  const dy = e.clientY - h / 2;
                                  view.tx = dx * 0.55;
                                  view.ty = dy * 0.55;
                                  view.troll = dx / w * -0.35;
                                });
                                document.addEventListener("pointerleave", () => { view.tx = 0; view.ty = 0; view.troll = 0; });

                                // Recovery polling ----------------------------------------------------
                                const DELAYS = [5, 10, 15, 20, 30];
                                let lang = pickLang();
                                let t = I18N[lang];
                                let state = "travel";
                                let attempt = 0;
                                let probing = false;
                                let deadline = 0;

                                function setLive(text) {
                                  const live = $("live");
                                  if (live.textContent !== text) live.textContent = text;
                                }
                                function render() {
                                  document.body.dataset.state = state;
                                  $("retry").disabled = state === "recovered";
                                  const line = state === "recovered" ? t.recovered : state === "offline" ? t.offline : "";
                                  $("status").textContent = line;
                                  setLive(line);
                                }
                                function schedule() {
                                  deadline = Date.now() + DELAYS[Math.min(attempt, DELAYS.length - 1)] * 1000;
                                }
                                async function probe() {
                                  const ctrl = new AbortController();
                                  const timer = setTimeout(() => ctrl.abort(), 10000);
                                  try {
                                    const res = await fetch(location.href, {
                                      cache: "no-store",
                                      credentials: "same-origin",
                                      redirect: "manual",
                                      headers: { accept: "text/html" },
                                      signal: ctrl.signal
                                    });
                                    // Any answer other than a gateway failure means the service is back,
                                    // including a redirect to sign in.
                                    return !(res.status >= 502 && res.status <= 504);
                                  } catch (e) {
                                    return false;
                                  } finally {
                                    clearTimeout(timer);
                                  }
                                }
                                function arrive() {
                                  if (arriving) return;
                                  arriving = true;
                                  if (reduce.matches) { location.replace(location.href); return; }
                                  $("flash").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, easing: "ease-in", fill: "forwards" })
                                    .finished.then(() => location.replace(location.href));
                                }
                                async function check() {
                                  if (probing || state === "recovered") return;
                                  if (navigator.onLine === false) { state = "offline"; render(); return; }
                                  probing = true;
                                  const ok = await probe();
                                  probing = false;
                                  if (ok) {
                                    state = "recovered";
                                    render();
                                    if (reduce.matches) arrive();
                                    return;
                                  }
                                  if (state === "offline") { state = "travel"; render(); }
                                  attempt += 1;
                                  schedule();
                                }
                                setInterval(() => {
                                  if (state === "recovered" || document.hidden || probing) return;
                                  if (Date.now() >= deadline) check();
                                }, 250);
                                addEventListener("online", () => { if (state === "offline") { state = "travel"; render(); check(); } });
                                addEventListener("offline", () => { if (state === "travel") { state = "offline"; render(); } });
                                $("retry").addEventListener("click", () => {
                                  // A manual check pushes the ship past light speed for a moment.
                                  surgeUntil = performance.now() + 1200;
                                  check();
                                });

                                // Headline ------------------------------------------------------------
                                // The headline changes to another phrase from the shown language every
                                // few seconds, never repeating the one on screen.
                                const title = $("title");
                                let titleIndex = 0;
                                function showTitle(index, animate) {
                                  titleIndex = index;
                                  if (!animate || reduce.matches) { title.textContent = t.titles[index]; return; }
                                  const out = title.animate([{ opacity: 1, filter: "blur(0)", transform: "none" }, { opacity: 0, filter: "blur(8px)", transform: "translateY(-10px)" }], { duration: 450, easing: "ease-in", fill: "forwards" });
                                  out.finished.then(() => {
                                    title.textContent = t.titles[index];
                                    title.animate([{ opacity: 0, filter: "blur(8px)", transform: "translateY(10px)" }, { opacity: 1, filter: "blur(0)", transform: "none" }], { duration: 650, easing: "cubic-bezier(0.16, 0.8, 0.2, 1)", fill: "forwards" });
                                  });
                                }
                                setInterval(() => {
                                  if (document.hidden || state === "recovered") return;
                                  let next = Math.floor(Math.random() * (t.titles.length - 1));
                                  if (next >= titleIndex) next += 1;
                                  showTitle(next, true);
                                }, 5500);

                                // Text ----------------------------------------------------------------
                                function applyLang(next) {
                                  lang = next;
                                  t = I18N[lang];
                                  root.lang = lang;
                                  document.title = t.titles[0];
                                  showTitle(0, false);
                                  useDisplay(lang);
                                  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t[el.dataset.i18n];
                                  $("lang").value = lang;
                                  render();
                                }
                                const select = $("lang");
                                for (const key of Object.keys(I18N)) {
                                  const opt = document.createElement("option");
                                  opt.value = key;
                                  opt.textContent = I18N[key].name;
                                  select.appendChild(opt);
                                }
                                select.addEventListener("change", () => {
                                  try { localStorage.setItem(LANG_KEY, select.value); } catch (e) {}
                                  applyLang(select.value);
                                });

                                $("host").textContent = location.host;
                                $("code").textContent = detail ? code + " (" + detail + ")" : code;
                                if (requestId) $("request").textContent = requestId;
                                else for (const el of document.querySelectorAll(".request-row")) el.hidden = true;
                                $("copy").addEventListener("click", async () => {
                                  try {
                                    await navigator.clipboard.writeText(requestId);
                                    $("copy").textContent = t.copied;
                                    setTimeout(() => { $("copy").textContent = t.copy; }, 2000);
                                  } catch (e) {
                                    getSelection().selectAllChildren($("request"));
                                  }
                                });

                                addEventListener("resize", resize);
                                reduce.addEventListener("change", resize);
                                resize();
                                applyLang(lang);
                                schedule();
                                requestAnimationFrame(frame);
                              })();
                              </script>
                              </body>
                              </html>

    # Prometheus only adopts a ServiceMonitor carrying its release label, so
    # without it these are collected by nobody and the istio dashboards stay
    # empty. The metrics service above is what this scrapes.
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        labels:
          app: istio-ingressgateway

          release: prometheus-eks-demo

        name: istio-ingressgateway-metrics
      spec:
        endpoints:
          - interval: 15s
            path: /stats/prometheus
            port: http-envoy-prom
        jobLabel: istio-ingressgateway
        namespaceSelector:
          matchNames:
            - istio-system
        selector:
          matchLabels:
            app: istio-ingressgateway
            istio: ingressgateway

    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        labels:
          app: istio-components

          release: prometheus-eks-demo

        name: istio-components-metrics
      spec:
        endpoints:
          - interval: 30s
            metricRelabelings:
              - sourceLabels:
                  - cluster
                targetLabel: istio_cluster
              - action: labeldrop
                regex: cluster
            port: http-monitoring
        jobLabel: istio
        namespaceSelector:
          matchNames:
            - istio-system
        selector:
          matchExpressions:
            - key: istio
              operator: In
              values:
                - mixer
                - pilot
                - galley
                - citadel
                - sidecar-injector
                - istiod

    # Sidecar metrics for every meshed pod. Keep only the Istio standard
    # metrics and the retry budget counter that meshConfig proxyStatsMatcher
    # exposes; the raw Envoy stats would multiply the series per pod.
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        labels:
          app: istio-sidecars

          release: prometheus-eks-demo

        name: istio-sidecars
      spec:
        jobLabel: istio-sidecars
        namespaceSelector:
          any: true
        selector:
          matchExpressions:
            - key: security.istio.io/tlsMode
              operator: Exists
        podMetricsEndpoints:
          - interval: 30s
            path: /stats/prometheus
            port: http-envoy-prom
            metricRelabelings:
              - sourceLabels: [__name__]
                action: keep
                regex: istio_.*|envoy_cluster_upstream_rq_retry_overflow