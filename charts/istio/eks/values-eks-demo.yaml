                                font-size: clamp(2.125rem, 1.1rem + 3.4vw, 3.875rem);
                                line-height: 1.08;
                                /* Two lines are reserved so a longer phrase does not move the text below. */
                                display: grid;
                                align-content: end;
                                min-height: 2.16em;
                                letter-spacing: -0.025em;
                                word-break: keep-all;
                                overflow-wrap: anywhere;
                                text-shadow: 0 0 40px rgba(140, 170, 255, 0.25);
                              }
                              .lead {
                                margin: 0 auto;
                                max-width: 30em;
                                font-size: 1.0625rem;
                                line-height: 1.75;
                                color: var(--muted);
                                word-break: keep-all;
                                overflow-wrap: anywhere;
                              }
                              .controls {
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                gap: 16px;
                                margin-top: 36px;
                              }
                              .status {
                                margin: 0;
                                font-size: 0.9375rem;
                                font-variant-numeric: tabular-nums;
                                color: var(--ink);
                              }
                              .status:empty { display: none; }
                              .retry {
                                font: inherit;
                                font-size: 0.9375rem;
                                font-weight: 500;
                                color: var(--ink);
                                background: var(--glass);
                                border: 1px solid var(--rule);
                                border-radius: 999px;
                                padding: 11px 26px;
