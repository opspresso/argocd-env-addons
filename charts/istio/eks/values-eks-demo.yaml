                                inset: 0;
                                background: var(--space);
                                opacity: 0;
                                pointer-events: none;
                              }
                              main, footer { position: relative; }
                              main {
                                display: grid;
                                justify-items: center;
                                align-content: center;
                                padding: 64px var(--gutter) 32px;
                                text-align: center;
                                pointer-events: none;
                              }
                              main > * { pointer-events: auto; }
                              .copy {
                                max-width: 44rem;
                                padding: 40px 24px;
                                background: radial-gradient(ellipse closest-side, rgba(3, 5, 11, 0.72), transparent);
                                animation: rise 1400ms 300ms cubic-bezier(0.16, 0.8, 0.2, 1) both;
                              }
                              h1 {
                                margin: 0 0 20px;
                                font-family: var(--display);
