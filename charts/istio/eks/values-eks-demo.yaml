istiod:
  replicaCount: 2

  autoscaleEnabled: True
  autoscaleMin: 2
  autoscaleMax: 6

gateway:
  replicaCount: 2

  autoscaling:
    enabled: True
    minReplicas: 2
    maxReplicas: 6

tgb:
  resources:
    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-public
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-h1-0/7f5705c5101010d1"
        targetType: ip

    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-internal
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-in-http-0/5d5e6ca19ebeefee"
        targetType: ip


    - apiVersion: eks.amazonaws.com/v1
      kind: TargetGroupBinding
      metadata:
        name: istio-ingressgateway-grpc
      spec:
        serviceRef:
          name: istio-ingressgateway
          port: http2
        targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:396608815058:targetgroup/demo-grpc-0/43e90b2856ed46af"
        targetType: ip


raw:
  resources:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: istio-ingressgateway
        namespace: istio-system
      spec:
        gatewayClassName: istio
        addresses:
          - value: istio-ingressgateway.istio-system.svc.cluster.local
            type: Hostname
        listeners:
          - name: http
            port: 80
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All

    - apiVersion: v1
      kind: Service
      metadata:
        labels:
          app: istio-ingressgateway
          istio: ingressgateway
        name: istio-ingressgateway-metrics
      spec:
        ports:
          - name: http-envoy-prom
            port: 25090
            protocol: TCP
            targetPort: 15090
        selector:
          app: istio-ingressgateway
          istio: ingressgateway
        type: ClusterIP

    - apiVersion: networking.istio.io/v1alpha3
      kind: EnvoyFilter
      metadata:
        name: preserve-external-request-id
        namespace: istio-system
      spec:
        configPatches:
          - applyTo: NETWORK_FILTER
            match:
              context: ANY
              listener:
                filterChain:
                  filter:
                    name: envoy.filters.network.http_connection_manager
            patch:
              operation: MERGE
              value:
                typed_config:
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
                  preserve_external_request_id: true

    - apiVersion: networking.istio.io/v1alpha3
      kind: EnvoyFilter
      metadata:
        name: uuid-unable-trace-reason
        namespace: istio-system
      spec:
        configPatches:
          - applyTo: NETWORK_FILTER
            match:
              context: ANY
              listener:
                filterChain:
                  filter:
                    name: envoy.filters.network.http_connection_manager
            patch:
              operation: MERGE
              value:
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  request_id_extension:
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                      pack_trace_reason: false

    # Envoy answers with a bare "no healthy upstream" (and similar) when a
    # backend is down or being redeployed. local_reply_config rewrites only
    # replies the gateway generates itself, so a 5xx from an application keeps
    # its own body. Browsers get this page; API and gRPC clients, which do not
    # send Accept: text/html, keep the plain text. The page polls the URL and
    # reloads itself once the gateway stops answering 502-504.
    - apiVersion: networking.istio.io/v1alpha3
      kind: EnvoyFilter
      metadata:
        name: unavailable-page
        namespace: istio-system
      spec:
        workloadSelector:
          labels:
            istio: ingressgateway
        configPatches:
          - applyTo: NETWORK_FILTER
            match:
              context: GATEWAY
              listener:
                filterChain:
                  filter:
                    name: envoy.filters.network.http_connection_manager
            patch:
              operation: MERGE
              value:
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  local_reply_config:
                    mappers:
                      - filter:
                          and_filter:
                            filters:
                              - status_code_filter:
                                  comparison:
                                    op: GE
                                    value:
                                      default_value: 502
                                      runtime_key: unavailable_page.status_min
                              - status_code_filter:
                                  comparison:
                                    op: LE
                                    value:
                                      default_value: 504
                                      runtime_key: unavailable_page.status_max
                              - header_filter:
                                  header:
                                    name: accept
                                    string_match:
                                      contains: text/html
                        headers_to_add:
                          - header:
                              key: cache-control
                              value: no-store
                            append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          - header:
                              key: retry-after
                              value: "30"
                            append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        body_format_override:
                          content_type: text/html; charset=UTF-8
                          text_format_source:
                            # Source: unavailable-page.html. Envoy expands %COMMAND% in
                            # it, so the file must not contain another literal percent sign.
                            inline_string: |
                              <!doctype html>
                              <html lang="en" data-code="%RESPONSE_CODE%" data-detail="%RESPONSE_CODE_DETAILS%" data-request="%REQ(X-REQUEST-ID):64%">
                              <head>
                              <meta charset="utf-8">
                              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
                              <meta name="robots" content="noindex">
                              <meta name="theme-color" content="#03050b">
                              <noscript><meta http-equiv="refresh" content="30"></noscript>
                              <title>Arriving shortly</title>
                              <link rel="preconnect" href="https://fonts.googleapis.com">
                              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
                              <style>
                              :root {
                                color-scheme: dark;
                                --space: #03050b;
                                --ink: #eef2fa;
                                --muted: rgba(214, 224, 243, 0.68);
                                --faint: rgba(214, 224, 243, 0.42);
                                --rule: rgba(255, 255, 255, 0.24);
                                --glass: rgba(255, 255, 255, 0.05);
                                --display: "Noto Sans Display", "Helvetica Neue", Arial, sans-serif;
                                --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Hiragino Sans", "Noto Sans CJK KR", "Segoe UI", system-ui, sans-serif;
                                --gutter: clamp(20px, 5vw, 48px);
                              }
                              * { box-sizing: border-box; }
                              html, body { margin: 0; }
                              body {
                                min-height: 100vh;
                                min-height: 100dvh;
                                display: grid;
                                grid-template-rows: 1fr auto;
                                color: var(--ink);
                                font-family: var(--sans);
                                -webkit-font-smoothing: antialiased;
                                background:
                                  radial-gradient(ellipse 70vw 55vh at 18vw 22vh, rgba(58, 72, 170, 0.22), transparent),
                                  radial-gradient(ellipse 60vw 50vh at 86vw 82vh, rgba(126, 52, 132, 0.16), transparent),
                                  radial-gradient(ellipse 40vw 30vh at 70vw 18vh, rgba(30, 110, 150, 0.12), transparent),
                                  var(--space);
                                background-attachment: fixed;
                                overflow-x: hidden;
                                -webkit-user-select: none;
                                user-select: none;
                                -webkit-tap-highlight-color: transparent;
                              }
                              canvas {
                                position: fixed;
                                inset: 0;
                                display: block;
                                touch-action: none;
