kanidm:
  fullnameOverride: kanidm

  image:
    repository: kanidm/server
    tag: "1.12.0"

  containerName: kanidm
  command: [/sbin/kanidmd, server, -c, /config/server.toml]

  # One Pod owns the ReadWriteOnce volume and the database.
  controller:
    strategy:
      type: Recreate

  # kanidmd serves only HTTPS. The gateway re-encrypts to this port and
  # verifies the certificate against the internal CA (README.md: TLS).
  service:
    name: https
    port: 8443
    targetPort: 8443

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  startupProbe:
    httpGet:
      path: /status
      port: https
      scheme: HTTPS
    periodSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet:
      path: /status
      port: https
      scheme: HTTPS
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /status
      port: https
      scheme: HTTPS
    periodSeconds: 30
    failureThreshold: 6

  # /data holds the database and the online backups.
  persistence:
    enabled: true
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /data

  extraVolumes:
    - name: config
      configMap:
        name: kanidm-config
    - name: tls
      secret:
        secretName: kanidm-tls
        defaultMode: 0400
  extraVolumeMounts:
    - name: config
      mountPath: /config
      readOnly: true
    - name: tls
      mountPath: /tls
      readOnly: true

  # Only the gateway reaches kanidmd. It trusts X-Forwarded-For from the VPC.
  networkPolicy:
    enabled: true
    policyTypes: [Ingress]
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: istio-system
        ports:
          - protocol: TCP
            port: 8443
