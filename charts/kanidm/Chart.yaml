apiVersion: v2
description: A Helm chart for Kubernetes
name: kanidm
type: application
version: "v2.2.0" # helm chart app version

# Kanidm publishes no Helm chart. This chart runs the official image
# kanidm/server with the opspresso app chart.
dependencies:
- name: app
  alias: kanidm
  repository: https://opspresso.github.io/helm-charts/
  version: "v2.2.0" # helm chart app version

- name: raw
  repository: https://opspresso.github.io/helm-charts/
  version: "0.2.5" # helm chart raw version
