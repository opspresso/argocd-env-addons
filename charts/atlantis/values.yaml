  #       plan:
  #         steps:
  #           - env:
  #               name: INFRACOST_OUTPUT
  #               command: echo "/tmp/$BASE_REPO_OWNER-$BASE_REPO_NAME-$PULL_NUM/infracost-output.json"
  #           - init
  #           - plan
  #           - show
  #           - run: |
  #               mkdir -p /tmp/$BASE_REPO_OWNER-$BASE_REPO_NAME-$PULL_NUM
  #               infracost breakdown --path=$SHOWFILE --format=json --log-level=info --out-file=$INFRACOST_OUTPUT
  #           - run: |
  #               infracost comment github --repo $BASE_REPO_OWNER/$BASE_REPO_NAME --pull-request $PULL_NUM \
  #                 --path $INFRACOST_OUTPUT --github-token $GITHUB_TOKEN --behavior new
  #               rm -rf /tmp/$BASE_REPO_OWNER-$BASE_REPO_NAME-$PULL_NUM

  # The image has no Terraform since Atlantis 0.40. Atlantis downloads this
  # version, and the version a project's required_version asks for.
  defaultTFVersion: "1.17.1"

  resources:
    requests:
      memory: 2Gi
      cpu: "1"
    limits:
      memory: 4Gi
      cpu: "2"

  storageClassName: gp3 # aws-ebs-sc
  dataStorage: 15Gi

  service:
    type: ClusterIP

  ingress:
    enabled: false

  loadEnvFromConfigMaps:
    - atlantis-configmap

  loadEnvFromSecrets:
    - atlantis-secret

  extraVolumes:
    - name: atlantis-secret
      secret:
        secretName: atlantis-secret
        defaultMode: 0400

# raw renders the ConfigMap, ExternalSecret, AuthorizationPolicy and UI test Pod as raw.resources in
# values-template.yaml.j2: they carry cluster values, and Helm replaces a values list instead of merging it.
