atlantis:
  fullnameOverride: atlantis


  atlantisUrl: "https://atlantis.demo.opsp.dev"

  orgAllowlist: "github.com/opspresso/terraform-*"

  podTemplate:
    annotations:
      link.argocd.argoproj.io/external-link: "https://atlantis.demo.opsp.dev"

  route:
    main:
      enabled: true
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "atlantis.demo.opsp.dev"
    public:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "atlantis-public.demo.opsp.dev"
      matches:
        - path:
            type: PathPrefix
            value: /events

raw:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: atlantis-configmap
      data:
        ATLANTIS_GH_ORG: "opspresso"
        ATLANTIS_GH_USER: "nalbam-bot"
        ATLANTIS_WRITE_GIT_CREDS: "true"
        ATLANTIS_ALLOW_FORK_PRS: "true"


    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: atlantis-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: secrets-manager
        target:
          name: atlantis-secret
        data:
          - secretKey: ATLANTIS_GH_TOKEN
            remoteRef:
              key: /k8s/common/github/nalbam-bot/token
          - secretKey: ATLANTIS_GH_WEBHOOK_SECRET
            remoteRef:
              key: /k8s/common/github/nalbam-bot/secret


    - apiVersion: security.istio.io/v1beta1
      kind: AuthorizationPolicy
      metadata:
        name: atlantis
        namespace: istio-system
      spec:
        selector:
          matchLabels:
            istio: ingressgateway
        action: CUSTOM
        provider:
          name: oauth2-proxy
        rules:
        - to:
          - operation:
              hosts:
              - "atlantis.demo.opsp.dev"

    # `helm test` probe for the UI. backup/atlantis.yaml fixes the release name atlantis and the
    # namespace addon-atlantis.
    - apiVersion: v1
      kind: Pod
      metadata:
        name: atlantis-ui-test
        namespace: addon-atlantis
        annotations:
          helm.sh/hook: test
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          seccompProfile: {type: RuntimeDefault}
        containers:
          - name: ui-test
            image: curlimages/curl:8.11.1
            args: [--fail, --silent, --show-error, --connect-timeout, "5", --max-time, "30", "http://atlantis:80/"]
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {memory: 64Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
