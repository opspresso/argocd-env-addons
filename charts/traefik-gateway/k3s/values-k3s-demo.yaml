enabled: True
gateway:
  name: "traefik-gateway"
  namespace: "traefik-gateway"
  class_name: "traefik"
  listener_port: 8443
  hosts:
    - demo.opsp.dev
    - '*.demo.opsp.dev'
    - memory.opsp.dev
    - studio.opsp.dev
  tls:
    secret_name: "traefik-gateway-tls"
    issuer_name: "letsencrypt-prod"

resources:
  enabled: False
autoscaling:
  enabled: False