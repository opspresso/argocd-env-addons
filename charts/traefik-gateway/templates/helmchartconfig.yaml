{{- if .Values.enabled }}
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
{{- if not .Values.resources.enabled }}
    resources: null
{{- end }}
{{- if not .Values.autoscaling.enabled }}
    autoscaling:
      enabled: false
{{- end }}
    providers:
      kubernetesGateway:
        enabled: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tls.secret_name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: {{ .Values.gateway.tls.secret_name }}
  issuerRef:
    name: {{ .Values.gateway.tls.issuer_name }}
    kind: ClusterIssuer
  dnsNames:
    {{- toYaml .Values.gateway.hosts | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.class_name }}
  listeners:
    {{- $root := . }}
    {{- range $index, $host := .Values.gateway.hosts }}
    - name: https-{{ $index }}
      hostname: {{ $host | quote }}
      port: {{ $.Values.gateway.listener_port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $root.Values.gateway.tls.secret_name }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}
