external-secrets:
  fullnameOverride: external-secrets

  resources: null
  webhook:
    resources: null
  certController:
    resources: null








raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: parameter-store
      spec:
        provider:
          aws:
            region: "ap-northeast-2"
            service: ParameterStore

    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: secrets-manager
      spec:
        provider:
          aws:
            region: "ap-northeast-2"
            service: SecretsManager