external-secrets:
  fullnameOverride: external-secrets

  resources: null
  webhook:
    resources: null
  certController:
    resources: null



  extraEnv:
    - name: AWS_PROFILE
      value: "default"
    - name: AWS_CONFIG_FILE
      value: /aws/config
    - name: AWS_SHARED_CREDENTIALS_FILE
      value: /aws/credentials
    - name: AWS_SDK_LOAD_CONFIG
      value: "true"
  extraVolumes:
    - name: local-aws-config
      hostPath:
        path: "/Users/nalbam/.aws/config"
        type: File
    - name: local-aws-credentials
      hostPath:
        path: "/Users/nalbam/.aws/credentials"
        type: File
  extraVolumeMounts:
    - name: local-aws-config
      mountPath: /aws/config
      readOnly: true
    - name: local-aws-credentials
      mountPath: /aws/credentials
      readOnly: true






raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: parameter-store
      spec:
        provider:
          aws:
            region: "ap-northeast-2"
            service: ParameterStore

    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: secrets-manager
      spec:
        provider:
          aws:
            region: "ap-northeast-2"
            service: SecretsManager