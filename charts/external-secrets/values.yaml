external-secrets:
  fullnameOverride: external-secrets

  # Every addon that reads a secret from SSM waits on this controller, so it
  # should outrank the workloads it serves when a node runs short.
  priorityClassName: system-cluster-critical

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  # The validating webhooks use failurePolicy Fail, so one webhook pod would
  # block every ExternalSecret change while a node drains.
  webhook:
    priorityClassName: system-cluster-critical
    replicaCount: 2

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-webhook

    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 128Mi

  certController:
    priorityClassName: system-cluster-critical

    resources:
      requests:
        cpu: 5m
        memory: 96Mi
      limits:
        memory: 128Mi
