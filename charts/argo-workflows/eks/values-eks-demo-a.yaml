argo-workflows:
  fullnameOverride: argo-workflows

  controller:
    revisionHistoryLimit: 2

    workflowNamespaces:
      - default



  server:
    revisionHistoryLimit: 2

    # replicas: 1

    extraArgs:
      - --auth-mode=sso



    podAnnotations:
      link.argocd.argoproj.io/external-link: "https://workflows.demo.opspresso.com"

    ingress:
      enabled: false

    # Match the redirectURI of Argo CD's argo-workflows-sso staticClient.
    httproute:
      enabled: true
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "workflows.demo.opspresso.com"



raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argo-workflows-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argo-workflows-secret
          # The client id is the literal id of the staticClient that argo-cd's
          # dex declares, not a secret, so it is written here rather than read
          # from parameter store. Merge keeps the fetched client-secret.
          template:
            mergePolicy: Merge
            data:
              client-id: argo-workflows-sso
        data:
          - secretKey: client-secret
            remoteRef:
              key: /k8s/common/argo-workflows-client-secret