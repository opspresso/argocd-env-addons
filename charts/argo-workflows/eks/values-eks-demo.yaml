argo-workflows:
  fullnameOverride: argo-workflows

  controller:
    revisionHistoryLimit: 2

    workflowNamespaces:
      - default
      # Agent Runway app deliveries (argocd-env-projects charts/delivery).
      - app-delivery

  server:
    revisionHistoryLimit: 2

    # replicas: 1

    extraArgs:
      - --auth-mode=sso


    sso:
      enabled: true

      issuer: https://argocd.demo.rovr.dev/api/dex

      redirectUrl: https://workflows.demo.rovr.dev/oauth2/callback

      clientId:
        key: client-id
        name: argo-workflows-secret
      clientSecret:
        key: client-secret
        name: argo-workflows-secret
      # Each SSO user acts with the ServiceAccount whose rbac-rule matches (raw resources below), not the
      # server's own account. Only Agent Runway submits app Deliveries, so no SSO user may create them.
      rbac:
        enabled: true
      scopes:
        - groups


    podAnnotations:
      link.argocd.argoproj.io/external-link: "https://workflows.demo.rovr.dev"

    ingress:
      enabled: false

    # Match the redirectURI of Argo CD's argo-workflows-sso staticClient.
    httproute:
      enabled: true
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system
      hostnames:
        - "workflows.demo.rovr.dev"

raw:
  resources:
    # SSO users of the platform team edit workflows in default and only read app Deliveries.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: sso-team
        annotations:
          workflows.argoproj.io/rbac-rule: "'opspresso:dev' in groups"
          workflows.argoproj.io/rbac-rule-precedence: "1"
    - apiVersion: v1
      kind: Secret
      metadata:
        name: sso-team.service-account-token
        annotations:
          kubernetes.io/service-account.name: sso-team
      type: kubernetes.io/service-account-token
    # Every other member of the GitHub organization reads workflows in default only.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: sso-member
        annotations:
          workflows.argoproj.io/rbac-rule: "true"
          workflows.argoproj.io/rbac-rule-precedence: "0"
    - apiVersion: v1
      kind: Secret
      metadata:
        name: sso-member.service-account-token
        annotations:
          kubernetes.io/service-account.name: sso-member
      type: kubernetes.io/service-account-token
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argo-workflows-sso-team
        namespace: default
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: argo-workflows-edit
      subjects:
        - kind: ServiceAccount
          name: sso-team
          namespace: addon-argo-workflows
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argo-workflows-sso-team
        namespace: app-delivery
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: argo-workflows-view
      subjects:
        - kind: ServiceAccount
          name: sso-team
          namespace: addon-argo-workflows
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argo-workflows-sso-member
        namespace: default
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: argo-workflows-view
      subjects:
        - kind: ServiceAccount
          name: sso-member
          namespace: addon-argo-workflows
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argo-workflows-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: argo-workflows-secret
          # The client id is the literal id of the staticClient that argo-cd's
          # dex declares, not a secret, so it is written here rather than read
          # from parameter store. Merge keeps the fetched client-secret.
          template:
            mergePolicy: Merge
            data:
              client-id: argo-workflows-sso
        data:
          - secretKey: client-secret
            remoteRef:
              key: /k8s/common/argo-workflows-client-secret