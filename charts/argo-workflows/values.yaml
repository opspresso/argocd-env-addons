argo-workflows:
  fullnameOverride: argo-workflows

  crds:
    upgradeJob:
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}

  controller:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
    revisionHistoryLimit: 2

    # Applies only where a Workflow and its WorkflowTemplate leave these unset.
    # Successful Pods go at once; failed Pods and Workflows stay a day for logs.
    workflowDefaults:
      spec:
        ttlStrategy:
          secondsAfterSuccess: 3600
          secondsAfterFailure: 86400
        podGC:
          strategy: OnPodSuccess
        volumeClaimGC:
          strategy: OnWorkflowCompletion

    workflowNamespaces:
      - default

  server:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
    revisionHistoryLimit: 2
