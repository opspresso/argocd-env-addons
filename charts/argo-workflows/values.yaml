argo-workflows:
  fullnameOverride: argo-workflows

  crds:
    upgradeJob:
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}

  controller:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 512Mi}
    revisionHistoryLimit: 2

    # The controller runs only Workflows that reference a WorkflowTemplate.
    # Agent Runway submits every Workflow this way; an inline Workflow from a
    # stolen submitter token cannot run its own steps. Secure would also fail
    # running Workflows when GitOps changes their template, so Strict.
    workflowRestrictions:
      templateReferencing: Strict

    # Applies only where a Workflow and its WorkflowTemplate leave these unset.
    # Successful Pods go at once; failed Pods and Workflows stay a day for logs.
    workflowDefaults:
      spec:
        ttlStrategy:
          secondsAfterSuccess: 3600
          secondsAfterFailure: 86400
        podGC:
          strategy: OnPodSuccess
        volumeClaimGC:
          strategy: OnWorkflowCompletion

    workflowNamespaces:
      - default

  server:
    resources:
      requests: {cpu: 5m, memory: 64Mi}
      limits: {memory: 256Mi}
    revisionHistoryLimit: 2
