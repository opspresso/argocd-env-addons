name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # On a same-repo pull request, check out the head branch itself (not the
      # merge ref) so the rendered values can be pushed back to it below.
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: pip install -r requirements.txt

      - name: Install Helm 📝
        uses: azure/setup-helm@v4

      # Renders first so the check covers what build.sh will commit, not the
      # values files a pull request happens to have left stale.
      - name: Render 🏗️
        run: bash ./build.sh

      # Rendered values are part of the reviewed diff: a template change shows
      # exactly which clusters it touches. Fork PRs are skipped because the
      # token cannot push to them.
      - name: Push render to PR 🔁
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain charts)" ]; then
            git config user.name "nalbam-bot"
            git config user.email "bot@nalbam.com"
            git add charts
            git commit -m "Render values for ${GITHUB_HEAD_REF}"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Validate 🧪
        run: python3 ./validate.py
