name: validate

# On demand only. The build on main runs the same checks before it pushes rendered values, so pull
# requests do not start a second validation.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: python3 -m pip install -r requirements/dev.txt

      - name: Install Helm 📝
        uses: azure/setup-helm@v5

      # Anonymous public.ecr.aws pulls share a per-IP data limit with other GitHub-hosted runners and fail with 429.
      # The role (terraform-env-demo demo/4-role) only gets the pull token and trusts runs on main only.
      - name: Configure AWS credentials 🔑
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::396608815058:role/github--argocd-env-addons-ecr-public
          aws-region: us-east-1

      - name: Log in to public.ecr.aws 🔑
        if: github.ref == 'refs/heads/main'
        run: aws ecr-public get-login-password --region us-east-1 | helm registry login public.ecr.aws --username AWS --password-stdin

      - name: Build
        run: bash ./scripts/build.sh

      - name: Validate 🧪
        run: python3 ./scripts/validate.py -d addons -d backup

      # Rendered-policy tests consume the dependencies prepared by validation.
      - name: Prepare PromQL rule tests
        run: docker pull quay.io/prometheus/prometheus:v3.14.0-distroless

      - name: Test 🧪
        run: python3 -m pytest -q

      - name: Check diff
        run: git diff --check
