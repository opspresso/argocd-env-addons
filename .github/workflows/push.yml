name: build

on:
  push:
    branches:
      - main

# The job pushes the rendered values back to main, so overlapping runs would
# race for the same branch.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: python3 -m pip install -r requirements/dev.txt

      - name: Install Helm 📝
        uses: azure/setup-helm@v5

      - name: Test 🧪
        run: python3 -m pytest -q

      - name: Build
        run: bash ./scripts/build.sh

      - name: Validate 🧪
        run: python3 ./scripts/validate.py

      - name: Push validated values 🚀
        run: |
          git diff --check
          git add -- ':(glob)charts/*/*/values-*.yaml'
          if ! git diff --cached --quiet; then
            git config user.name "nalbam-bot"
            git config user.email "bot@nalbam.com"
            git commit -m "chore: regenerate chart values"
            git push origin HEAD:main
          fi
