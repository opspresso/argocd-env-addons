fullnameOverride: argocd

global:
  domain: ARGOCD_HOSTNAME

server:
  replicas: 1

  ingress:
    enabled: false

  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik-gateway
    hostnames:
      - ARGOCD_HOSTNAME

repoServer:
  replicas: 1

controller:
  replicas: 1

dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    server.insecure: true

  cm:
    url: https://ARGOCD_HOSTNAME
