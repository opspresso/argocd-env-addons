fullnameOverride: argocd

## Globally shared configuration
global:
  # -- Default domain used by all components
  ## Used for ingresses, certificates, SSO, notifications, etc.
  domain: ARGOCD_HOSTNAME

server:
  replicas: 2

  ingress:
    enabled: true
    hostname: "ARGOCD_HOSTNAME"
    ingressClassName: "alb"
    annotations:
      external-dns.alpha.kubernetes.io/hostname: "ARGOCD_HOSTNAME"
      alb.ingress.kubernetes.io/scheme: "internet-facing"
      alb.ingress.kubernetes.io/target-type: "ip"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: "AWS_ACM_CERT"
      alb.ingress.kubernetes.io/actions.ssl-redirect: |
        {"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}

repoServer:
  replicas: 2

configs:
  rbac:
    policy.default: "role:readonly"

    # mcp 는 mcp-argocd (argocd-env-demo) 가 쓰는 API 토큰 계정입니다.
    # role:admin 대신 이름 붙인 권한만 줍니다 — 이 토큰은 LLM 이 모는 파드 안에
    # 있으므로 **바꿀 수 있는 것**을 applications 로 묶어 둡니다. repositories·
    # clusters·accounts·이 정책 자체에는 쓰기가 없고, exec 은 이 role 에도 기본
    # role 에도 없습니다.
    # 읽기 전용으로 만들려면 create/update/delete/sync 와 action/* 줄을 지웁니다.
    #
    # 다만 읽기는 좁아지지 않습니다. 아래 policy.default 가 role:readonly 이고
    # 모든 계정이 이를 상속하는데, Argo CD 빌트인 정의가 applications·
    # applicationsets·certificates·clusters·repositories·projects·accounts·
    # gpgkeys·logs 에 get 을 줍니다. 그래서 아래 logs/projects/clusters 줄은
    # 지금은 중복이며, policy.default 를 좁힐 때 role 이 홀로 서도록 남겨 둡니다.
    # 이 계정의 읽기만 좁히려면 deny 규칙이 따로 필요합니다 (deny 가 우선).
    #
    # charts/argo-cd/values-template.yaml.j2 와 같은 내용을 유지합니다.
    policy.csv: |
      g, GITHUB_ORG:GITHUB_TEAM, role:admin

      p, role:mcp, applications, get, */*, allow
      p, role:mcp, applications, create, */*, allow
      p, role:mcp, applications, update, */*, allow
      p, role:mcp, applications, delete, */*, allow
      p, role:mcp, applications, sync, */*, allow
      p, role:mcp, applications, action/*, */*, allow
      p, role:mcp, logs, get, */*, allow
      p, role:mcp, projects, get, *, allow
      p, role:mcp, clusters, get, *, allow
      g, mcp, role:mcp

  params:
    server.insecure: true

  cm:
    url: https://ARGOCD_HOSTNAME

    # 토큰 전용 계정입니다. apiKey 만 주고 login 은 주지 않으므로 비밀번호가
    # 없고 UI 세션으로도 바뀌지 않습니다.
    accounts.mcp: apiKey

    dex.config: |
      connectors:
      - type: github
        id: github
        name: github
        config:
          clientID: $dex.github.clientId
          clientSecret: $dex.github.clientSecret
          teamNameField: slug
          orgs:
            - name: GITHUB_ORG

  secret:
    createSecret: true

    githubSecret: "ARGOCD_WEBHOOK"

    extra:
      server.secretkey: "ARGOCD_SERVER_SECRET"

      dex.github.clientId: "ARGOCD_GITHUB_ID"
      dex.github.clientSecret: "ARGOCD_GITHUB_SECRET"

      # mcp 계정의 토큰 목록입니다. server.secretkey 와 이 목록이 같이 고정되어
      # 있으면 mcp-argocd 가 들고 있는 토큰이 재설치 후에도 그대로 통합니다.
      # 값은 ./token.sh 가 만들어 SSM 에 넣습니다 — JSON 안에 " 가 있으므로
      # 홑따옴표로 감쌉니다.
      accounts.mcp.tokens: 'ARGOCD_MCP_TOKENS'

    # Argo expects the password in the secret to be bcrypt hashed. You can create this hash with
    # `htpasswd -nbBC 10 "" $PASSWORD | tr -d ':\n' | sed 's/$2y/$2a/'`
    argocdServerAdminPassword: "ARGOCD_PASSWORD"
    # Password modification time defaults to current time if not set
    argocdServerAdminPasswordMtime: "ARGOCD_MTIME"

  repositories:
    env-addons-repo:
      name: env-addons
      type: git
      url: https://github.com/opspresso/argocd-env-addons
    env-demo-repo:
      name: env-demo
      type: git
      url: https://github.com/opspresso/argocd-env-demo
    opspresso-repo:
      name: opspresso
      type: helm
      url: https://opspresso.github.io/helm-charts

