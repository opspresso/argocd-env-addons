argocd:
  namespace: argocd
  service: argocd-server
  ports: ["8080:80"]
  url: http://localhost:8080
postgres:
  namespace: agent-studio
  service: postgres
  ports: ["5432:5432"]
  url: postgresql://localhost:5432/agent_studio
minio:
  namespace: agent-studio
  service: minio
  ports: ["9000:9000"]
  url: http://localhost:9000
neo4j:
  namespace: agent-memory
  service: memory-neo4j
  ports: ["7687:7687", "7474:7474"]
  url: bolt://localhost:7687
mcp-argocd:
  namespace: agent-mcps
  service: mcp-argocd
  ports: ["8081:80"]
  url: http://localhost:8081/mcp
mcp-cloudwatch:
  namespace: agent-mcps
  service: mcp-cloudwatch
  ports: ["8083:80"]
  url: http://localhost:8083/mcp
mcp-kubernetes:
  namespace: agent-mcps
  service: mcp-kubernetes
  ports: ["8084:80"]
  url: http://localhost:8084/mcp
mcp-grafana:
  namespace: agent-mcps
  service: mcp-grafana
  ports: ["8000:80"]
  url: http://localhost:8000/mcp
