# Copy to .local/credentials.yaml, fill the values, then apply to the selected local context.
# Keep the completed file private. Existing passwords and tokens must be reused on upgrades.
apiVersion: v1
kind: Namespace
metadata:
  name: local
---
apiVersion: v1
kind: Secret
metadata:
  name: local-credentials
  namespace: local
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD
  MINIO_ROOT_USER: REPLACE_MINIO_ROOT_USER
  MINIO_ROOT_PASSWORD: REPLACE_MINIO_ROOT_PASSWORD
  NEO4J_AUTH: neo4j/REPLACE_NEO4J_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: local-mcp-argocd
  namespace: local
type: Opaque
stringData:
  ARGOCD_API_TOKEN: REPLACE_EXISTING_LOCAL_ARGOCD_TOKEN
