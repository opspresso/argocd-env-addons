apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-system-policy
  namespace: argocd
  labels:
    opspresso.com/group: addons
    opspresso.com/cluster: k3s-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: addons
  destination:
    name: in-cluster
    namespace: kube-system
  source:
    repoURL: https://github.com/opspresso/argocd-env-addons.git
    targetRevision: HEAD
    path: charts/k3s-system-policy
    helm:
      releaseName: k3s-system-policy
      valueFiles:
        - values.yaml
        - k3s/values-k3s-demo.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
