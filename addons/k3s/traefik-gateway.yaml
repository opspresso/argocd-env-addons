apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-gateway-k3s
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: addons
  destination:
    name: in-cluster
    namespace: traefik-gateway
  source:
    repoURL: https://github.com/opspresso/argocd-env-addons.git
    targetRevision: HEAD
    path: charts/traefik-gateway
    helm:
      valueFiles:
        - values.yaml
        - k3s/values-k3s-demo.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
