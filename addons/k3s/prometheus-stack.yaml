apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-k3s
  namespace: argocd
  labels:
    opspresso.com/group: addons
    opspresso.com/cluster: k3s-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: addons
  destination:
    name: in-cluster
    namespace: addon-prometheus
  source:
    repoURL: https://github.com/opspresso/argocd-env-addons.git
    targetRevision: HEAD
    path: charts/prometheus-stack
    helm:
      releaseName: prometheus-k3s-demo
      valueFiles:
        - values.yaml
        - k3s/values-k3s-demo.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
